<title>Notelet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f5f1;
    --surface:#ffffff;
    --surface-2:#edeae1;
    --surface-3:#e3ded0;
    --ink:#22262b;
    --ink-muted:#5b6169;
    --ink-faint:#9a9c8f;
    --border:#dad6cc;
    --border-strong:#c7c2b4;
    --accent:#2b5f63;
    --accent-ink:#f3f6f5;
    --accent-soft:#dce7e6;
    --accent-2:#b5762a;
    --danger:#a23b3b;
    --danger-soft:#f3dfda;
    --danger-ink:#fbf3f1;
    --shadow-sm:0 1px 2px rgba(30,32,28,0.07);
    --shadow-md:0 6px 20px rgba(30,32,28,0.10);
    --tab-0:#2b5f63;
    --tab-1:#b5762a;
    --tab-2:#6b7e4e;
    --tab-3:#a2543a;
    --tab-4:#52607a;
    --tab-5:#7a5273;
    --sticky-0:#f4e4a6;
    --sticky-1:#cbdcc2;
    --sticky-2:#c9dce2;
    --sticky-3:#ecc9ac;
    --sticky-4:#dccbe3;
    --sticky-ink:#3a3320;

    --font-display:'Fraunces','Iowan Old Style','Palatino Linotype',Georgia,serif;
    --font-ui:'IBM Plex Sans','Segoe UI',system-ui,-apple-system,sans-serif;
    --font-serif:'Source Serif 4',Georgia,'Times New Roman',serif;
    --font-mono:'IBM Plex Mono','SF Mono',Consolas,'Liberation Mono',monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1a1c1d;
      --surface:#232628;
      --surface-2:#1f2223;
      --surface-3:#2a2d2e;
      --ink:#e9e6dd;
      --ink-muted:#a6ab9f;
      --ink-faint:#6f746a;
      --border:#35383a;
      --border-strong:#454847;
      --accent:#7ac1c5;
      --accent-ink:#0f2223;
      --accent-soft:#213537;
      --accent-2:#dfa658;
      --danger:#e08b7f;
      --danger-soft:#3a2726;
      --danger-ink:#2a1a19;
      --shadow-sm:0 1px 2px rgba(0,0,0,0.35);
      --shadow-md:0 10px 26px rgba(0,0,0,0.45);
      --tab-0:#7ac1c5;
      --tab-1:#dfa658;
      --tab-2:#9db178;
      --tab-3:#cf8163;
      --tab-4:#8b97b3;
      --tab-5:#b184a8;
      --sticky-0:#6e6338;
      --sticky-1:#3f5439;
      --sticky-2:#3a5058;
      --sticky-3:#6a4a34;
      --sticky-4:#4d3f5c;
      --sticky-ink:#efe9d8;
    }
  }
  :root[data-theme="dark"]{
    --bg:#1a1c1d;
    --surface:#232628;
    --surface-2:#1f2223;
    --surface-3:#2a2d2e;
    --ink:#e9e6dd;
    --ink-muted:#a6ab9f;
    --ink-faint:#6f746a;
    --border:#35383a;
    --border-strong:#454847;
    --accent:#7ac1c5;
    --accent-ink:#0f2223;
    --accent-soft:#213537;
    --accent-2:#dfa658;
    --danger:#e08b7f;
    --danger-soft:#3a2726;
    --danger-ink:#2a1a19;
    --shadow-sm:0 1px 2px rgba(0,0,0,0.35);
    --shadow-md:0 10px 26px rgba(0,0,0,0.45);
    --tab-0:#7ac1c5;
    --tab-1:#dfa658;
    --tab-2:#9db178;
    --tab-3:#cf8163;
    --tab-4:#8b97b3;
    --tab-5:#b184a8;
    --sticky-0:#6e6338;
    --sticky-1:#3f5439;
    --sticky-2:#3a5058;
    --sticky-3:#6a4a34;
    --sticky-4:#4d3f5c;
    --sticky-ink:#efe9d8;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-ui);
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }

  button{font-family:inherit; cursor:pointer;}
  input,textarea,button{color:inherit;}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

  .app{
    display:grid;
    grid-template-columns:264px 1fr;
    height:100vh;
    background:
      radial-gradient(ellipse at top left, rgba(43,95,99,0.05), transparent 55%),
      var(--bg);
  }

  /* ---------- Rail ---------- */
  .rail{
    background:var(--surface-3);
    border-right:1px solid var(--border);
    display:flex;
    flex-direction:column;
    min-width:0;
    height:100vh;
  }
  .rail-head{
    padding:22px 18px 10px;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .brand-mark{
    flex:none;
    display:block;
  }
  .wordmark{
    font-family:var(--font-display);
    font-weight:600;
    font-size:1.5rem;
    margin:0;
    letter-spacing:0.2px;
    display:flex;
    align-items:baseline;
    gap:8px;
  }
  .wordmark .dot{color:var(--accent-2); font-style:italic;}
  .btn-new{
    margin:14px 18px 10px;
    padding:9px 12px;
    background:var(--accent);
    color:var(--accent-ink);
    border:none;
    border-radius:6px;
    font-weight:600;
    font-size:0.86rem;
    box-shadow:var(--shadow-sm);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .btn-new:hover{transform:translateY(-1px); box-shadow:var(--shadow-md);}
  .btn-new:active{transform:translateY(0);}

  .search-wrap{margin:0 18px 8px;}
  .search-wrap input{
    width:100%;
    padding:7px 10px;
    border:1px solid var(--border-strong);
    background:var(--surface);
    border-radius:6px;
    font-size:0.85rem;
    color:var(--ink);
  }
  .search-wrap input::placeholder{color:var(--ink-faint);}

  .sort-row{
    display:flex;
    gap:4px;
    margin:0 18px 10px;
  }
  .sort-btn{
    flex:1;
    background:transparent;
    border:1px solid transparent;
    color:var(--ink-muted);
    font-size:0.7rem;
    text-transform:uppercase;
    letter-spacing:0.06em;
    padding:5px 4px;
    border-radius:5px;
  }
  .sort-btn.active{
    background:var(--surface);
    border-color:var(--border);
    color:var(--ink);
    font-weight:600;
  }

  .note-list{
    list-style:none;
    margin:0;
    padding:2px 10px 10px;
    overflow-y:auto;
    flex:1;
    min-height:0;
  }
  .note-row{
    display:flex;
    gap:8px;
    align-items:center;
    padding:6px 8px;
    border-radius:6px;
    cursor:pointer;
    position:relative;
    border:1px solid transparent;
    line-height:1.2;
  }
  .note-row:hover{background:var(--surface);}
  .note-row.open{background:var(--surface); border-color:var(--border);}
  .note-row.active{background:var(--accent-soft); border-color:var(--accent);}
  .note-chip{
    width:7px; height:7px; border-radius:50%;
    flex:none;
    background:var(--tab-color, var(--accent));
  }
  .note-subject{
    font-size:0.84rem;
    font-weight:600;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    flex:1;
    min-width:0;
  }
  .note-date{
    font-size:0.68rem;
    color:var(--ink-faint);
    font-variant-numeric:tabular-nums;
    flex:none;
    white-space:nowrap;
  }
  .note-del{
    background:transparent;
    border:none;
    color:var(--ink-faint);
    font-size:0.9rem;
    line-height:1;
    padding:3px 4px;
    border-radius:4px;
    opacity:0;
    flex:none;
  }
  .note-row:hover .note-del{opacity:1;}
  .note-row:hover .note-date{display:none;}
  .note-del:hover{color:var(--danger); background:var(--danger-soft);}

  .empty-list{
    padding:18px 8px;
    color:var(--ink-faint);
    font-size:0.82rem;
    line-height:1.5;
  }

  .file-status{
    margin:0 18px 10px;
  }
  .file-note{
    font-size:0.7rem;
    color:var(--ink-faint);
    padding:2px 2px;
    line-height:1.4;
  }
  .file-link-btn{
    width:100%;
    padding:7px 10px;
    border:1px dashed var(--border-strong);
    background:transparent;
    color:var(--ink-muted);
    border-radius:6px;
    font-size:0.74rem;
    text-align:left;
  }
  .file-link-btn:hover{background:var(--surface); color:var(--ink); border-color:var(--accent);}
  .file-linked{
    display:flex;
    align-items:center;
    gap:6px;
    padding:6px 8px;
    border:1px solid var(--border);
    border-radius:6px;
    background:var(--surface);
    font-size:0.74rem;
  }
  .file-name{
    color:var(--ink-muted);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    flex:1;
    min-width:0;
  }
  .file-tick{
    font-size:0.68rem;
    opacity:0;
    transition:opacity .3s ease;
    flex:none;
  }
  .file-tick.show{opacity:1;}
  .file-unlink{
    background:transparent;
    border:none;
    color:var(--ink-faint);
    font-size:0.8rem;
    padding:2px 4px;
    border-radius:4px;
    flex:none;
  }
  .file-unlink:hover{color:var(--danger); background:var(--danger-soft);}

  .rail-foot{
    display:flex;
    align-items:center;
    gap:6px;
    padding:10px 14px;
    border-top:1px solid var(--border);
  }
  .icon-btn{
    background:transparent;
    border:1px solid var(--border);
    color:var(--ink-muted);
    width:30px; height:30px;
    border-radius:6px;
    font-size:0.85rem;
    display:flex; align-items:center; justify-content:center;
  }
  .icon-btn:hover{background:var(--surface); color:var(--ink);}
  .icon-btn.on{background:var(--accent-soft); color:var(--accent); border-color:var(--accent);}
  .count{
    margin-left:auto;
    font-size:0.72rem;
    color:var(--ink-faint);
    font-variant-numeric:tabular-nums;
  }

  /* ---------- Workspace ---------- */
  .workspace{
    display:flex;
    flex-direction:column;
    min-width:0;
    height:100vh;
  }
  .tabstrip{
    display:flex;
    align-items:flex-end;
    gap:0;
    padding:14px 24px 0;
    overflow-x:auto;
    flex:none;
    scrollbar-width:thin;
  }
  .tab{
    display:flex;
    align-items:center;
    gap:7px;
    max-width:200px;
    padding:9px 14px 10px 16px;
    margin-right:-9px;
    background:var(--surface-2);
    color:var(--ink-muted);
    border:1px solid var(--border);
    border-bottom:none;
    clip-path:polygon(10px 0, 100% 0, calc(100% - 6px) 100%, 0 100%);
    font-size:0.82rem;
    position:relative;
    z-index:1;
  }
  .tab:hover{color:var(--ink);}
  .tab.active{
    background:var(--surface);
    color:var(--ink);
    font-weight:600;
    z-index:3;
    box-shadow:0 -3px 8px rgba(30,32,28,0.06);
  }
  .tab-chip{
    width:7px; height:7px; border-radius:50%;
    flex:none;
    background:var(--tab-color, var(--accent));
  }
  .tab-label{
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .tab-close{
    background:transparent;
    border:none;
    color:inherit;
    opacity:0.55;
    font-size:0.85rem;
    line-height:1;
    padding:2px;
    border-radius:3px;
    flex:none;
  }
  .tab-close:hover{opacity:1; background:var(--danger-soft); color:var(--danger);}

  .tab.pinned{
    clip-path:none;
    border-radius:6px 6px 0 0;
    margin-right:14px;
    padding:9px 14px 10px;
  }
  .tab-pin-icon{
    width:8px; height:8px;
    border-radius:2px;
    flex:none;
    background:var(--accent-2);
    transform:rotate(-10deg);
  }

  .page{
    flex:1;
    min-height:0;
    background:var(--surface);
    border-top:1px solid var(--border);
    display:flex;
    flex-direction:column;
    position:relative;
  }
  .page::before{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;
    background-image:repeating-linear-gradient(180deg, rgba(90,90,70,0.018) 0px, rgba(90,90,70,0.018) 1px, transparent 1px, transparent 34px);
    opacity:0.5;
  }
  .page-inner{
    max-width:760px;
    width:100%;
    margin:0 auto;
    padding:38px 40px 30px;
    display:flex;
    flex-direction:column;
    flex:1;
    min-height:0;
  }
  .subject-input{
    font-family:var(--font-display);
    font-weight:600;
    font-size:2rem;
    border:none;
    background:transparent;
    color:var(--ink);
    padding:0;
    width:100%;
    text-wrap:balance;
  }
  .subject-input::placeholder{color:var(--ink-faint); font-style:italic;}
  .meta-row{
    display:flex;
    align-items:center;
    gap:16px;
    margin-top:8px;
    padding-bottom:16px;
    border-bottom:1px solid var(--border);
    font-size:0.76rem;
    color:var(--ink-faint);
    font-variant-numeric:tabular-nums;
  }
  .meta-row .dot-sep{opacity:0.6;}
  .save-tick{
    margin-left:auto;
    color:var(--accent);
    opacity:0;
    transition:opacity .3s ease;
  }
  .save-tick.show{opacity:1;}

  .content-area{
    flex:1;
    min-height:0;
    border:none;
    background:transparent;
    resize:none;
    width:100%;
    padding:22px 0 10px;
    font-size:1.02rem;
    line-height:1.75;
    color:var(--ink);
  }
  .content-area.font-serif{font-family:var(--font-serif);}
  .content-area.font-mono{font-family:var(--font-mono); font-size:0.92rem; line-height:1.65;}
  .content-area::placeholder{color:var(--ink-faint);}

  .empty-workspace{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:14px;
    color:var(--ink-faint);
    text-align:center;
    padding:20px;
  }
  .empty-workspace h2{
    font-family:var(--font-display);
    font-weight:500;
    font-size:1.3rem;
    color:var(--ink-muted);
    margin:0;
  }
  .empty-workspace p{margin:0; font-size:0.85rem; max-width:340px;}
  .empty-workspace button{
    padding:8px 16px;
    background:var(--accent);
    color:var(--accent-ink);
    border:none;
    border-radius:6px;
    font-weight:600;
    font-size:0.85rem;
  }

  /* ---------- Sticky board ---------- */
  .sticky-board-wrap{
    flex:1;
    min-height:0;
    overflow-y:auto;
    position:relative;
  }
  .sticky-board-head{
    padding:34px 40px 4px;
    max-width:920px;
    margin:0 auto;
  }
  .sticky-board-head h2{
    font-family:var(--font-display);
    font-weight:600;
    font-size:1.6rem;
    margin:0;
  }
  .sticky-board-head p{
    margin:4px 0 0;
    font-size:0.82rem;
    color:var(--ink-faint);
  }
  .sticky-board{
    max-width:920px;
    margin:0 auto;
    padding:18px 40px 40px;
    display:flex;
    flex-wrap:wrap;
    gap:22px;
    align-content:flex-start;
  }
  .sticky-card{
    width:190px;
    min-height:160px;
    padding:14px 14px 10px;
    border-radius:3px;
    background:var(--sticky-color, var(--sticky-0));
    color:var(--sticky-ink);
    box-shadow:var(--shadow-md);
    display:flex;
    flex-direction:column;
    position:relative;
    transform:rotate(var(--sticky-tilt, 0deg));
    transition:transform .15s ease;
  }
  .sticky-card:hover, .sticky-card:focus-within{
    transform:rotate(0deg) translateY(-2px);
    z-index:2;
  }
  .sticky-card textarea{
    flex:1;
    border:none;
    background:transparent;
    resize:none;
    width:100%;
    font-family:var(--font-display);
    font-style:italic;
    font-weight:500;
    font-size:0.95rem;
    line-height:1.4;
    color:inherit;
    padding:0;
  }
  .sticky-card textarea::placeholder{color:inherit; opacity:0.5;}
  .sticky-card textarea:focus-visible{outline-offset:-3px; border-radius:2px;}
  .sticky-card-foot{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:6px;
  }
  .sticky-card-date{
    font-size:0.64rem;
    opacity:0.6;
    font-variant-numeric:tabular-nums;
  }
  .sticky-del{
    background:transparent;
    border:none;
    color:inherit;
    opacity:0.45;
    font-size:0.85rem;
    line-height:1;
    padding:2px 4px;
    border-radius:3px;
  }
  .sticky-del:hover{opacity:1; background:rgba(0,0,0,0.08);}
  .sticky-add{
    width:190px;
    min-height:160px;
    border:1.5px dashed var(--border-strong);
    border-radius:3px;
    background:transparent;
    color:var(--ink-faint);
    font-size:1.8rem;
    font-family:var(--font-display);
  }
  .sticky-add:hover{border-color:var(--accent); color:var(--accent); background:var(--surface);}

  /* ---------- Modal ---------- */
  .modal-backdrop{
    position:fixed; inset:0;
    background:rgba(20,20,18,0.42);
    display:flex; align-items:center; justify-content:center;
    z-index:50;
    padding:20px;
  }
  .modal-backdrop[hidden]{
    display:none;
  }
  .modal{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:10px;
    width:100%;
    max-width:460px;
    box-shadow:var(--shadow-md);
    padding:22px 22px 18px;
  }
  .modal h3{
    margin:0 0 8px;
    font-family:var(--font-display);
    font-weight:600;
    font-size:1.15rem;
  }
  .modal p{margin:0 0 16px; color:var(--ink-muted); font-size:0.88rem; line-height:1.5;}
  .modal textarea{
    width:100%;
    height:150px;
    font-family:var(--font-mono);
    font-size:0.76rem;
    border:1px solid var(--border);
    border-radius:6px;
    padding:10px;
    background:var(--surface-2);
    color:var(--ink);
    resize:vertical;
  }
  .modal-row{display:flex; gap:8px; justify-content:flex-end; margin-top:16px;}
  .modal-row.between{justify-content:space-between; align-items:center;}
  .btn{
    padding:8px 14px;
    border-radius:6px;
    font-size:0.85rem;
    font-weight:600;
    border:1px solid var(--border-strong);
    background:var(--surface);
    color:var(--ink);
  }
  .btn:hover{background:var(--surface-2);}
  .btn.primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}
  .btn.danger{background:var(--danger); color:var(--danger-ink); border-color:var(--danger);}
  .btn.ghost{background:transparent; border-color:transparent; color:var(--ink-muted);}
  .modal-label{font-size:0.72rem; text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-faint); margin:14px 0 6px;}
  .modal-status{font-size:0.78rem; color:var(--accent); min-height:1em;}

  ::-webkit-scrollbar{width:10px; height:10px;}
  ::-webkit-scrollbar-thumb{background:var(--border-strong); border-radius:6px;}
  ::-webkit-scrollbar-track{background:transparent;}

  @media (max-width:640px){
    .app{grid-template-columns:1fr;}
    .rail{display:none;}
  }
</style>

<div class="app">
  <aside class="rail">
    <div class="rail-head">
      <svg class="brand-mark" width="28" height="28" viewBox="0 0 30 30" aria-hidden="true">
        <circle cx="15" cy="15" r="15" fill="var(--accent)"/>
        <path d="M15 7.5 C18.6 12.8 20.5 16.2 20.5 19 C20.5 22.5 18.14 24.3 15 24.3 C11.86 24.3 9.5 22.5 9.5 19 C9.5 16.2 11.4 12.8 15 7.5 Z" fill="var(--accent-ink)"/>
      </svg>
      <h1 class="wordmark">Notelet<span class="dot">.</span></h1>
    </div>
    <button class="btn-new" id="newNoteBtn">+ New note</button>
    <div class="search-wrap">
      <input id="searchInput" placeholder="Search notes…" autocomplete="off" />
    </div>
    <div class="sort-row" role="group" aria-label="Sort notes">
      <button data-sort="newest" class="sort-btn active">Newest</button>
      <button data-sort="oldest" class="sort-btn">Oldest</button>
      <button data-sort="az" class="sort-btn">A–Z</button>
    </div>
    <ul class="note-list" id="noteList"></ul>
    <div class="file-status" id="fileStatus"></div>
    <div class="rail-foot">
      <button id="fontToggle" class="icon-btn" title="Toggle note font (serif / mono)">Aa</button>
      <button id="themeToggle" class="icon-btn" title="Toggle theme">◐</button>
      <button id="backupBtn" class="icon-btn" title="Backup or restore your notes as JSON">⇅</button>
      <span class="count" id="noteCount"></span>
    </div>
  </aside>

  <main class="workspace">
    <div class="tabstrip" id="tabstrip"></div>
    <div class="page" id="pageArea"></div>
  </main>
</div>

<div class="modal-backdrop" id="modalBackdrop" hidden>
  <div class="modal" id="modal"></div>
</div>
<input type="file" id="importFileInput" accept="application/json,.json" hidden>

<script>
(function(){
  "use strict";

  var STORAGE_KEY = "notelet:v1";
  var LEGACY_STORAGE_KEY = "inkwell:v1"; // this app used to be called Inkwell
  var TAB_COUNT = 6;
  var STICKY_TAB_ID = "__stickies__";

  function uid(){
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return "n-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2,9);
  }

  function nowIso(){ return new Date().toISOString(); }

  function welcomeNote(){
    var id = uid();
    var note = {
      id: id,
      subject: "Welcome to Notelet",
      color: 0,
      createdAt: nowIso(),
      updatedAt: nowIso(),
      content:
"This is a small notebook that lives entirely in this browser tab.\n\n" +
"— Click “+ New note” to start one. Every note gets a created date that never changes.\n" +
"— Notes you open stay open as tabs above, in order, even if you close this page and come back — until you click the × on a tab yourself.\n" +
"— The pinned “Stickies” tab on the far left is always there — a quick corkboard for short scratch notes that don't need a subject or their own tab.\n" +
"— Use the search box to filter the list on the left, and the sort buttons to reorder it.\n" +
"— “Aa” switches the writing font between serif prose and monospace (handy for logs, timestamps, hashes).\n" +
"— “⇅” opens Backup & restore — save a .json file of your notes, or load one back in.\n\n" +
"Everything is saved automatically to this browser's local storage as you type. On Chrome or Edge, the sidebar also lets you link a local file so every change autosaves straight to disk.\n\n" +
"Delete this note whenever you're ready to start your own."
    };
    return note;
  }

  function welcomeSticky(){
    return {
      id: uid(),
      text: "Quick, unfiled thoughts go here. This board is always one click away on the left.",
      color: 0,
      createdAt: nowIso()
    };
  }

  function defaultState(){
    var w = welcomeNote();
    var notes = {};
    notes[w.id] = w;
    return {
      notes: notes,
      openTabs: [w.id],
      activeId: w.id,
      stickies: [welcomeSticky()],
      contentFont: "serif",
      sort: "newest",
      theme: null
    };
  }

  function load(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw){
        // one-time migration: this app used to be called Inkwell
        try{
          var legacy = localStorage.getItem(LEGACY_STORAGE_KEY);
          if (legacy){
            localStorage.setItem(STORAGE_KEY, legacy);
            raw = legacy;
          }
        }catch(e){}
      }
      if (!raw) return defaultState();
      var parsed = JSON.parse(raw);
      if (!parsed || typeof parsed !== "object" || !parsed.notes) return defaultState();
      if (!parsed.openTabs) parsed.openTabs = [];
      if (!parsed.contentFont) parsed.contentFont = "serif";
      if (!parsed.sort) parsed.sort = "newest";
      if (!Array.isArray(parsed.stickies)) parsed.stickies = [];
      return parsed;
    }catch(e){
      console.warn("Notelet: could not read saved notes, starting fresh.", e);
      return defaultState();
    }
  }

  var state = load();
  var saveTimer = null;
  var editTimer = null;

  function persist(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      return true;
    }catch(e){
      console.warn("Notelet: could not save notes.", e);
      return false;
    }
  }

  function scheduleSave(showTick){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function(){
      persist();
      if (showTick) flashSaved();
      renderRailList();
      renderTabs();
      writeToFile();
    }, 420);
  }

  // ---------- local file autosave (File System Access API) ----------
  var fsSupported = (typeof window.showSaveFilePicker === "function");
  var fileHandle = null;

  // ---------- one-shot save via the hosted page's downloads capability ----------
  var downloadsNSPromise = null;
  function getDownloadsCapability(){
    if (downloadsNSPromise) return downloadsNSPromise;
    downloadsNSPromise = (async function(){
      try{
        if (typeof window.claude === "undefined" || typeof window.claude.use !== "function") return null;
        return await window.claude.use("downloads");
      }catch(e){ return null; }
    })();
    return downloadsNSPromise;
  }

  function idbOpen(){
    return new Promise(function(resolve, reject){
      try{
        if (!window.indexedDB){ reject(new Error("no indexedDB")); return; }
        var req = indexedDB.open("notelet-fs", 1);
        req.onupgradeneeded = function(){ req.result.createObjectStore("handles"); };
        req.onsuccess = function(){ resolve(req.result); };
        req.onerror = function(){ reject(req.error); };
      }catch(e){ reject(e); }
    });
  }
  function idbSet(key, val){
    return idbOpen().then(function(db){
      return new Promise(function(resolve, reject){
        var tx = db.transaction("handles", "readwrite");
        tx.objectStore("handles").put(val, key);
        tx.oncomplete = function(){ resolve(); };
        tx.onerror = function(){ reject(tx.error); };
      });
    });
  }
  function idbGet(key){
    return idbOpen().then(function(db){
      return new Promise(function(resolve, reject){
        var tx = db.transaction("handles", "readonly");
        var r = tx.objectStore("handles").get(key);
        r.onsuccess = function(){ resolve(r.result); };
        r.onerror = function(){ reject(r.error); };
      });
    });
  }
  function idbDel(key){
    return idbOpen().then(function(db){
      return new Promise(function(resolve, reject){
        var tx = db.transaction("handles", "readwrite");
        tx.objectStore("handles").delete(key);
        tx.oncomplete = function(){ resolve(); };
        tx.onerror = function(){ reject(tx.error); };
      });
    });
  }

  function renderFileStatus(msg, isError){
    var el = document.getElementById("fileStatus");
    if (!el) return;
    el.innerHTML = "";

    if (!fsSupported){
      var note = document.createElement("div");
      note.className = "file-note";
      note.textContent = "Continuous local-file autosave needs Chrome or Edge. Use Backup & restore below to save a copy here.";
      el.appendChild(note);
      return;
    }

    if (!fileHandle){
      var btn = document.createElement("button");
      btn.className = "file-link-btn";
      btn.textContent = "⭳  Link a local file to autosave";
      btn.addEventListener("click", linkLocalFile);
      el.appendChild(btn);
      if (msg){
        var errNote = document.createElement("div");
        errNote.className = "file-note";
        errNote.style.color = isError ? "var(--danger)" : "var(--accent)";
        errNote.textContent = msg;
        el.appendChild(errNote);
      }
      return;
    }

    var wrap = document.createElement("div");
    wrap.className = "file-linked";
    var name = document.createElement("span");
    name.className = "file-name";
    name.textContent = "⭳ " + fileHandle.name;
    wrap.appendChild(name);

    var tick = document.createElement("span");
    tick.className = "file-tick" + (msg ? " show" : "");
    tick.style.color = isError ? "var(--danger)" : "var(--accent)";
    tick.textContent = msg || "";
    wrap.appendChild(tick);

    var unlink = document.createElement("button");
    unlink.className = "file-unlink";
    unlink.title = "Stop autosaving to this file";
    unlink.textContent = "✕";
    unlink.addEventListener("click", unlinkLocalFile);
    wrap.appendChild(unlink);

    el.appendChild(wrap);
  }

  function renderReconnectPrompt(){
    var el = document.getElementById("fileStatus");
    if (!el) return;
    el.innerHTML = "";
    var btn = document.createElement("button");
    btn.className = "file-link-btn";
    btn.textContent = "⭳  Reconnect " + (fileHandle ? fileHandle.name : "local file");
    btn.addEventListener("click", async function(){
      try{
        var perm = await fileHandle.requestPermission({ mode: "readwrite" });
        if (perm === "granted"){ await writeToFile(); renderFileStatus(); }
        else { renderFileStatus("Permission denied", true); }
      }catch(e){ renderFileStatus("Couldn't reconnect", true); }
    });
    el.appendChild(btn);
  }

  async function linkLocalFile(){
    try{
      var handle = await window.showSaveFilePicker({
        suggestedName: "notelet-notes.json",
        types: [{ description: "JSON", accept: { "application/json": [".json"] } }]
      });
      fileHandle = handle;
      try{ await idbSet("notesFile", handle); }catch(e){}
      await writeToFile();
      renderFileStatus("Linked");
      setTimeout(function(){ renderFileStatus(); }, 1400);
    }catch(e){
      if (e && e.name === "AbortError") return;
      console.warn("Notelet: file link failed", e);
      renderFileStatus("Couldn't link a file here — use Backup & restore instead", true);
      setTimeout(function(){ renderFileStatus(); }, 3200);
    }
  }

  async function unlinkLocalFile(){
    fileHandle = null;
    try{ await idbDel("notesFile"); }catch(e){}
    renderFileStatus();
  }

  function backupPayload(){
    return JSON.stringify({ notes: state.notes, stickies: state.stickies }, null, 2);
  }

  async function writeToFile(){
    if (!fileHandle) return;
    try{
      var perm = await fileHandle.queryPermission({ mode: "readwrite" });
      if (perm !== "granted"){
        renderReconnectPrompt();
        return;
      }
      var writable = await fileHandle.createWritable();
      await writable.write(backupPayload());
      await writable.close();
      renderFileStatus("Saved");
      setTimeout(function(){ renderFileStatus(); }, 1400);
    }catch(e){
      console.warn("Notelet: could not write local file", e);
      renderFileStatus("Couldn't save to file", true);
    }
  }

  async function tryReconnectFile(){
    if (!fsSupported){ renderFileStatus(); return; }
    try{
      var handle = await idbGet("notesFile");
      if (!handle){ renderFileStatus(); return; }
      var perm = await handle.queryPermission({ mode: "readwrite" });
      fileHandle = handle;
      if (perm === "granted"){
        renderFileStatus();
      } else {
        renderReconnectPrompt();
      }
    }catch(e){
      renderFileStatus();
    }
  }

  // ---------- theme ----------
  function applyTheme(){
    var root = document.documentElement;
    if (state.theme === "light" || state.theme === "dark"){
      root.setAttribute("data-theme", state.theme);
    } else {
      root.removeAttribute("data-theme");
    }
    var btn = document.getElementById("themeToggle");
    btn.textContent = state.theme === "dark" ? "☀" : state.theme === "light" ? "◐" : "◑";
    btn.classList.toggle("on", !!state.theme);
    btn.title = state.theme === "dark" ? "Using dark theme — click for system default"
      : state.theme === "light" ? "Using light theme — click for dark"
      : "Using system theme — click for light";
  }

  document.getElementById("themeToggle").addEventListener("click", function(){
    state.theme = state.theme === null ? "light" : state.theme === "light" ? "dark" : null;
    applyTheme();
    persist();
  });

  // ---------- font ----------
  function applyFontBtn(){
    var btn = document.getElementById("fontToggle");
    btn.classList.toggle("on", state.contentFont === "mono");
    btn.title = state.contentFont === "mono" ? "Monospace — click for serif" : "Serif — click for monospace";
  }
  document.getElementById("fontToggle").addEventListener("click", function(){
    state.contentFont = state.contentFont === "mono" ? "serif" : "mono";
    applyFontBtn();
    persist();
    renderPage();
  });

  // ---------- helpers ----------
  function noteList(){
    var arr = Object.keys(state.notes).map(function(k){ return state.notes[k]; });
    var q = document.getElementById("searchInput").value.trim().toLowerCase();
    if (q){
      arr = arr.filter(function(n){
        return (n.subject || "").toLowerCase().indexOf(q) !== -1 ||
               (n.content || "").toLowerCase().indexOf(q) !== -1;
      });
    }
    arr.sort(function(a,b){
      if (state.sort === "az") return (a.subject||"").localeCompare(b.subject||"");
      if (state.sort === "oldest") return a.createdAt.localeCompare(b.createdAt);
      return b.createdAt.localeCompare(a.createdAt);
    });
    return arr;
  }

  var dateFmt = new Intl.DateTimeFormat(undefined, { month:"short", day:"numeric", year:"numeric" });
  var dateFmtShort = new Intl.DateTimeFormat(undefined, { month:"short", day:"numeric" });
  var timeFmt = new Intl.DateTimeFormat(undefined, { hour:"numeric", minute:"2-digit" });
  function fmtDate(iso){ try { return dateFmt.format(new Date(iso)); } catch(e){ return ""; } }
  function fmtDateShort(iso){ try { return dateFmtShort.format(new Date(iso)); } catch(e){ return ""; } }
  function fmtDateTime(iso){
    try { var d = new Date(iso); return dateFmt.format(d) + " · " + timeFmt.format(d); } catch(e){ return ""; }
  }

  function snippet(text){
    var s = (text || "").replace(/\s+/g, " ").trim();
    return s.length > 72 ? s.slice(0,72) + "…" : s;
  }

  function wordCount(text){
    var t = (text||"").trim();
    if (!t) return 0;
    return t.split(/\s+/).length;
  }

  // ---------- rail list ----------
  function renderRailList(){
    var ul = document.getElementById("noteList");
    ul.innerHTML = "";
    var list = noteList();
    var count = Object.keys(state.notes).length;
    document.getElementById("noteCount").textContent = count + (count === 1 ? " note" : " notes");

    if (!list.length){
      var empty = document.createElement("li");
      empty.className = "empty-list";
      empty.textContent = count === 0 ? "No notes yet." : "No notes match your search.";
      ul.appendChild(empty);
      return;
    }

    list.forEach(function(note){
      var li = document.createElement("li");
      li.className = "note-row" + (state.openTabs.indexOf(note.id) !== -1 ? " open" : "") + (state.activeId === note.id ? " active" : "");

      var chip = document.createElement("span");
      chip.className = "note-chip";
      chip.style.setProperty("--tab-color", "var(--tab-" + (note.color % TAB_COUNT) + ")");
      li.appendChild(chip);

      var subj = document.createElement("span");
      subj.className = "note-subject";
      subj.textContent = note.subject || "Untitled note";
      li.appendChild(subj);

      var date = document.createElement("span");
      date.className = "note-date";
      date.textContent = fmtDateShort(note.createdAt);
      li.appendChild(date);

      li.title = (note.subject || "Untitled note") + " — created " + fmtDate(note.createdAt) + (note.content ? "\n" + snippet(note.content) : "");

      var del = document.createElement("button");
      del.className = "note-del";
      del.setAttribute("aria-label", "Delete note");
      del.textContent = "✕";
      del.addEventListener("click", function(ev){
        ev.stopPropagation();
        confirmDelete(note.id);
      });
      li.appendChild(del);

      li.addEventListener("click", function(){ openNote(note.id); });
      ul.appendChild(li);
    });
  }

  // ---------- tab strip ----------
  function renderTabs(){
    var strip = document.getElementById("tabstrip");
    strip.innerHTML = "";

    var pinned = document.createElement("div");
    pinned.className = "tab pinned" + (state.activeId === STICKY_TAB_ID ? " active" : "");
    var pinIcon = document.createElement("span");
    pinIcon.className = "tab-pin-icon";
    pinned.appendChild(pinIcon);
    var pinLabel = document.createElement("span");
    pinLabel.className = "tab-label";
    pinLabel.textContent = "Stickies";
    pinned.appendChild(pinLabel);
    pinned.addEventListener("click", function(){
      state.activeId = STICKY_TAB_ID;
      persist();
      renderTabs();
      renderPage();
      renderRailList();
    });
    strip.appendChild(pinned);

    state.openTabs.forEach(function(id){
      var note = state.notes[id];
      if (!note) return;
      var tab = document.createElement("div");
      tab.className = "tab" + (state.activeId === id ? " active" : "");

      var chip = document.createElement("span");
      chip.className = "tab-chip";
      chip.style.setProperty("--tab-color", "var(--tab-" + (note.color % TAB_COUNT) + ")");
      tab.appendChild(chip);

      var label = document.createElement("span");
      label.className = "tab-label";
      label.textContent = note.subject || "Untitled note";
      tab.appendChild(label);

      var close = document.createElement("button");
      close.className = "tab-close";
      close.setAttribute("aria-label", "Close tab");
      close.textContent = "✕";
      close.addEventListener("click", function(ev){
        ev.stopPropagation();
        closeTab(id);
      });
      tab.appendChild(close);

      tab.addEventListener("click", function(){
        state.activeId = id;
        persist();
        renderTabs();
        renderPage();
        renderRailList();
      });

      strip.appendChild(tab);
    });
  }

  // ---------- page ----------
  function renderPage(){
    var area = document.getElementById("pageArea");
    area.innerHTML = "";

    if (state.activeId === STICKY_TAB_ID){
      renderStickyBoard(area);
      return;
    }

    var note = state.notes[state.activeId];

    if (!note || state.openTabs.indexOf(state.activeId) === -1){
      var empty = document.createElement("div");
      empty.className = "empty-workspace";
      var h = document.createElement("h2");
      h.textContent = state.openTabs.length ? "Select a tab" : "Nothing open";
      var p = document.createElement("p");
      p.textContent = state.openTabs.length
        ? "Choose a tab above, or pick a note from the list."
        : "Open a note from the list on the left, or start a new one.";
      var btn = document.createElement("button");
      btn.textContent = "+ New note";
      btn.addEventListener("click", createNote);
      empty.appendChild(h); empty.appendChild(p); empty.appendChild(btn);
      area.appendChild(empty);
      return;
    }

    var inner = document.createElement("div");
    inner.className = "page-inner";

    var subjectInput = document.createElement("input");
    subjectInput.className = "subject-input";
    subjectInput.placeholder = "Untitled note";
    subjectInput.value = note.subject || "";
    subjectInput.setAttribute("aria-label", "Note subject");
    subjectInput.setAttribute("autocomplete", "off");
    subjectInput.setAttribute("autocapitalize", "sentences");
    subjectInput.setAttribute("spellcheck", "true");
    subjectInput.addEventListener("input", function(){
      note.subject = subjectInput.value;
      note.updatedAt = nowIso();
      updateMeta();
      scheduleSave(true);
      // keep tab label & rail row roughly in sync without waiting for full re-render
      var activeTabLabel = document.querySelector(".tab.active .tab-label");
      if (activeTabLabel) activeTabLabel.textContent = note.subject || "Untitled note";
    });
    inner.appendChild(subjectInput);

    var meta = document.createElement("div");
    meta.className = "meta-row";
    meta.id = "metaRow";
    inner.appendChild(meta);

    var contentArea = document.createElement("textarea");
    contentArea.className = "content-area font-" + state.contentFont;
    contentArea.placeholder = "Start writing…";
    contentArea.value = note.content || "";
    contentArea.setAttribute("aria-label", "Note content");
    contentArea.addEventListener("input", function(){
      note.content = contentArea.value;
      note.updatedAt = nowIso();
      updateMeta();
      scheduleSave(true);
    });
    inner.appendChild(contentArea);

    area.appendChild(inner);

    function updateMeta(){
      meta.innerHTML = "";
      var created = document.createElement("span");
      created.textContent = "Created " + fmtDate(note.createdAt);
      meta.appendChild(created);

      var sep1 = document.createElement("span");
      sep1.className = "dot-sep";
      sep1.textContent = "·";
      meta.appendChild(sep1);

      var edited = document.createElement("span");
      edited.textContent = "Edited " + fmtDateTime(note.updatedAt);
      meta.appendChild(edited);

      var sep2 = document.createElement("span");
      sep2.className = "dot-sep";
      sep2.textContent = "·";
      meta.appendChild(sep2);

      var words = document.createElement("span");
      words.textContent = wordCount(note.content) + " words";
      meta.appendChild(words);

      var tick = document.createElement("span");
      tick.className = "save-tick";
      tick.id = "saveTick";
      tick.textContent = "Saved";
      meta.appendChild(tick);
    }
    updateMeta();

    setTimeout(function(){ subjectInput.focus({preventScroll:true}); if (!note.subject) subjectInput.select(); }, 0);
  }

  // ---------- sticky board ----------
  var STICKY_COUNT = 5;

  function stickyTilt(id){
    // small, stable per-card rotation so the board doesn't reshuffle on every render
    var h = 0;
    for (var i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) >>> 0;
    return ((h % 500) / 100 - 2.5).toFixed(2) + "deg";
  }

  function renderStickyBoard(area){
    var wrap = document.createElement("div");
    wrap.className = "sticky-board-wrap";

    var head = document.createElement("div");
    head.className = "sticky-board-head";
    var h2 = document.createElement("h2");
    h2.textContent = "Stickies";
    var hp = document.createElement("p");
    hp.textContent = "Quick scratch notes — no subject, no tab of their own. Always here.";
    head.appendChild(h2); head.appendChild(hp);
    wrap.appendChild(head);

    var board = document.createElement("div");
    board.className = "sticky-board";

    state.stickies.forEach(function(s){
      board.appendChild(buildStickyCard(s));
    });

    var addBtn = document.createElement("button");
    addBtn.className = "sticky-add";
    addBtn.textContent = "+";
    addBtn.setAttribute("aria-label", "Add sticky note");
    addBtn.addEventListener("click", addSticky);
    board.appendChild(addBtn);

    wrap.appendChild(board);
    area.appendChild(wrap);
  }

  function buildStickyCard(s){
    var card = document.createElement("div");
    card.className = "sticky-card";
    card.style.setProperty("--sticky-color", "var(--sticky-" + (s.color % STICKY_COUNT) + ")");
    card.style.setProperty("--sticky-tilt", stickyTilt(s.id));

    var ta = document.createElement("textarea");
    ta.value = s.text || "";
    ta.placeholder = "Write something…";
    ta.setAttribute("aria-label", "Sticky note");
    ta.addEventListener("input", function(){
      s.text = ta.value;
      scheduleSave(false);
    });
    card.appendChild(ta);

    var foot = document.createElement("div");
    foot.className = "sticky-card-foot";
    var date = document.createElement("span");
    date.className = "sticky-card-date";
    date.textContent = fmtDateShort(s.createdAt);
    foot.appendChild(date);
    var del = document.createElement("button");
    del.className = "sticky-del";
    del.setAttribute("aria-label", "Delete sticky note");
    del.textContent = "✕";
    del.addEventListener("click", function(){ confirmDeleteSticky(s.id); });
    foot.appendChild(del);
    card.appendChild(foot);

    return card;
  }

  function addSticky(){
    var count = state.stickies.length;
    var s = { id: uid(), text: "", color: count % STICKY_COUNT, createdAt: nowIso() };
    state.stickies.push(s);
    persist();
    renderPage();
    var textareas = document.querySelectorAll(".sticky-card textarea");
    var last = textareas[textareas.length - 1];
    if (last) last.focus();
  }

  function deleteSticky(id){
    state.stickies = state.stickies.filter(function(s){ return s.id !== id; });
    persist();
    renderPage();
  }

  function confirmDeleteSticky(id){
    var s = state.stickies.filter(function(x){ return x.id === id; })[0];
    if (!s) return;
    if (!s.text || !s.text.trim()){
      deleteSticky(id);
      return;
    }
    modal.innerHTML = "";
    var h = document.createElement("h3"); h.textContent = "Delete this sticky?";
    var p = document.createElement("p"); p.textContent = "This can't be undone.";
    var row = document.createElement("div"); row.className = "modal-row";
    var cancel = document.createElement("button"); cancel.className = "btn ghost"; cancel.textContent = "Cancel";
    cancel.addEventListener("click", closeModal);
    var del = document.createElement("button"); del.className = "btn danger"; del.textContent = "Delete sticky";
    del.addEventListener("click", function(){ deleteSticky(id); closeModal(); });
    row.appendChild(cancel); row.appendChild(del);
    modal.appendChild(h); modal.appendChild(p); modal.appendChild(row);
    openModal();
    del.focus();
  }

  function flashSaved(){
    var tick = document.getElementById("saveTick");
    if (!tick) return;
    tick.classList.add("show");
    clearTimeout(flashSaved._t);
    flashSaved._t = setTimeout(function(){ tick.classList.remove("show"); }, 1400);
  }

  // ---------- actions ----------
  function openNote(id){
    if (state.openTabs.indexOf(id) === -1) state.openTabs.push(id);
    state.activeId = id;
    persist();
    renderTabs();
    renderPage();
    renderRailList();
  }

  function createNote(){
    var count = Object.keys(state.notes).length;
    var note = {
      id: uid(),
      subject: "",
      color: count % TAB_COUNT,
      createdAt: nowIso(),
      updatedAt: nowIso(),
      content: ""
    };
    state.notes[note.id] = note;
    openNote(note.id);
  }
  document.getElementById("newNoteBtn").addEventListener("click", createNote);

  function closeTab(id){
    var idx = state.openTabs.indexOf(id);
    if (idx === -1) return;
    state.openTabs.splice(idx, 1);
    if (state.activeId === id){
      var next = state.openTabs[idx] || state.openTabs[idx-1];
      state.activeId = next || null;
    }
    persist();
    renderTabs();
    renderPage();
    renderRailList();
  }

  function deleteNote(id){
    delete state.notes[id];
    var idx = state.openTabs.indexOf(id);
    if (idx !== -1) state.openTabs.splice(idx, 1);
    if (state.activeId === id) state.activeId = state.openTabs[0] || null;
    persist();
    renderTabs();
    renderPage();
    renderRailList();
  }

  // ---------- modal ----------
  var backdrop = document.getElementById("modalBackdrop");
  var modal = document.getElementById("modal");
  function openModal(){ backdrop.hidden = false; }
  function closeModal(){ backdrop.hidden = true; modal.innerHTML = ""; }
  backdrop.addEventListener("click", function(ev){ if (ev.target === backdrop) closeModal(); });
  document.addEventListener("keydown", function(ev){
    if (ev.key === "Escape" && !backdrop.hidden) closeModal();
  });

  function confirmDelete(id){
    var note = state.notes[id];
    if (!note) return;
    modal.innerHTML = "";
    var h = document.createElement("h3"); h.textContent = "Delete this note?";
    var p = document.createElement("p");
    p.textContent = "“" + (note.subject || "Untitled note") + "” will be removed for good. This can't be undone.";
    var row = document.createElement("div"); row.className = "modal-row";
    var cancel = document.createElement("button"); cancel.className = "btn ghost"; cancel.textContent = "Cancel";
    cancel.addEventListener("click", closeModal);
    var del = document.createElement("button"); del.className = "btn danger"; del.textContent = "Delete note";
    del.addEventListener("click", function(){ deleteNote(id); closeModal(); });
    row.appendChild(cancel); row.appendChild(del);
    modal.appendChild(h); modal.appendChild(p); modal.appendChild(row);
    openModal();
    del.focus();
  }

  function downloadBackup(status){
    try{
      var blob = new Blob([backupPayload()], { type: "application/json" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = "notelet-notes.json";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
      if (status) { status.style.color = "var(--accent)"; status.textContent = "Downloading…"; }
    }catch(e){
      if (status) { status.style.color = "var(--danger)"; status.textContent = "Couldn't save here — try the downloaded copy of Notelet instead."; }
    }
  }

  // One-off "save a copy now": prefers the page's downloads capability
  // (works inside the hosted Notelet page), falls back to a normal
  // browser download (works when this file is opened directly).
  async function saveBackupNow(status){
    if (status){ status.style.color = "var(--ink-muted)"; status.textContent = "Saving…"; }
    var ns = await getDownloadsCapability();
    if (ns){
      try{
        await ns.save({ filename: "notelet-notes.json", data: backupPayload() });
        if (status){ status.style.color = "var(--accent)"; status.textContent = "Saved."; }
      }catch(err){
        if (err && err.code === "declined"){
          if (status){ status.style.color = "var(--ink-muted)"; status.textContent = "Save cancelled."; }
        } else {
          downloadBackup(status);
        }
      }
      return;
    }
    downloadBackup(status);
  }

  function openBackup(){
    modal.innerHTML = "";
    var h = document.createElement("h3"); h.textContent = "Backup & restore";
    var p = document.createElement("p");
    p.textContent = "Save your notes as a file you control, or load one back in.";
    modal.appendChild(h); modal.appendChild(p);

    var status = document.createElement("span"); status.className = "modal-status"; status.id = "backupStatus";

    // ---- Save ----
    var label1 = document.createElement("div"); label1.className = "modal-label"; label1.textContent = "Save";
    modal.appendChild(label1);

    if (fsSupported && fileHandle){
      var linked = document.createElement("div"); linked.className = "file-linked";
      var lname = document.createElement("span"); lname.className = "file-name";
      lname.textContent = "⭳ Autosaving to " + fileHandle.name;
      linked.appendChild(lname);
      modal.appendChild(linked);
      var linkedNote = document.createElement("div"); linkedNote.className = "file-note";
      linkedNote.textContent = "Every change already saves there automatically — nothing else to do.";
      modal.appendChild(linkedNote);
    } else {
      var saveBtn = document.createElement("button"); saveBtn.className = "btn primary"; saveBtn.textContent = "Save backup now (.json)";
      saveBtn.addEventListener("click", function(){ saveBackupNow(status); });
      modal.appendChild(saveBtn);
      if (fsSupported){
        var hint = document.createElement("div"); hint.className = "file-note";
        hint.textContent = "For continuous autosave instead of a one-off file, use “Link a local file” in the sidebar.";
        modal.appendChild(hint);
      }
    }

    // ---- Load ----
    var label2 = document.createElement("div"); label2.className = "modal-label"; label2.textContent = "Load from a file";
    modal.appendChild(label2);
    var row2 = document.createElement("div"); row2.className = "modal-row"; row2.style.justifyContent = "flex-start";
    var mergeBtn = document.createElement("button"); mergeBtn.className = "btn"; mergeBtn.textContent = "Merge in…";
    mergeBtn.addEventListener("click", function(){ pickImportFile(false, status); });
    var replaceBtn = document.createElement("button"); replaceBtn.className = "btn danger"; replaceBtn.textContent = "Replace all…";
    replaceBtn.addEventListener("click", function(){ pickImportFile(true, status); });
    row2.appendChild(mergeBtn); row2.appendChild(replaceBtn);
    modal.appendChild(row2);

    var row3 = document.createElement("div"); row3.className = "modal-row between";
    row3.appendChild(status);
    var closeBtn = document.createElement("button"); closeBtn.className = "btn ghost"; closeBtn.textContent = "Close";
    closeBtn.addEventListener("click", closeModal);
    row3.appendChild(closeBtn);
    modal.appendChild(row3);

    openModal();
  }
  document.getElementById("backupBtn").addEventListener("click", openBackup);

  function pickImportFile(replace, status){
    var input = document.getElementById("importFileInput");
    input.dataset.replace = replace ? "1" : "0";
    input.value = "";
    input.click();
  }
  document.getElementById("importFileInput").addEventListener("change", function(ev){
    var file = ev.target.files && ev.target.files[0];
    if (!file) return;
    var replace = ev.target.dataset.replace === "1";
    var status = document.getElementById("backupStatus");
    var reader = new FileReader();
    reader.onload = function(){ restoreFromJson(String(reader.result), replace, status); };
    reader.onerror = function(){
      if (status){ status.style.color = "var(--danger)"; status.textContent = "Couldn't read that file."; }
    };
    reader.readAsText(file);
  });

  function restoreFromJson(text, replace, status){
    var parsed;
    try{
      parsed = JSON.parse(text);
    }catch(e){
      status.textContent = "That doesn't look like valid JSON.";
      status.style.color = "var(--danger)";
      return;
    }
    if (!parsed || typeof parsed !== "object"){
      status.textContent = "Expected a JSON object of notes.";
      status.style.color = "var(--danger)";
      return;
    }

    // newer backups are { notes, stickies }; older ones are just the notes object
    var isContainer = parsed.notes && typeof parsed.notes === "object" && !Array.isArray(parsed.notes);
    var notesSource = isContainer ? parsed.notes : parsed;
    var stickiesSource = isContainer && Array.isArray(parsed.stickies) ? parsed.stickies : null;

    var incoming = {};
    var ok = 0;
    Object.keys(notesSource).forEach(function(k){
      var n = notesSource[k];
      if (n && typeof n === "object" && typeof n.subject !== "undefined"){
        var id = n.id || k || uid();
        incoming[id] = {
          id: id,
          subject: n.subject || "",
          content: n.content || "",
          createdAt: n.createdAt || nowIso(),
          updatedAt: n.updatedAt || nowIso(),
          color: typeof n.color === "number" ? n.color : ok % TAB_COUNT
        };
        ok++;
      }
    });
    if (!ok && !stickiesSource){
      status.textContent = "No valid notes found in that JSON.";
      status.style.color = "var(--danger)";
      return;
    }
    if (replace){
      state.notes = incoming;
      state.openTabs = [];
      state.activeId = null;
    } else {
      Object.keys(incoming).forEach(function(id){ state.notes[id] = incoming[id]; });
    }

    var stickyCount = 0;
    if (stickiesSource){
      var incomingStickies = stickiesSource
        .filter(function(s){ return s && typeof s === "object" && typeof s.text === "string"; })
        .map(function(s, i){
          return {
            id: s.id || uid(),
            text: s.text,
            color: typeof s.color === "number" ? s.color : i % STICKY_COUNT,
            createdAt: s.createdAt || nowIso()
          };
        });
      stickyCount = incomingStickies.length;
      if (replace){
        state.stickies = incomingStickies;
      } else {
        var byId = {};
        state.stickies.forEach(function(s){ byId[s.id] = s; });
        incomingStickies.forEach(function(s){ byId[s.id] = s; });
        state.stickies = Object.keys(byId).map(function(k){ return byId[k]; });
      }
    } else if (replace){
      state.stickies = [];
    }

    persist();
    renderRailList(); renderTabs(); renderPage();
    status.style.color = "var(--accent)";
    var parts = [];
    if (ok) parts.push(ok + (ok === 1 ? " note" : " notes"));
    if (stickyCount) parts.push(stickyCount + (stickyCount === 1 ? " sticky" : " stickies"));
    status.textContent = "Restored " + (parts.length ? parts.join(" and ") : "0 notes") + ".";
  }

  // ---------- search & sort ----------
  document.getElementById("searchInput").addEventListener("input", renderRailList);
  Array.prototype.forEach.call(document.querySelectorAll(".sort-btn"), function(btn){
    btn.addEventListener("click", function(){
      state.sort = btn.getAttribute("data-sort");
      persist();
      Array.prototype.forEach.call(document.querySelectorAll(".sort-btn"), function(b){ b.classList.toggle("active", b === btn); });
      renderRailList();
    });
  });

  // ---------- keyboard shortcuts ----------
  document.addEventListener("keydown", function(ev){
    var mod = ev.metaKey || ev.ctrlKey;
    if (!mod) return;
    var key = ev.key.toLowerCase();
    if (key === "n"){ ev.preventDefault(); createNote(); }
    else if (key === "w"){ if (state.activeId){ ev.preventDefault(); closeTab(state.activeId); } }
    else if (key === "f"){ ev.preventDefault(); document.getElementById("searchInput").focus(); }
  });

  // ---------- init ----------
  applyTheme();
  applyFontBtn();
  Array.prototype.forEach.call(document.querySelectorAll(".sort-btn"), function(b){
    b.classList.toggle("active", b.getAttribute("data-sort") === state.sort);
  });
  if (!persist()){
    // localStorage unavailable (private mode, blocked, etc.) — app still works for this session.
  }
  renderRailList();
  renderTabs();
  renderPage();
  renderFileStatus();
  tryReconnectFile();
})();
</script>
