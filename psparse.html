<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  Content-Security-Policy is the primary exfiltration control.
  default-src 'none'  -> no network of any kind (no fetch/XHR/websocket/img/font).
  script-src/style-src 'unsafe-inline' -> only THIS file's own inline code runs;
  nothing external can load, and there is no way to reach the network even if the
  pasted payload contains a URL. Combined with textContent-only rendering (see the
  el() helper below), attacker-controlled strings can neither execute nor escape.
-->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none';">
<title>psparse — offline PowerShell triage</title>
<style>

  #out{margin-top:26px;display:none}
  .verdict{border-radius:10px;padding:14px 16px;font-family:var(--mono);

  .score{float:right;color:var(--muted);font-size:13px}
  section.blk{margin-top:22px}

       border-radius:4px;color:#141414}

  .finding .desc{color:var(--muted);font-size:13px;margin-top:5px}

</style>
</head>

<div class="wrap">

    <h1><span class="t">psparse</span></h1>

<script>
"use strict";
/* =========================================================================
   psparse.html — 100% client-side. No network, no storage, no execution.
   Security model:
     - CSP default-src 'none' (see <head>) => zero network / exfiltration.
     - el() builds DOM with textContent only. Untrusted strings are NEVER
       assigned to innerHTML anywhere, so a payload containing markup like
       <img onerror=...> is rendered as inert text, not parsed as HTML.
     - No localStorage/sessionStorage => pasted evidence does not persist.
   Logic is a faithful port of the psparse.py triage engine.
   ========================================================================= */

const MAX_INPUT = 200000;   // guard against pathological-regex hangs
const MAX_DEPTH = 12;
const MIN_B64   = 16;

const SEV_WEIGHT = {info:0, low:1, medium:3, high:6, critical:10};

/* ---- detection ruleset (data-driven; extend per campaign) ------------- */
const RULES = [
 {id:"ENC-B64CMD",name:"Encoded command (-EncodedCommand)",cat:"obfuscation",sev:"high",

 {id:"ENC-FROMB64",name:"FromBase64String decode",cat:"obfuscation",sev:"medium",mitre:["T1027"],

 {id:"ENC-COMPRESS",name:"In-memory (de)compression",cat:"obfuscation",sev:"medium",mitre:["T1027"],

 {id:"TOOL-POSTEX",name:"Known post-exploitation tooling",cat:"tooling",sev:"high",mitre:["T1059.001"],

/* ---- IOC patterns ----------------------------------------------------- */
const IOC = {
  url:      /https?:\/\/[^\s'"\)\}<>|`]+/ig,
  ipv4:     /\b(?:(?:25[0-5]|2[0-4]\d|1?\d?\d)\.){3}(?:25[0-5]|2[0-4]\d|1?\d?\d)\b/g,
  ip_port:  /\b(?:\d{1,3}\.){3}\d{1,3}:\d{1,5}\b/g,
  domain:   /\b(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,24}\b/ig,
  unc_path: /\\\\[^\\\s'"|`]+\\[^\s'"|`]+/g,
  win_path: /[a-z]:\\[^\s'"|`<>]+/ig,
  reg_key:  /HK(?:LM|CU|CR|U|CC)\\[^\s'"|`]+/ig,

const DOMAIN_STOP = /\.(exe|dll|ps1|psm1|ps1xml|bat|cmd|txt|log|dat|tmp|sys|ini|xml|json|cs|vbs|msi|msu|zip|7z|rar|gz|scr|hta|jar|lnk)$|^(system|net|io|text|reflection|management|automation|runtime|interopservices|convert|math|console|environment)\./i;

/* ---- deobfuscation (records an ordered step per transform) ------------ */
function excerpt(s,n){ n=n||90; s=String(s).replace(/[\r\n]+/g," "); return s.length<=n?s:s.slice(0,n)+" ..."; }
function mkstep(ctx,layer,tech,mitre,detail,before,after){
  ctx.n++; ctx.steps.push({n:ctx.n,layer,tech,mitre,detail,before,after});
}
function asciiRatio(t){
  if(!t) return 0; let g=0;
  for(const c of t){ const o=c.charCodeAt(0); if((o>=32&&o<=126)||o===9||o===10||o===13) g++; }
  return g/t.length;
}
const DECODE_EVIDENCE=["http","://","iex","invoke","new-object","downloadstring","frombase64",
  ".ps1","system.","reflection","-join","[char]","scriptblock","powershell","webclient","$(",
  "::","start-","set-item","gzip","deflate","-enc","bypass"];
function looksLikeScript(t){
  // Score a candidate DECODING: must be mostly printable ASCII AND carry a script/URL token.
  // Rejects plaintext (e.g. a domain label grabbed as base64 and mangled into CJK).
  if(!t) return 0;
  if(asciiRatio(t)<0.85) return 0;
  const s=t.trim();
  if(s.length>=24 && /^[A-Za-z0-9+/=\s]+$/.test(s)) return 0.5;  // nested base64, worth peeling
  const low=t.toLowerCase();
  let hits=0; for(const k of DECODE_EVIDENCE){ let i=0; while((i=low.indexOf(k,i))!==-1){hits++;i+=k.length;} }
  if(hits===0) return 0;
  return Math.min(1, 0.4 + hits/6);
}
function b64ToBytes(b64){
  const clean=b64.replace(/[^A-Za-z0-9+/]/g,"");
  const padded=clean+"=".repeat((4-clean.length%4)%4);
  const bin=atob(padded);
  const out=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) out[i]=bin.charCodeAt(i);
  return out;
}
async function inflate(bytes,fmt){
  const ds=new DecompressionStream(fmt);
  const stream=new Blob([bytes]).stream().pipeThrough(ds);
  const buf=await new Response(stream).arrayBuffer();
  return new Uint8Array(buf);
}
async function tryB64(blob){
  let bytes; try{ bytes=b64ToBytes(blob); }catch(e){ return []; }
  if(!bytes.length) return [];
  const out=[];
  try{ out.push({tag:"UTF-16LE",tech:"Base64 decode (UTF-16LE)",text:new TextDecoder("utf-16le").decode(bytes)}); }catch(e){}
  try{ out.push({tag:"UTF-8",tech:"Base64 decode (UTF-8)",text:new TextDecoder("utf-8",{fatal:false}).decode(bytes)}); }catch(e){}
  if(bytes[0]===0x1f && bytes[1]===0x8b){
    try{ out.push({tag:"gzip",tech:"Gzip decompression",text:new TextDecoder().decode(await inflate(bytes,"gzip"))}); }catch(e){}
  }
  try{ out.push({tag:"deflate",tech:"Deflate decompression",text:new TextDecoder().decode(await inflate(bytes,"deflate-raw"))}); }catch(e){}
  return out;
}
function pBacktick(text,layer,ctx){
  const clusters=text.match(/\w(?:`\w)+/g);
  const nw=text.replace(/(\w)`(?=\w)/g,"$1");
  if(nw!==text){
    const s=clusters?clusters[0]:"`";
    const removed=(text.split("`").length-1)-(nw.split("`").length-1);
    mkstep(ctx,layer,"Backtick token-splitting","T1027.010",
      "removed "+removed+" identifier backtick(s)",
      excerpt(s), excerpt(s.replace(/(\w)`(?=\w)/g,"$1")));
  }
  return nw;

  const score=findings.reduce((a,f)=>a+SEV_WEIGHT[f.sev],0);
  const [vtext,vsev]=verdict(score);
  let sha=""; try{ sha=await sha256hex(cmd); }catch(e){ sha="(unavailable)"; }
  let segments=[]; try{ segments=explain(final); }catch(e){}
  return {original:cmd, final, steps, layers, segments, findings, iocs, mitre, score, vtext, vsev,
          sha, len:cmd.length, ts:new Date().toISOString().replace("T"," ").slice(0,19)+"Z"};
}

/* ---- safe DOM builder (textContent only; never innerHTML) ------------- */
function el(tag, attrs, ...kids){
  const n=document.createElement(tag);
  if(attrs) for(const [k,v] of Object.entries(attrs)){
    if(k==="class") n.className=v; else n.setAttribute(k,v);
  }
  for(const kid of kids){
    if(kid==null) continue;
    n.appendChild(typeof kid==="string"?document.createTextNode(kid):kid);
  }
  return n;
}
function defang(s){ return s.replace(/https?/gi,m=>m.toLowerCase()==="https"?"hxxps":"hxxp").replace(/\./g,"[.]"); }

const SEV_ORDER={critical:0,high:1,medium:2,low:3,info:4};
let lastReportText="";

function render(rep){
  const doDefang=document.getElementById("defang").checked;
  const out=document.getElementById("out");
  out.textContent=""; out.style.display="block";

  // verdict
  const v=el("div",{class:"verdict"},
      el("span",{class:"score"},"risk score "+rep.score),
      el("b",{class:"c-"+rep.vsev},rep.vtext));
  v.style.borderLeft="4px solid var(--"+rep.vsev+")";
  out.appendChild(v);

  // original
  const s1=el("section",{class:"blk"}, el("h2",null,"Original command"),
      el("pre",{class:"code"}, rep.original.trim()));
  out.appendChild(s1);

  // deobfuscation trail (one step per transform)
  if(rep.steps.length){
    const s=el("section",{class:"blk"},
      el("h2",null,`Deobfuscation trail · ${rep.steps.length} step(s), ${rep.layers} layer(s)`));
    for(const st of rep.steps){
      const card=el("div",{class:"finding sev-low"});
      card.appendChild(el("div",{class:"top"},
        el("span",{class:"sev bg-low"}, "#"+st.n),
        el("span",{class:"nm"}, st.tech),
        el("span",{class:"meta"}, "L"+st.layer+" · "+st.mitre+" · "+st.detail)));
      card.appendChild(el("pre",{class:"code"}, "before: "+st.before+"\nafter : "+st.after));
      s.appendChild(card);
    }
    s.appendChild(el("div",{class:"note"},"– fully deobfuscated:"));
    s.appendChild(el("pre",{class:"code"}, rep.final.trim()));
    out.appendChild(s);
  }

  // component breakdown
  if(rep.segments && rep.segments.length){
    const cmap={suspicious:"high",notable:"medium",info:"low"};
    const bd={suspicious:"!!",notable:"*",info:"·"};
    const s=el("section",{class:"blk"}, el("h2",null,"Component breakdown · what each part does"));
    for(const seg of rep.segments){
      const c=cmap[seg.concern]||"low";
      const row=el("div",{class:"finding sev-"+c});
      row.appendChild(el("div",{class:"top"},
        el("span",{class:"sev bg-"+c}, bd[seg.concern]||"·"),
        el("code",{class:"nm"}, seg.text)));
      row.appendChild(el("div",{class:"desc"}, seg.desc));
      s.appendChild(row);
    }
    out.appendChild(s);
  }

  // findings
  const sf=el("section",{class:"blk"}, el("h2",null,"Findings"));
  if(rep.findings.length){
    const sorted=[...rep.findings].sort((a,b)=>(SEV_ORDER[a.sev]??9)-(SEV_ORDER[b.sev]??9));
    for(const f of sorted){
      const card=el("div",{class:"finding sev-"+f.sev});
      card.appendChild(el("div",{class:"top"},
        el("span",{class:"sev bg-"+f.sev}, f.sev.toUpperCase()),
        el("span",{class:"nm"}, f.name),
        el("span",{class:"meta"}, f.cat+" · "+(f.mitre.join(" ")||"-"))));
      card.appendChild(el("div",{class:"desc"}, f.desc));
      if(f.matched.length) card.appendChild(el("div",{class:"matched"}, "matched: "+f.matched.join("  |  ")));
      sf.appendChild(card);
    }
  } else { sf.appendChild(el("div",{class:"empty"},"none")); }
  out.appendChild(sf);

  // iocs
  const si=el("section",{class:"blk"}, el("h2",null,"Indicators"+(doDefang?" (defanged)":"")));
  const keys=Object.keys(rep.iocs);
  if(keys.length){
    const tbl=el("table",{class:"ioc"});
    for(const k of keys){
      const vals=rep.iocs[k].map(x=>doDefang?defang(x):x).join("\n");
      const tr=el("tr", null, el("td",{class:"k"},k), el("td",{class:"v"},
        el("span",{style:"white-space:pre-wrap"}, vals)));
      tbl.appendChild(tr);
    }
    si.appendChild(tbl);
  } else { si.appendChild(el("div",{class:"empty"},"none extracted")); }
  out.appendChild(si);

  // mitre (union of finding techniques + obfuscation-step techniques)
  const techs=[...new Set([...rep.mitre, ...rep.steps.map(s=>s.mitre)])].sort();
  if(techs.length){
    const sm=el("section",{class:"blk"}, el("h2",null,"MITRE ATT&CK"));
    for(const t of techs){
      const meta=ATTACK[t]||["(unmapped)","-"];
      sm.appendChild(el("div",{class:"note"}, el("span",{class:"att"}, t), " "+meta[0]+" — "+meta[1]));
    }
    out.appendChild(sm);
  }

  buildReportMarkdown(rep, doDefang);
  document.getElementById("copy").style.display="inline-block";
}

function mdc(s){ return String(s).replace(/\|/g,"\\|").replace(/[\r\n]+/g," "); }
function buildReportMarkdown(rep, doDefang){
  const label=(document.getElementById("label").value.trim())||"pasted command";
  const L=[];
  L.push("# PowerShell Command Analysis — "+label);
  L.push("");
  L.push("> **Static heuristic triage. The command was NOT executed.** For nested or novel "+
         "obfuscation, corroborate with PowerShell Script Block Logging (Event ID 4104) or an "+
         "isolated dynamic detonation.");
  L.push("");
  L.push("## 1. Evidence"); L.push("");
  L.push("| Field | Value |"); L.push("|---|---|");
  L.push("| Artifact / source | "+mdc(label)+" |");
  L.push("| SHA-256 (analyzed text) | `"+rep.sha+"` |");
  L.push("| Length | "+rep.len+" chars |");
  L.push("| Analyzed (UTC) | "+rep.ts+" |");
  L.push("| Tool | psparse.html 2.0 |");
  L.push("");
  L.push("## 2. Verdict"); L.push("");
  L.push("> **"+rep.vtext+"** — risk score **"+rep.score+"**"); L.push("");
  L.push("## 3. Original command"); L.push("");
  L.push("```powershell"); L.push(rep.original.trim()); L.push("```"); L.push("");
  L.push("## 4. Deobfuscation trail"); L.push("");
  if(rep.steps.length){
    L.push(rep.steps.length+" transformation(s) across "+rep.layers+" layer(s):"); L.push("");
    L.push("| # | Layer | Technique | ATT&CK | Detail |"); L.push("|---|---|---|---|---|");
    rep.steps.forEach(s=>L.push(`| ${s.n} | ${s.layer} | ${mdc(s.tech)} | ${s.mitre} | ${mdc(s.detail)} |`));
    L.push(""); L.push("Per-step before / after:"); L.push("");
    rep.steps.forEach(s=>{ L.push("**Step "+s.n+" — "+mdc(s.tech)+"**"); L.push("");
      L.push("```text"); L.push("before: "+s.before); L.push("after : "+s.after); L.push("```"); L.push(""); });
    L.push("Fully deobfuscated:"); L.push("");
    L.push("```powershell"); L.push(rep.final.trim()); L.push("```");
  } else { L.push("_No obfuscation layers detected; the command was analyzed as-is._"); }
  L.push("");
  L.push("## 5. Component breakdown"); L.push("");
  if(rep.segments && rep.segments.length){
    L.push("Each recognised part of the (deobfuscated) command and what it does. `!!` = security-relevant, `*` = noteworthy."); L.push("");
    L.push("| | Fragment | What it does |"); L.push("|---|---|---|");
    const fl={suspicious:"!!",notable:"*",info:""};
    rep.segments.forEach(s=>L.push("| "+(fl[s.concern]||"")+" | `"+mdc(s.text)+"` | "+mdc(s.desc)+" |"));
  } else { L.push("_No components parsed._"); }
  L.push("");
  L.push("## 6. Findings"); L.push("");
  if(rep.findings.length){
    const sorted=[...rep.findings].sort((a,b)=>(SEV_ORDER[a.sev]??9)-(SEV_ORDER[b.sev]??9));
    L.push("| Severity | ID | Name | Category | ATT&CK | Matched |"); L.push("|---|---|---|---|---|---|");
    sorted.forEach(f=>L.push(`| ${f.sev.toUpperCase()} | ${f.id} | ${mdc(f.name)} | ${f.cat} | `+
      `${f.mitre.join(" ")||"-"} | ${mdc(f.matched.join(", "))} |`));
  } else { L.push("_None._"); }
  L.push("");
  L.push("## 7. Indicators of compromise"); L.push("");
  const keys=Object.keys(rep.iocs);
  if(keys.length){
    L.push("_URLs / hosts defanged for safe handling._"); L.push("");
    L.push("| Type | Value |"); L.push("|---|---|");
    keys.forEach(k=>rep.iocs[k].forEach(v=>L.push("| "+k+" | `"+mdc(doDefang?defang(v):v)+"` |")));
  } else { L.push("_None extracted._"); }
  L.push("");
  L.push("## 8. MITRE ATT&CK techniques"); L.push("");
  const techs=[...new Set([...rep.mitre, ...rep.steps.map(s=>s.mitre)])].sort();
  if(techs.length){
    L.push("| ID | Technique | Tactic |"); L.push("|---|---|---|");
    techs.forEach(t=>{ const m=ATTACK[t]||["(unmapped)","-"]; L.push(`| ${t} | ${mdc(m[0])} | ${mdc(m[1])} |`); });
  } else { L.push("_None._"); }
  L.push("");
  L.push("## 9. Analyst notes & limitations"); L.push("");
  L.push("- Output is **static, heuristic triage**; the command was never executed.");
  L.push("- Static deobfuscation can be defeated by novel or heavily nested obfuscation "+
         "(SecureString, environment-variable indirection, runtime string assembly). "+
         "The ground truth is the deobfuscated block logged by **Event ID 4104**.");
  L.push("- The risk score is an ordinal triage aid, not a probability.");
  L.push("- Extracted indicators are defanged and should be validated before any blocking action.");
  L.push("");
  lastReportText=L.join("\n");
}

/* ---- wiring ----------------------------------------------------------- */
const cmdEl=document.getElementById("cmd");
const lenEl=document.getElementById("len");
function updLen(){ const n=cmdEl.value.length;
  lenEl.textContent=n?`${n.toLocaleString()} chars${n>MAX_INPUT?" — will be truncated":""}`:""; }
cmdEl.addEventListener("input",updLen);

document.getElementById("run").addEventListener("click",async()=>{
  let cmd=cmdEl.value; if(!cmd.trim()) return;
  if(cmd.length>MAX_INPUT) cmd=cmd.slice(0,MAX_INPUT);
  const btn=document.getElementById("run"); btn.disabled=true; btn.textContent="Analyzing…";
  try{ render(await analyze(cmd)); }
  catch(e){
    const out=document.getElementById("out"); out.style.display="block"; out.textContent="";
    out.appendChild(el("div",{class:"verdict"}, el("b",null,"Analysis error: "), String(e&&e.message||e)));
  }
  finally{ btn.disabled=false; btn.textContent="Analyze"; }
});
document.getElementById("clear").addEventListener("click",()=>{
  cmdEl.value=""; updLen(); document.getElementById("out").style.display="none";
  document.getElementById("copy").style.display="none"; cmdEl.focus();
});
document.getElementById("copy").addEventListener("click",async()=>{
  try{ await navigator.clipboard.writeText(lastReportText);
       const b=document.getElementById("copy"); const t=b.textContent; b.textContent="Copied";
       setTimeout(()=>b.textContent=t,1200); }catch(e){}
});
