<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UsefulDFIR · incident response and threat intelligence tools by Danny Howett</title>
<meta name="description" content="Free, single-file tools for incident response, readiness assessment and threat intelligence. Everything runs in your browser.">
<meta name="theme-color" content="#14181d">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧰</text></svg>">
<!--
  Content-Security-Policy. The page itself never needs to send data anywhere, so
  connect-src is 'none': the browser will refuse any fetch/XHR/WebSocket/beacon
  from this page, which enforces the "nothing uploaded" promise rather than just
  stating it. The only third-party origins allowed are Google Fonts (stylesheet +
  font files). If you self-host IBM Plex Sans, delete the two Google hosts below.
  Scripts/styles are inline, so 'unsafe-inline' is needed; external scripts,
  plugins, <base> hijacking and form posts are all blocked.
  Tools opened in windows are separate files and keep their own CSPs.
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; frame-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; worker-src 'none'; manifest-src 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<!-- Google Fonts: the only automatic third-party request. Explained to visitors in Privacy & Licence. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   UsefulDFIR 95: the toolset presented as a 1995-era desktop on a CRT.
   Everything is client-side. Preferences live in localStorage only.
   The one automatic network request to a third party is the IBM Plex Sans
   webfont from Google Fonts; see openPrivacy() for the visitor explanation.
   ===================================================================== */
:root{
  --face:#c0c0c0; --hl:#ffffff; --lt:#dfdfdf; --sh:#808080; --dk:#000000;
  --navy:#000080; --title-off:#808080; --sel:#000080; --sel-ink:#ffffff;
  --desk:#008080;
  --ui:"Pixelated MS Sans Serif","MS Sans Serif","Microsoft Sans Serif",Tahoma,"Segoe UI",Geneva,Verdana,sans-serif;
  --mono:"Fixedsys","Courier New",Courier,ui-monospace,monospace;
  --brand:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --room:#14181d;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;overflow:hidden;background:var(--room);
  background:radial-gradient(120% 90% at 50% 0%,#2a333d 0%,#161b21 55%,#0d1014 100%);
  font-family:var(--ui);font-size:12px;color:#000;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
[hidden]{display:none!important}
noscript .nojs{position:fixed;inset:0;overflow:auto;background:#008080;color:#fff;padding:24px;z-index:99;font:14px/1.5 var(--brand)}
noscript .nojs a{color:#fff}

/* ---------------- the monitor ---------------- */
.rig{height:100vh;height:100dvh;display:flex;flex-direction:column;align-items:center;
  padding:clamp(6px,2.2vh,26px) clamp(6px,2.2vw,30px) 0}
.monitor{position:relative;width:100%;max-width:1680px;flex:1 1 auto;min-height:0;display:flex;flex-direction:column;
  background:linear-gradient(180deg,#ebe6d8 0%,#ddd7c6 60%,#cfc8b4 100%);
  border-radius:clamp(10px,1.6vw,22px) clamp(10px,1.6vw,22px) clamp(8px,1vw,14px) clamp(8px,1vw,14px);
  padding:clamp(8px,2vw,30px) clamp(8px,2vw,30px) 0;
  box-shadow:inset 0 2px 0 #fbf8ef,inset 2px 0 0 #f2eee2,inset -2px 0 0 #bdb6a2,inset 0 -3px 0 #ada690,
    0 30px 60px -10px rgba(0,0,0,.65),0 8px 20px rgba(0,0,0,.35)}
.bezel{flex:1 1 auto;min-height:0;border-radius:clamp(6px,1vw,14px);padding:clamp(5px,1.1vw,16px);
  background:linear-gradient(180deg,#26292a,#1a1c1c);
  box-shadow:inset 0 0 0 1px #0b0c0c,inset 0 8px 18px rgba(0,0,0,.85),0 1px 0 #f7f3e8,0 -1px 0 #b9b29d}
.screen{position:relative;height:100%;overflow:hidden;background:#000;border-radius:clamp(4px,.9vw,12px)/clamp(5px,1.1vw,14px);
  isolation:isolate;user-select:none;-webkit-user-select:none}
.screen::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:30000;border-radius:inherit;
  background:radial-gradient(130% 120% at 50% 50%,transparent 62%,rgba(0,0,0,.28) 100%),
    linear-gradient(160deg,rgba(255,255,255,.07) 0%,rgba(255,255,255,0) 32%);}
.screen.crt::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:30001;
  background:repeating-linear-gradient(180deg,rgba(0,0,0,.055) 0 1px,transparent 1px 3px);mix-blend-mode:multiply}
.chin{flex:0 0 auto;height:clamp(30px,5.4vh,56px);display:flex;align-items:center;gap:14px;padding:0 4px}
.badge{display:flex;align-items:baseline;gap:8px;font-family:var(--brand);color:#7b7462;
  text-shadow:0 1px 0 #f7f3e8;white-space:nowrap}
.badge b{font-weight:700;font-size:clamp(11px,1.15vw,15px);letter-spacing:.14em;text-transform:uppercase}
.badge span{font-weight:500;font-size:clamp(9px,.85vw,11.5px);letter-spacing:.04em}
.vents{flex:1;height:10px;min-width:0;opacity:.55;
  background:repeating-linear-gradient(90deg,#b4ad99 0 2px,transparent 2px 7px);
  -webkit-mask:linear-gradient(90deg,transparent,#000 15%,#000 85%,transparent);mask:linear-gradient(90deg,transparent,#000 15%,#000 85%,transparent)}
.ctrls{display:flex;align-items:center;gap:12px}
.led{width:7px;height:7px;border-radius:50%;background:#2fe06b;box-shadow:0 0 6px 1px rgba(47,224,107,.75),inset 0 -1px 1px rgba(0,0,0,.3)}
.led.off{background:#4a4d47;box-shadow:inset 0 1px 1px rgba(0,0,0,.4)}
.led.standby{background:#f0a020;box-shadow:0 0 6px 1px rgba(240,160,32,.7)}
.power{width:clamp(22px,2.2vw,30px);height:clamp(14px,1.4vw,18px);border-radius:4px;border:0;cursor:pointer;
  background:linear-gradient(#e6e0d0,#c9c2ae);box-shadow:inset 0 1px 0 #fff,inset 0 -2px 0 #a7a08b,0 1px 2px rgba(0,0,0,.35)}
.power:active{box-shadow:inset 0 2px 3px rgba(0,0,0,.35)}
.power:focus-visible{outline:2px solid #2fe06b;outline-offset:2px}
.stand{flex:0 0 auto;width:min(26%,300px);height:clamp(8px,2.2vh,24px);
  background:linear-gradient(180deg,#a8a18c,#c9c2ae 40%,#bdb6a1);clip-path:polygon(14% 0,86% 0,100% 100%,0 100%)}
.base{flex:0 0 auto;width:min(40%,460px);height:clamp(5px,1.1vh,12px);border-radius:6px 6px 0 0;
  background:linear-gradient(180deg,#ddd7c6,#bdb6a1);box-shadow:0 -1px 0 #efebdf inset}
@media (max-width:640px){
  .rig{padding:4px 4px 0}
  .monitor{padding:6px 6px 0;border-radius:10px 10px 6px 6px}
  .bezel{padding:4px}
  .chin{height:26px;gap:8px}
  .badge span,.vents{display:none}
  .stand,.base{display:none}
  .rig{padding-bottom:4px}
}
@media (max-height:520px){ .stand,.base{display:none} .rig{padding-bottom:4px} .chin{height:24px} }

/* ---------------- Win95 primitives ---------------- */
.raised{background:var(--face);box-shadow:inset -1px -1px var(--dk),inset 1px 1px var(--hl),inset -2px -2px var(--sh),inset 2px 2px var(--lt)}
.sunken{box-shadow:inset -1px -1px var(--hl),inset 1px 1px var(--sh),inset -2px -2px var(--lt),inset 2px 2px var(--dk)}
.field{background:#fff;box-shadow:inset -1px -1px var(--hl),inset 1px 1px var(--sh),inset -2px -2px var(--lt),inset 2px 2px var(--dk);padding:3px 4px}
.thin-sunk{box-shadow:inset -1px -1px var(--hl),inset 1px 1px var(--sh)}
.btn{min-width:75px;min-height:23px;padding:3px 10px;border:0;border-radius:0;background:var(--face);cursor:pointer;
  box-shadow:inset -1px -1px var(--dk),inset 1px 1px var(--hl),inset -2px -2px var(--sh),inset 2px 2px var(--lt)}
.btn:active:not(:disabled),.btn.pressed{box-shadow:inset -1px -1px var(--hl),inset 1px 1px var(--dk),inset -2px -2px var(--lt),inset 2px 2px var(--sh);padding:4px 9px 2px 11px}
.btn:focus-visible{outline:1px dotted #000;outline-offset:-5px}
.btn.default{box-shadow:inset 0 0 0 1px #000,inset -2px -2px var(--dk),inset 2px 2px var(--hl),inset -3px -3px var(--sh),inset 3px 3px var(--lt)}
.btn:disabled{color:var(--sh);text-shadow:1px 1px 0 var(--hl);cursor:default}
.ico{display:block;flex:0 0 auto}
.screen ::-webkit-scrollbar{width:16px;height:16px;background:#dfdfdf}
.screen ::-webkit-scrollbar-track{background:repeating-conic-gradient(#c0c0c0 0 25%,#fff 0 50%) 0 0/2px 2px}
.screen ::-webkit-scrollbar-thumb{background:var(--face);box-shadow:inset -1px -1px var(--dk),inset 1px 1px var(--lt),inset -2px -2px var(--sh),inset 2px 2px var(--hl)}
.screen ::-webkit-scrollbar-corner{background:var(--face)}
.screen ::-webkit-scrollbar-button:single-button{display:block;width:16px;height:16px;background:var(--face);
  box-shadow:inset -1px -1px var(--dk),inset 1px 1px var(--lt),inset -2px -2px var(--sh),inset 2px 2px var(--hl)}

/* ---------------- desktop ---------------- */
.desktop{position:absolute;inset:0 0 28px 0;overflow:hidden;background-color:var(--desk);background-repeat:repeat}
.icons{position:absolute;inset:0}
.dicon{position:absolute;width:84px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:2px 0;
  border:0;background:none;cursor:default;touch-action:none;color:#fff}
.dicon .dimg{width:32px;height:32px;position:relative}
.dicon .dlab{max-width:84px;padding:1px 2px;line-height:13px;text-align:center;background:var(--desk);
  border:1px dotted transparent;overflow-wrap:break-word;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dicon.sel .dlab{background:var(--sel);color:var(--sel-ink);border-color:#ffff80;-webkit-line-clamp:unset}
.dicon.sel .dimg svg{filter:brightness(.62) sepia(1) hue-rotate(195deg) saturate(5)}
.dicon:focus{outline:none}
.dicon:focus-visible .dlab{border-color:#fff}
.dicon.moving{opacity:.75;z-index:5}
.icons.on-picture .dlab{text-shadow:1px 1px 0 #000,0 0 4px rgba(0,0,0,.8)}
.icons.on-picture .dicon.sel .dlab{text-shadow:none}
.window:focus{outline:none}
.windows{position:absolute;inset:0;pointer-events:none}
.windows > *{pointer-events:auto}

/* ---------------- windows ---------------- */
.window{position:absolute;display:flex;flex-direction:column;padding:3px;background:var(--face);min-width:180px;
  box-shadow:inset -1px -1px var(--dk),inset 1px 1px var(--lt),inset -2px -2px var(--sh),inset 2px 2px var(--hl),2px 2px 0 rgba(0,0,0,.08)}
.window.max{left:0!important;top:0!important;width:100%!important;height:100%!important;box-shadow:none;padding:2px}
.window.auto{height:auto}
.titlebar{flex:0 0 auto;height:18px;display:flex;align-items:center;gap:3px;padding:0 2px 0 2px;
  background:var(--title-off);color:#c0c0c0;font-weight:700;touch-action:none;cursor:default}
.window.active .titlebar{background:var(--navy);color:#fff}
.titlebar .ttext{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:1px}
.tbtns{display:flex;gap:0;flex:0 0 auto}
.tbtn{width:16px;height:14px;border:0;padding:0;display:grid;place-items:center;background:var(--face);cursor:pointer;
  box-shadow:inset -1px -1px var(--dk),inset 1px 1px var(--hl),inset -2px -2px var(--sh),inset 2px 2px var(--lt)}
.tbtn:active{box-shadow:inset -1px -1px var(--hl),inset 1px 1px var(--dk),inset -2px -2px var(--lt),inset 2px 2px var(--sh)}
.tbtn:active svg{transform:translate(1px,1px)}
.tbtn.close{margin-left:2px}
.tbtn:disabled svg{opacity:.4}
.menubar{flex:0 0 auto;display:flex;gap:0;padding:1px 0 2px;flex-wrap:wrap}
.menubar > button{border:1px solid transparent;background:none;padding:1px 6px;cursor:default}
.menubar > button:hover,.menubar > button.menu-open{box-shadow:inset -1px -1px var(--sh),inset 1px 1px var(--hl)}
.menubar > button.menu-open{box-shadow:inset 1px 1px var(--sh),inset -1px -1px var(--hl)}
.menubar u{text-decoration:underline}
.wbody{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;position:relative}
.window.auto .wbody{flex:0 0 auto}
.statusbar{flex:0 0 auto;display:flex;gap:2px;margin-top:2px;height:20px}
.statusbar > span{box-shadow:inset -1px -1px var(--hl),inset 1px 1px var(--sh);padding:2px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:16px}
.statusbar > span:first-child{flex:1;min-width:0}
.grip{position:absolute;right:3px;bottom:3px;width:14px;height:14px;cursor:nwse-resize;touch-action:none;
  background:linear-gradient(135deg,transparent 0 45%,#fff 45% 52%,#808080 52% 62%,transparent 62% 70%,#fff 70% 76%,#808080 76% 86%,transparent 86%)}
.window.max .grip{display:none}
.shield{position:absolute;inset:0;display:none;z-index:2}
.window:not(.active) .shield,.screen.dragging .shield{display:block}
.toolbar{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:3px 2px 4px;border-top:1px solid var(--sh);box-shadow:inset 0 1px 0 var(--hl);flex-wrap:nowrap}
.toolbar label{white-space:nowrap}
.toolbar .field{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;height:22px;display:flex;align-items:center;gap:4px;padding:2px 4px}
.tb-btn{display:flex;align-items:center;gap:4px;min-height:22px;padding:2px 6px;border:0;background:var(--face);cursor:pointer;white-space:nowrap;
  box-shadow:inset -1px -1px var(--dk),inset 1px 1px var(--hl),inset -2px -2px var(--sh),inset 2px 2px var(--lt)}
.tb-btn:active:not(:disabled){box-shadow:inset -1px -1px var(--hl),inset 1px 1px var(--dk),inset -2px -2px var(--lt),inset 2px 2px var(--sh)}
.tb-btn:disabled{color:var(--sh);cursor:default}
.tb-btn:disabled svg{opacity:.45}
.frame-wrap{flex:1 1 auto;min-height:0;position:relative;background:#fff;padding:2px}
.frame-wrap iframe{display:block;width:100%;height:100%;border:0;background:#fff}
.screen.dragging,.screen.dragging *{cursor:move}
.screen.resizing,.screen.resizing *{cursor:nwse-resize}

/* ---------------- menus ---------------- */
.menu{position:absolute;z-index:20000;min-width:150px;padding:2px;background:var(--face);display:flex;flex-direction:column;
  box-shadow:inset -1px -1px var(--dk),inset 1px 1px var(--lt),inset -2px -2px var(--sh),inset 2px 2px var(--hl),2px 2px 0 rgba(0,0,0,.18)}
.mi{display:flex;align-items:center;gap:6px;min-height:20px;padding:1px 6px 1px 4px;border:0;background:none;text-align:left;cursor:default;white-space:nowrap}
.mi .mico{width:16px;height:16px;flex:0 0 16px;display:grid;place-items:center}
.mi .mlab{flex:1}
.mi .marr{margin-left:14px;width:0;height:0;border:4px solid transparent;border-left:4px solid currentColor;border-right:0}
.mi .mkey{margin-left:18px}
.mi:hover:not(:disabled),.mi.sub-open,.mi:focus-visible{background:var(--sel);color:var(--sel-ink);outline:none}
.mi:hover:not(:disabled) svg.mono,.mi.sub-open svg.mono{filter:invert(1)}
.mi:disabled{color:var(--sh);text-shadow:1px 1px 0 var(--hl)}
.msep{height:2px;margin:3px 2px;border-top:1px solid var(--sh);border-bottom:1px solid var(--hl)}
.menu.start{flex-direction:row;padding:3px}
.start-band{width:22px;flex:0 0 22px;background:linear-gradient(0deg,#808080,#808080);position:relative;overflow:hidden}
.start-band span{position:absolute;left:50%;bottom:6px;transform-origin:0 0;transform:rotate(-90deg) translateY(-50%);
  white-space:nowrap;color:#c0c0c0;font:700 17px/1 var(--brand);letter-spacing:.02em}
.start-band span b{color:#fff;font-weight:700}
.start-items{display:flex;flex-direction:column;flex:1;min-width:0}
.menu.start .mi{min-height:32px;gap:8px;padding:2px 10px 2px 4px;min-width:170px}
.menu.start .mi .mico{width:24px;height:24px;flex-basis:24px}
@media (pointer:coarse){ .mi{min-height:30px} .menu.start .mi{min-height:38px} }

/* ---------------- taskbar ---------------- */
.taskbar{position:absolute;left:0;right:0;bottom:0;height:28px;z-index:15000;display:flex;align-items:center;gap:3px;padding:2px 2px 2px 2px;
  background:var(--face);box-shadow:inset 0 1px var(--lt),inset 0 2px var(--hl)}
.startbtn{height:22px;display:flex;align-items:center;gap:3px;padding:2px 5px 2px 3px;border:0;font-weight:700;background:var(--face);cursor:pointer;flex:0 0 auto;
  box-shadow:inset -1px -1px var(--dk),inset 1px 1px var(--hl),inset -2px -2px var(--sh),inset 2px 2px var(--lt)}
.startbtn.pressed{box-shadow:inset -1px -1px var(--hl),inset 1px 1px var(--dk),inset -2px -2px var(--lt),inset 2px 2px var(--sh);padding:3px 4px 1px 4px}
.startbtn.pressed b{outline:1px dotted #000;outline-offset:1px}
.tasks{flex:1;min-width:0;display:flex;gap:3px;overflow:hidden;padding-left:4px;margin-left:2px;border-left:1px solid var(--sh);box-shadow:inset 1px 0 var(--hl)}
.task{height:22px;flex:0 1 160px;min-width:28px;display:flex;align-items:center;gap:4px;padding:2px 4px;border:0;text-align:left;background:var(--face);cursor:pointer;
  box-shadow:inset -1px -1px var(--dk),inset 1px 1px var(--hl),inset -2px -2px var(--sh),inset 2px 2px var(--lt)}
.task span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task.on{font-weight:700;background:repeating-conic-gradient(#c0c0c0 0 25%,#fff 0 50%) 0 0/2px 2px;
  box-shadow:inset -1px -1px var(--hl),inset 1px 1px var(--dk),inset -2px -2px var(--lt),inset 2px 2px var(--sh)}
.tray{flex:0 0 auto;height:22px;display:flex;align-items:center;gap:6px;padding:0 8px 0 6px;box-shadow:inset -1px -1px var(--hl),inset 1px 1px var(--sh)}
.tray button{border:0;background:none;padding:0;cursor:default;display:grid}
@media (max-width:480px){ .task{flex-basis:34px} .task span:last-child{display:none} .tray .tray-ico{display:none} }

/* ---------------- list views (Explorer) ---------------- */
.lv-wrap{flex:1 1 auto;min-height:0;overflow:auto;background:#fff}
.lv-large{display:flex;flex-wrap:wrap;align-content:flex-start;gap:6px 4px;padding:8px}
.lvi{width:84px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:3px 0;border:0;background:none;cursor:default}
.lvi .dlab{max-width:82px;padding:0 2px;text-align:center;line-height:13px;border:1px dotted transparent;overflow-wrap:anywhere}
.lvi.sel .dlab{background:var(--sel);color:#fff}
.lvi.sel svg{filter:brightness(.62) sepia(1) hue-rotate(195deg) saturate(5)}
.lvi:focus{outline:none}.lvi:focus-visible .dlab{border-color:#000}
table.details{border-collapse:separate;border-spacing:0;width:100%;min-width:480px;table-layout:fixed}
table.details th{position:sticky;top:0;z-index:1;text-align:left;font-weight:400;padding:2px 6px;background:var(--face);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  box-shadow:inset -1px -1px var(--dk),inset 1px 1px var(--hl),inset -2px -2px var(--sh)}
table.details td{padding:2px 6px;vertical-align:top;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
table.details td.wrap{white-space:normal}
table.details tr.row{cursor:default}
table.details tr.row td:first-child span.nm{padding:0 2px}
table.details tr.row.sel td:first-child span.nm{background:var(--sel);color:#fff}
table.details td .cell{display:flex;align-items:center;gap:4px}
table.details tr.grp td{padding:8px 6px 3px;font-weight:700;color:var(--navy);border-bottom:1px solid var(--sh)}
table.details a{color:#0000ee}

/* ---------------- notepad ---------------- */
.notepad{flex:1 1 auto;min-height:0;display:flex;background:#fff;padding:2px}
.notepad textarea{flex:1;min-width:0;border:0;resize:none;outline:none;padding:2px 4px;font:13px/1.35 var(--mono);color:#000;background:#fff;user-select:text;-webkit-user-select:text}

/* ---------------- dialogs ---------------- */
.dlg{padding:12px 12px 10px;display:flex;flex-direction:column;gap:12px}
.dlg-row{display:flex;gap:14px;align-items:flex-start}
.dlg-text{line-height:1.45;max-width:46ch;user-select:text;-webkit-user-select:text}
.dlg-text p{margin:0 0 8px}.dlg-text p:last-child{margin:0}
.dlg-text dl{margin:8px 0 0;display:grid;grid-template-columns:auto 1fr;gap:3px 10px}
.dlg-text dt{color:#404040}.dlg-text dd{margin:0}
.doc{flex:1 1 auto;min-height:0;overflow:auto;background:#fff;padding:12px 16px 16px;line-height:1.5;user-select:text;-webkit-user-select:text}
.doc h2{font-size:15px;margin:0 0 6px}.doc h3{font-size:13px;margin:16px 0 4px;padding-top:10px;border-top:1px solid #dfdfdf}
.doc p{margin:0 0 8px;max-width:72ch}.doc ul{margin:0 0 8px;padding-left:20px;max-width:72ch}.doc li{margin:0 0 3px}
.doc code{font:12px var(--mono);background:#f0f0f0;padding:0 3px}

.doc .glance b{white-space:nowrap}
.doc .btnrow{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 8px}
.dlg-btns{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}

.tabs button{border:0;background:var(--face);padding:3px 10px 4px;margin-right:-1px;cursor:pointer;position:relative;top:2px;
  box-shadow:inset 1px 1px var(--hl),inset -1px 0 var(--dk),inset -2px 0 var(--sh),inset 2px 2px var(--lt)}
.tabs button[aria-selected="true"]{top:0;padding-bottom:6px;margin:0 -2px;z-index:2}
.tabpanel{padding:12px;box-shadow:inset -1px -1px var(--dk),inset 1px 1px var(--hl),inset -2px -2px var(--sh),inset 2px 2px var(--lt)}
fieldset{border:0;margin:0;padding:10px 8px 8px;box-shadow:inset -1px -1px var(--hl),inset 1px 1px var(--sh),inset -2px -2px var(--sh),inset 2px 2px var(--hl);position:relative}
legend{padding:0 3px;margin-left:-2px}
.listbox{background:#fff;overflow:auto;padding:2px;box-shadow:inset -1px -1px var(--hl),inset 1px 1px var(--sh),inset -2px -2px var(--lt),inset 2px 2px var(--dk)}
.listbox button{display:block;width:100%;text-align:left;border:0;background:none;padding:1px 3px;cursor:default}
.listbox button[aria-selected="true"]{background:var(--sel);color:#fff}
.preview-mon{width:170px;margin:0 auto;display:flex;flex-direction:column;align-items:center}
.pm-case{width:170px;padding:9px 9px 18px;background:linear-gradient(#e9e4d6,#cfc8b4);border-radius:6px;box-shadow:inset 0 1px #fff,inset 0 -2px #aaa38e,1px 2px 0 rgba(0,0,0,.25)}

.pm-stand{width:60px;height:10px;background:linear-gradient(#bdb6a1,#a8a18c);clip-path:polygon(18% 0,82% 0,100% 100%,0 100%)}
.swatches{display:grid;grid-template-columns:repeat(8,18px);gap:3px}
.swatches button{width:18px;height:18px;border:0;padding:0;cursor:pointer;box-shadow:inset -1px -1px var(--hl),inset 1px 1px var(--sh),inset -2px -2px var(--lt),inset 2px 2px var(--dk)}

.radio{display:flex;align-items:center;gap:6px;cursor:pointer}
.radio input,.check input{margin:0;accent-color:#000}
.check{display:flex;align-items:center;gap:6px;cursor:pointer}
input[type=text],input[type=search]{font:inherit;border:0;border-radius:0;background:#fff;padding:3px 4px;min-height:21px;outline:none;user-select:text;-webkit-user-select:text;

select{font:inherit;border:0;border-radius:0;background:#fff;min-height:21px;box-shadow:inset -1px -1px var(--hl),inset 1px 1px var(--sh),inset -2px -2px var(--lt),inset 2px 2px var(--dk)}

/* ---------------- boot / off ---------------- */
.boot{position:absolute;inset:0;z-index:25000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:#fff;cursor:pointer;
  background:radial-gradient(ellipse 22% 9% at 18% 24%,rgba(255,255,255,.9),rgba(255,255,255,0) 70%),radial-gradient(ellipse 26% 10% at 72% 18%,rgba(255,255,255,.85),rgba(255,255,255,0) 70%),
    radial-gradient(ellipse 30% 11% at 38% 70%,rgba(255,255,255,.8),rgba(255,255,255,0) 70%),radial-gradient(ellipse 20% 8% at 84% 64%,rgba(255,255,255,.85),rgba(255,255,255,0) 70%),
    linear-gradient(180deg,#2b6fd0,#8dbbef)}
.boot .logo{display:flex;align-items:center;gap:14px;color:#000;text-shadow:none}
.boot .logo b{font:700 clamp(26px,5vw,52px)/1 var(--brand);letter-spacing:-.01em}
.boot .logo i{font:700 clamp(26px,5vw,52px)/1 var(--brand);font-style:normal;color:#fff;-webkit-text-stroke:1px #000}
.boot small{font:500 clamp(11px,1.4vw,15px) var(--brand);color:#0a1a33}
.boot .bar{position:absolute;left:0;right:0;bottom:0;height:10px;overflow:hidden;background:#000}
.boot .bar::before{content:"";position:absolute;inset:0;width:200%;background:linear-gradient(90deg,#000,#0000a8,#00a8ff,#0000a8,#000,#0000a8,#00a8ff,#0000a8,#000);animation:bootbar 1.4s linear infinite}
@keyframes bootbar{to{transform:translateX(-50%)}}
.off{position:absolute;inset:0;z-index:25000;background:#000;display:flex;align-items:center;justify-content:center;padding:20px;text-align:center;
  font:700 clamp(16px,3vw,30px)/1.3 var(--brand);color:#e8902a;cursor:pointer}
.off.black{color:transparent}
@media (prefers-reduced-motion:reduce){ .boot .bar::before{animation:none} }

/* ---------------- minesweeper ---------------- */
.ms{padding:6px;background:var(--face);box-shadow:inset 3px 3px var(--hl),inset -3px -3px var(--sh);display:inline-flex;flex-direction:column;gap:6px;margin:0 auto}
.ms-top{display:flex;align-items:center;justify-content:space-between;padding:4px 6px;box-shadow:inset 2px 2px var(--sh),inset -2px -2px var(--hl)}
.ms-led{display:flex;background:#000;padding:1px;box-shadow:1px 1px 0 var(--hl),-1px -1px 0 var(--sh)}
.ms-face{width:26px;height:26px;border:0;padding:0;display:grid;place-items:center;background:var(--face);cursor:pointer;
  box-shadow:inset -1px -1px var(--sh),inset 1px 1px var(--hl),inset -2px -2px var(--sh),inset 2px 2px var(--hl),0 0 0 1px var(--sh)}
.ms-face:active{box-shadow:inset 1px 1px var(--sh),0 0 0 1px var(--sh)}
.ms-face:active svg{transform:translate(1px,1px)}
.ms-board{display:grid;box-shadow:inset 3px 3px var(--sh),inset -3px -3px var(--hl);padding:3px;touch-action:manipulation;-webkit-touch-callout:none}
.ms-board .c{width:16px;height:16px;display:grid;place-items:center;font:700 13px/1 Tahoma,Verdana,Arial,sans-serif;cursor:default;background:var(--face);
  box-shadow:inset -2px -2px var(--sh),inset 2px 2px var(--hl)}
.ms-board .c.down,.ms-board .c.o{box-shadow:inset 1px 1px var(--sh)}
.ms-board .c.boom{background:#ff0000}
.ms-board .n1{color:#0000ff}.ms-board .n2{color:#008000}.ms-board .n3{color:#ff0000}.ms-board .n4{color:#000080}
.ms-board .n5{color:#800000}.ms-board .n6{color:#008080}.ms-board .n7{color:#000}.ms-board .n8{color:#808080}
.ms-wrap{padding:0;overflow:auto;max-width:100%;max-height:100%;display:flex}

/* ---------------- solitaire ---------------- */
.sol-wrap{flex:1 1 auto;min-height:0;display:flex;padding:2px;background:var(--face)}
.sol{position:relative;flex:1;min-width:0;background:#008000;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;--cw:71px}
.sol .slot{position:absolute;border:1px solid #003c00;border-radius:4px;box-shadow:1px 1px 0 #00a000 inset}
.sol .slot.waste{border-color:transparent;box-shadow:none}
.sol .slot.stock{cursor:pointer}
.sol .slot.stock.recycle::after{content:"";position:absolute;left:50%;top:50%;width:46%;aspect-ratio:1;transform:translate(-50%,-50%);border:calc(var(--cw)*.07) solid #00d000;border-radius:50%;box-sizing:border-box}
.sol .slot.stock.done::after{content:"\2715";position:absolute;inset:0;display:grid;place-items:center;color:#00c000;font:700 calc(var(--cw)*.45)/1 Arial,sans-serif}
.card{position:absolute;box-sizing:border-box;border:1px solid #000;border-radius:calc(var(--cw)*.06);background:#fff;overflow:hidden;cursor:default;
  font:700 calc(var(--cw)*.2)/1 Arial,Helvetica,sans-serif;color:#000;transition:left .12s ease-out,top .12s ease-out}
.card.red{color:#d40000}
.card.drag{transition:none;box-shadow:2px 3px 0 rgba(0,0,0,.35)}
.card.back > *{display:none!important}
.card.back::before{content:"";position:absolute;inset:calc(var(--cw)*.05);border:1px solid #0b2a7a;border-radius:2px;background-color:#1f4fbf;
  background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.38) 0 1px,transparent 1px 5px),repeating-linear-gradient(-45deg,rgba(255,255,255,.38) 0 1px,transparent 1px 5px)}
.card .ci{position:absolute;display:flex;flex-direction:column;align-items:center;width:calc(var(--cw)*.24);letter-spacing:-.05em;line-height:.95}
.card .ci i{font-style:normal;font-size:.95em}
.card .tl{left:1px;top:3px}
.card .br{right:1px;bottom:3px;transform:rotate(180deg)}
.card .pip{position:absolute;transform:translate(-50%,-50%);font-size:calc(var(--cw)*.21);line-height:1}
.card .pip.flip{transform:translate(-50%,-50%) rotate(180deg)}
.card .ace{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:calc(var(--cw)*.55);line-height:1}
.card .fc{position:absolute;inset:17% 22%;border:1px solid currentColor;background:#fbf0cf;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:calc(var(--cw)*.34);line-height:1}
.card .fc i{font-style:normal;font-size:.7em}
.sol-cv{position:absolute;inset:0;z-index:5000;cursor:pointer}
/* ---------------- lemonwire ---------------- */
.lw-bar{height:18px;background:#fff;padding:2px;overflow:hidden}
.lw-bar-fill{height:100%;width:0;background:repeating-linear-gradient(90deg,#000080 0 10px,#1084d0 10px 12px);transition:width .15s linear}

<noscript><div class="nojs"><h1>UsefulDFIR</h1><p>Tools for incident response, readiness and threat intelligence, by Danny Howett. This page needs JavaScript for its desktop; every tool is linked below.</p><h2>Incident management</h2><ul><li><a href="TRACE-CMS.html">TRACE</a>: Case management for DFIR work. Log evidence with chain of custody and integrity hashes, track IOCs with ATT&amp;CK tagging and automatic defanging, record response actions and regulatory notifications, and build a single incident timeline through to structured closure.</li><li><a href="incident-command-console.html">Incident Command Console</a> (beta): A single-screen war-room dashboard for the incident commander during a live incident.</li><li><a href="incident-timeline-creator.html">Incident Timeline Creator</a> (beta): Capture events as they surface and build a visual timeline as you go.</li><li><a href="ioc-list.html">IOC List</a> (beta): Track indicators as they surface, from IPs and hashes to registry keys, mutexes and CVEs.</li><li><a href="evidence-register.html">Evidence Register</a> (beta): Lightweight register of physical devices and digital artefacts collected during an incident.</li><li><a href="action-tracker.html">Action Tracker</a> (beta): Actions log for live incidents with owners, priorities, due dates and workstreams.</li><li><a href="pir-builder.html">Post-Incident Review Builder</a> (beta): A guided, blameless review to close the loop after an incident.</li></ul><h2>Threat intelligence</h2><ul><li><a href="attack-technique-mapper.html">ATT&amp;CK Technique Mapper</a>: Paste analyst notes or type tools, commands and event IDs to get suggested techniques and sub-techniques. Put them in scope with confidence and evidence, compare with ATT&amp;CK groups and software, and see the mitigations and detection strategies that apply.</li><li><a href="threat-actor-index.html">Threat Actor Index</a> (beta): Searchable reference of 68 threat actor groups across espionage, disruption, financial and hacktivist motivations.</li><li><a href="threat-actor-profiles.html">Threat Actor Profiles</a> (beta): Profiles of key groups covering motivation, typical TTPs, targeted sectors and geography.</li><li><a href="adversary-mindsets.html">Adversary Mindsets</a> (beta): How different adversary types actually think, so &quot;think like an attacker&quot; becomes specific.</li><li><a href="ti-workflow.html">TI Workflow &amp; Dissemination</a> (beta): End-to-end intelligence workflow across the full intelligence lifecycle.</li><li><a href="cti-reference.html">CTI Reference Guide</a> (beta): Intelligence lifecycle, source taxonomy, intelligence types beyond IOCs and email authentication in one reference.</li></ul><h2>Operations &amp; DFIR</h2><ul><li><a href="EmailHeaderAnalyser.html">Email Header Analyser</a>: Paste a message or drop an .eml file to see who it claims to be from against who really sent it: trusted SPF, DKIM, DMARC and ARC results, the delivery path with timing, look-alike domains, deceptive links and attachment hashes.</li><li><a href="psparse.html">psparse</a>: Paste a PowerShell command, command line or Event ID 4104 script block. psparse peels base64, gzip, format-string, char-code and backtick obfuscation layer by layer, explains each part, scores it against 45 detection rules and maps it to ATT&amp;CK v19.2, without ever executing it.</li><li><a href="notelet.html">Notelet</a>: A tabbed notebook that lives in the browser. Notes stay open across sessions until you close them, a Stickies board keeps quick thoughts one click away, and you can search, sort and switch between serif and monospace writing fonts.</li><li><a href="cyber-incident-decision-tree.html">Cyber Incident Decision Tree</a> (beta): Step-by-step triage for active cyber incidents.</li><li><a href="containment-decision-matrix.html">Containment Decision Matrix</a> (beta): Architecture-aware containment options for the incident commander under pressure.</li><li><a href="windows-dfir-walkthrough.html">Windows DFIR Walkthrough</a> (beta): Eight-phase investigation checklist for networked Windows endpoints, including event ID and artefact reference.</li><li><a href="v2dfir-dashboard.html">DFIR Dashboard</a> (beta): Browser-based analysis dashboard for digital forensics and incident response.</li><li><a href="client-portal.html">Mock Client Portal</a> (beta): Demonstration portal showing how findings, incident updates and risk posture could be presented to clients.</li></ul><h2>Readiness &amp; exercises</h2><ul><li><a href="cyber-tabletop-exercise-builder.html">Tabletop Exercise Builder</a>: Twelve incident scenarios personalised to the client&#x27;s technology stack. Plan the run sheet, run the room with an exercise clock, decision log and a participant screen for the projector, then rate objectives and build the improvement plan.</li><li><a href="cyber-readiness-assessment.html">CIRA</a>: Tiered assessment across 8 domains and 40 controls, with sector overlays for 10 regulated industries, threat profiling, a maturity radar with peer benchmarking, improvement and retest tracking, 8 tabletop scenarios and a full PDF report.</li><li><a href="purple-team-exercise-builder.html">Purple Team Exercise Builder</a> (beta): Build a structured purple team exercise from a scenario such as ransomware, IAB access, insider, BEC or living off the land.</li><li><a href="attackers-eye-view.html">Attacker&#x27;s Eye View</a> (beta): Review your defences from the attacker&#x27;s side to see where an intrusion would most likely succeed.</li><li><a href="cyber-incident-lifecycle.html">Cyber Incident Lifecycle</a> (beta): Visual guide to incident phases, from detection through containment, eradication, recovery and lessons learned.</li></ul><h2>Assessment &amp; frameworks</h2><ul><li><a href="v3_NCSC-CAF-v4-Assessment-Tool.html">NCSC CAF v4.0 Assessment</a>: Interactive assessment of all 41 contributing outcomes across the 4 objectives and 14 principles of CAF v4.0 (August 2025), with a risk matrix, improvement plan, maturity radar and exportable report.</li><li><a href="phishing-programme-maturity.html">Phishing Programme Maturity</a>: Six dimensions and 35 controls, from governance and simulation quality to reporting culture, SOC integration and the technical defences around users. Sector and size set the expected tier, and anti-pattern checks flag practices that may be doing harm.</li><li><a href="cyber-maturity-assessment.html">Cyber Maturity Assessment</a>: Score maturity from 0 to 5 against NIST CSF 2.0, ISO/IEC 27001:2022 or CIS Controls v8.1, or your own model. Record evidence, confidence and a target for every area, then get risk-weighted gaps, a prioritised roadmap, an incident readiness view and an indicative CAF crosswalk.</li><li><a href="cisr_assessment.html">CREST CISR Maturity Assessment</a> (beta): Structured evaluation against the CREST Cyber Security Incident Response (CSIR) maturity model.</li><li><a href="zero-trust-maturity-assessment.html">Zero Trust Maturity Assessment</a> (beta): Thirty capabilities across the five Zero Trust pillars, mapped to CISA ZTMM v2.0.</li><li><a href="iam-maturity-assessment.html">IAM Maturity Assessment</a> (beta): Thirty-two workforce identity capabilities across eight domains, from joiner-mover-leaver to privileged access.</li><li><a href="control-effectiveness-matrix.html">Control Effectiveness Matrix</a> (beta): Rate how well security controls hold up across threat categories.</li><li><a href="csr_tiers.html">CSR Tiers</a> (beta): Interactive reference for Cyber Security Requirements tiering.</li></ul><h2>Risk</h2><ul><li><a href="supplier-cyber-risk.html">Supplier Cyber Risk Assessment</a> (beta): Right-sized supplier risk assessment with a portfolio view across suppliers.</li><li><a href="cyber-risk-matrix.html">Cyber Risk Matrix</a> (beta): Plot and manage risks by likelihood and impact.</li></ul><h2>Compliance</h2><ul><li><a href="audit-evidence-pack-builder.html">Audit Evidence Pack Builder</a> (beta): Assemble a structured evidence pack for ISO 27001:2022, NCSC CAF v4.0 or NHS DSPT v8.</li><li><a href="sector-cyber-compliance.html">Sector Cyber Compliance Reference</a> (beta): Regulations, frameworks and incident notification duties across 10 UK sectors.</li></ul><h2>OT &amp; industrial</h2><ul><li><a href="ot-incident-triage.html">OT Incident Triage</a> (beta): Safety-first decision support for IT-trained responders facing an OT alert.</li><li><a href="ot-essentials.html">OT Essentials</a> (beta): An orientation to operational technology for readers with an IT background.</li><li><a href="ot-forensics-guide-v2.html">OT Forensics Guide</a> (beta): Forensic investigation in OT/ICS by Purdue level, mapped to ATT&amp;CK for ICS, IEC 62443 and NIST SP 800-82.</li></ul><p><a href="https://github.com/danhowett/useful">github.com/danhowett/useful</a> · <a href="https://www.linkedin.com/in/dannyhowett/">LinkedIn</a></p><h2>Privacy and licence</h2><p>The tools run entirely in your browser and never upload your data. This page loads one font from Google Fonts, which means your browser contacts Google's font servers (no cookies are sent). All tools are free to use for personal and commercial work; please do not redistribute, resell or rehost them. Provided as is, without warranty.</p></div></noscript>

/* ================================================================

var Menu = {
  stack: [],
  timer: null,
  isOpen: function(){ return this.stack.length > 0; },
  closeAll: function(){
    clearTimeout(this.timer);
    this.closeFrom(0);
    startBtn.classList.remove('pressed');
    startBtn.setAttribute('aria-expanded', 'false');
  },
  closeFrom: function(level){
    while (this.stack.length > level){
      var m = this.stack.pop();
      m.el.remove();
      if (m.owner) m.owner.classList.remove('menu-open', 'sub-open');
    }
  },
  open: function(items, anchor, opts){
    opts = opts || {};
    var level = opts.level || 0, self = this;
    this.closeFrom(level);
    var el = h('div', { class: 'menu' + (opts.start ? ' start' : ''), role: 'menu' });
    var list = el;
    if (opts.start){
      el.append(h('div', { class: 'start-band', html: '<span>Useful<b>DFIR</b> 95</span>' }));
      list = h('div', { class: 'start-items' }); el.append(list);
    }
    items.forEach(function(it){
      if (!it) return;
      if (it.sep){ list.append(h('div', { class: 'msep', role: 'separator' })); return; }
      var size = opts.start ? 24 : 16;
      var mark = it.checked ? '<svg class="mono" width="16" height="16" viewBox="0 0 16 16" shape-rendering="crispEdges"><path d="M4 7h1v1h1v1h1V8h1V7h1V6h1V5h1v3h-1v1H9v1H8v1H7v1H6v-1H5V9H4z"/></svg>'
               : it.radio ? '<svg class="mono" width="16" height="16" viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.5"/></svg>' : '';
      var b = h('button', { class: 'mi', type: 'button', role: 'menuitem', disabled: it.disabled || null, 'aria-haspopup': it.sub ? 'menu' : null },
        h('span', { class: 'mico', html: it.icon ? (typeof it.icon === 'string' && it.icon.charAt(0) === '<' ? it.icon : ico(it.icon, size)) : mark }),
        h('span', { class: 'mlab', html: it.label }),
        it.key ? h('span', { class: 'mkey', text: it.key }) : null,
        it.sub ? h('span', { class: 'marr' }) : null);
      if (it.title) b.title = it.title;
      b.addEventListener('mouseenter', function(){
        clearTimeout(self.timer);
        if (it.sub){ self.timer = setTimeout(function(){ openSub(); }, 200); }
        else self.timer = setTimeout(function(){ self.closeFrom(level + 1); }, 200);
      });
      function openSub(){
        if (self.stack[level + 1] && self.stack[level + 1].owner === b) return;
        var subItems = typeof it.sub === 'function' ? it.sub() : it.sub;
        self.open(subItems, { rect: b.getBoundingClientRect(), side: 'right' }, { level: level + 1, owner: b });
        b.classList.add('sub-open');
      }
      b.addEventListener('click', function(e){
        e.stopPropagation();
        if (it.disabled) return;
        if (it.sub){ clearTimeout(self.timer); openSub(); return; }
        self.closeAll();
        if (it.action) it.action();
      });
      b.addEventListener('keydown', function(e){
        var all = [].slice.call(list.querySelectorAll('.mi:not(:disabled)')), i = all.indexOf(b);
        if (e.key === 'ArrowDown'){ e.preventDefault(); (all[i + 1] || all[0]).focus(); }
        else if (e.key === 'ArrowUp'){ e.preventDefault(); (all[i - 1] || all[all.length - 1]).focus(); }
        else if (e.key === 'ArrowRight' && it.sub){ e.preventDefault(); openSub(); var f = self.stack[level + 1].el.querySelector('.mi:not(:disabled)'); f && f.focus(); }
        else if (e.key === 'ArrowLeft' && level > 0){ e.preventDefault(); var ow = self.stack[level].owner; self.closeFrom(level); ow && ow.focus(); }
      });
      list.append(b);
    });
    screenEl.append(el);
    this.stack.push({ el: el, owner: opts.owner || null, level: level });
    this.place(el, anchor);
    return el;
  },
  place: function(el, a){
    var sr = screenEl.getBoundingClientRect(), W = screenEl.clientWidth, H = screenEl.clientHeight - 28;
    var mw = el.offsetWidth, mh = el.offsetHeight, x, y;
    if (a.point){ x = a.point.x - sr.left; y = a.point.y - sr.top; }
    else {
      var r = a.rect, L = r.left - sr.left, T = r.top - sr.top, R = r.right - sr.left, B = r.bottom - sr.top;
      if (a.side === 'right'){ x = R - 3; y = T - 3; if (x + mw > W){ x = L - mw + 3; if (x < 0){ x = Math.max(0, Math.min(W - mw, L + 18)); y = T + 10; } } }
      else if (a.side === 'up'){ x = L; y = T - mh + 1; H = screenEl.clientHeight; }
      else { x = L; y = B; }
    }
    if (x + mw > W) x = W - mw;
    if (x < 0) x = 0;
    if (y + mh > H) y = H - mh;
    if (y < 0) y = 0;
    if (mh > H){ el.style.maxHeight = H + 'px'; el.style.overflowY = 'auto'; }
    el.style.left = x + 'px'; el.style.top = y + 'px';
  }
};
document.addEventListener('pointerdown', function(e){
  if (!Menu.isOpen()) return;
  if (e.target.closest('.menu') || e.target.closest('#startBtn') || e.target.closest('.menubar > button.menu-open')) return;
  Menu.closeAll();
});

function menubar(defs, win){
  var bar = h('div', { class: 'menubar', role: 'menubar' });
  defs.forEach(function(d){
    var b = h('button', { type: 'button', html: '<u>' + esc(d.label.charAt(0)) + '</u>' + esc(d.label.slice(1)), 'aria-haspopup': 'menu' });
    function show(){
      Menu.closeAll();
      var items = typeof d.items === 'function' ? d.items() : d.items;
      Menu.open(items, { rect: b.getBoundingClientRect(), side: 'down' }, { owner: b });
      b.classList.add('menu-open');
    }
    b.addEventListener('click', function(){ if (b.classList.contains('menu-open')) Menu.closeAll(); else show(); });
    b.addEventListener('mouseenter', function(){ if (Menu.isOpen() && bar.querySelector('.menu-open') && !b.classList.contains('menu-open')) show(); });
    bar.append(b);
  });
  return bar;
}

function makeWindow(o){
  if (o.id && wins[o.id]){ var ex = wins[o.id]; ex.restore(); ex.focus(); if (o.reuse) o.reuse(ex); return ex; }
  var id = o.id || ('w' + (++winSeq));

  var bMax = o.maximizable === false ? null : h('button', { class: 'tbtn', type: 'button', 'aria-label': 'Maximise', html: TB.max });
  var bClose = h('button', { class: 'tbtn close', type: 'button', 'aria-label': 'Close', html: TB.close });
  var tb = h('div', { class: 'titlebar' }, h('span', { html: ico(o.icon || 'programs', 16, o.iconArg) }), ttext, h('div', { class: 'tbtns' }, bMin, bMax, bClose));

  if (o.taskbar !== false) taskList.append(task);
  task.addEventListener('click', function(){
    if (activeWin === api && !api.min) api.minimize(); else { api.restore(); api.focus(); }
  });

  };

    el.remove(); task.remove(); delete wins[id];

  };
  api.task = task;
  wins[id] = api;

  if (o.render) o.render(body, api);

  /* size and position */
  var D = deskSize();
  if (o.auto){
    el.style.width = 'auto';
    var w0 = el.offsetWidth, h0 = el.offsetHeight;
    var x0 = o.x != null ? o.x : Math.max(0, Math.round((D.w - w0) / 2) + (o.center ? 0 : (cascade % 5) * 16 - 32));
    var y0 = o.y != null ? o.y : Math.max(0, Math.round((D.h - h0) / 2.4) + (o.center ? 0 : (cascade % 5) * 16 - 32));
    el.style.left = x0 + 'px'; el.style.top = y0 + 'px';
  } else {
    var w = Math.min(o.w || 640, D.w - 8), hh = Math.min(o.h || 420, D.h - 8);
    var left0 = D.w - w >= 120 ? 100 : Math.max(0, D.w - w - 4);
    var x = o.x != null ? o.x : (o.center ? (D.w - w) / 2 : Math.min(D.w - w, left0 + (cascade % 6) * 26));
    var y = o.y != null ? o.y : (o.center ? (D.h - hh) / 2.6 : Math.min(D.h - hh, 14 + (cascade % 6) * 22));

    var el = h('button', { class: 'dicon', type: 'button', 'data-id': d.id, 'aria-label': d.label + '. Double-click to open.' },
      h('span', { class: 'dimg', html: ico(d.icon, 32) }), h('span', { class: 'dlab', text: d.label }));

      selectIcon(el); Menu.closeAll();
      drag = { sx: e.clientX, sy: e.clientY, ox: el.offsetLeft, oy: el.offsetTop, moved: false, id: e.pointerId };
      el.setPointerCapture(e.pointerId);

    el.addEventListener('pointermove', function(e){
      if (!drag) return;
      var dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;

   MINESWEEPER

var LEVELS = { beginner: [9, 9, 10], intermediate: [16, 16, 40], expert: [16, 30, 99] };
var SEG = { 0: 'abcdef', 1: 'bc', 2: 'abged', 3: 'abgcd', 4: 'fgbc', 5: 'afgcd', 6: 'afgedc', 7: 'abc', 8: 'abcdefg', 9: 'abcdfg', '-': 'g' };
var SEGR = { a: [2, 1, 9, 2], b: [10, 2, 2, 9], c: [10, 12, 2, 9], d: [2, 20, 9, 2], e: [1, 12, 2, 9], f: [1, 2, 2, 9], g: [2, 10.5, 9, 2] };
function ledHTML(n){
  n = Math.max(-99, Math.min(999, n));
  var s = n < 0 ? '-' + String(-n).padStart(2, '0') : String(n).padStart(3, '0');
  return s.split('').map(function(ch){
    var on = SEG[ch] || '';
    return '<svg width="13" height="23" viewBox="0 0 13 23" shape-rendering="crispEdges">' + 'abcdefg'.split('').map(function(k){
      var r = SEGR[k]; return '<rect x="' + r[0] + '" y="' + r[1] + '" width="' + r[2] + '" height="' + r[3] + '" fill="' + (on.indexOf(k) > -1 ? '#ff0000' : '#400000') + '"/>';
    }).join('') + '</svg>';
  }).join('');
}
function faceSVG(kind){
  var eyes = kind === 'dead' ? '<path d="M7 8l3 3M10 8l-3 3M14 8l3 3M17 8l-3 3" stroke="#000" stroke-width="1.2"/>'
    : kind === 'cool' ? '<path d="M5 9h14v1h-1v2h-4v-2h-4v2H6v-2H5z" fill="#000"/>'
    : '<rect x="8" y="8" width="2" height="2"/><rect x="14" y="8" width="2" height="2"/>';
  var mouth = kind === 'dead' ? '<path d="M8 18q4-4 8 0" fill="none" stroke="#000" stroke-width="1.3"/>'
    : kind === 'o' ? '<circle cx="12" cy="16.5" r="2" fill="none" stroke="#000" stroke-width="1.3"/>'
    : '<path d="M7.5 14q4.5 4.5 9 0" fill="none" stroke="#000" stroke-width="1.3"/>';
  return '<svg width="20" height="20" viewBox="2 2 20 20"><circle cx="12" cy="12" r="8.5" fill="#ffff00" stroke="#000"/>' + eyes + mouth + '</svg>';
}
var MINE_SVG = '<svg width="13" height="13" viewBox="0 0 13 13" shape-rendering="crispEdges"><path d="M6 0h1v13H6zM0 6h13v1H0z"/><circle cx="6.5" cy="6.5" r="4"/><path d="M2 2h1v1H2zM10 2h1v1h-1zM2 10h1v1H2zM10 10h1v1h-1z"/><rect x="4" y="4" width="2" height="2" fill="#fff"/></svg>';
var FLAG_SVG = '<svg width="12" height="12" viewBox="0 0 12 12" shape-rendering="crispEdges"><path d="M3 1h4v5H3z" fill="#f00"/><path d="M1 1h2v1H1zM0 2h3v1H0zM1 3h2v1H1z" fill="#f00"/><path d="M6 6h1v3H6z"/><path d="M4 9h5v1H4zM2 10h9v2H2z"/></svg>';
var WRONG_SVG = '<svg width="13" height="13" viewBox="0 0 13 13">' + MINE_SVG.replace(/^<svg[^>]*>|<\/svg>$/g, '') + '<path d="M1 1l11 11M12 1L1 12" stroke="#f00" stroke-width="1.6"/></svg>';

function openMines(){
  if (wins.mines){ wins.mines.restore(); wins.mines.focus(); return wins.mines; }
  var st = { level: store.get('msLevel', 'beginner'), marks: store.get('msMarks', true) };
  var g = null, api = null;
  var wrap = h('div', { class: 'ms-wrap' });
  var mineLed = h('div', { class: 'ms-led', 'aria-label': 'Mines left' }), timeLed = h('div', { class: 'ms-led', 'aria-label': 'Time' });
  var face = h('button', { class: 'ms-face', type: 'button', 'aria-label': 'New game', onclick: function(){ newGame(); } });
  var board = h('div', { class: 'ms-board', role: 'grid', 'aria-label': 'Minefield' });
  var ms = h('div', { class: 'ms' }, h('div', { class: 'ms-top' }, mineLed, face, timeLed), board);
  wrap.append(ms);
  api = makeWindow({ id: 'mines', title: 'Minesweeper', icon: 'mine', auto: true, maximizable: false, resizable: false,
    menu: [
      { label: 'Game', items: function(){ return [
        { label: 'New', key: 'F2', action: newGame }, { sep: true },
        { label: 'Beginner', checked: st.level === 'beginner', action: function(){ setLevel('beginner'); } },
        { label: 'Intermediate', checked: st.level === 'intermediate', action: function(){ setLevel('intermediate'); } },
        { label: 'Expert', checked: st.level === 'expert', action: function(){ setLevel('expert'); } }, { sep: true },
        { label: 'Marks (?)', checked: st.marks, action: function(){ st.marks = !st.marks; store.set('msMarks', st.marks); } }, { sep: true },
        { label: 'Best Times…', action: bestTimes }, { sep: true },
        { label: 'Exit', action: function(){ api.close(); } }]; } },
      { label: 'Help', items: [{ label: 'How to play', action: function(){ msgBox({ title: 'Minesweeper Help', icon: 'info', html:
        '<p>Uncover every square that is not a mine.</p><p><b>Click</b> to uncover a square. A number tells you how many mines touch it.</p><p><b>Right-click</b> (or press and hold on a touch screen) to plant a flag, and again for a question mark.</p><p>Click a number when all its mines are flagged to clear the squares around it.</p><p>Press F2 or click the face for a new game.</p>' }); } },
        { label: 'About Minesweeper…', action: function(){ msgBox({ title: 'About Minesweeper', icon: 'mine', text: 'Minesweeper for UsefulDFIR 95. Unlike a real incident, the first click is always safe.' }); } }] }
    ],
    render: function(body, a){ api = a; body.append(wrap); newGame(); },
    onClose: function(){ if (g) clearInterval(g.timer); },
    onKey: function(e){ if (e.key === 'F2'){ e.preventDefault(); newGame(); } }
  });
  function setLevel(l){ st.level = l; store.set('msLevel', l); newGame(); }
  function newGame(){
    if (g) clearInterval(g.timer);
    var L = LEVELS[st.level];
    g = { R: L[0], C: L[1], M: L[2], cells: [], started: false, over: false, opened: 0, flags: 0, time: 0, timer: null };
    board.style.gridTemplateColumns = 'repeat(' + g.C + ',16px)';
    board.textContent = '';
    for (var i = 0; i < g.R * g.C; i++){
      var c = { i: i, r: Math.floor(i / g.C), c: i % g.C, mine: false, n: 0, open: false, mark: 0, el: h('div', { class: 'c', role: 'gridcell', 'data-i': i }) };
      g.cells.push(c); board.append(c.el);
    }
    setFace('smile'); mineLed.innerHTML = ledHTML(g.M); timeLed.innerHTML = ledHTML(0);
    keepOnScreen();
  }
  function keepOnScreen(){
    if (!api || !api.el) return;
    var D = deskSize(), el = api.el;
    requestAnimationFrame(function(){
      if (el.offsetLeft + el.offsetWidth > D.w) el.style.left = Math.max(0, D.w - el.offsetWidth) + 'px';
      if (el.offsetTop + el.offsetHeight > D.h) el.style.top = Math.max(0, D.h - el.offsetHeight) + 'px';
      el.style.maxWidth = D.w + 'px'; el.style.maxHeight = D.h + 'px';
      wrap.style.maxHeight = Math.max(120, D.h - 60) + 'px';
    });
  }
  function setFace(k){ face.innerHTML = faceSVG(k); }
  function nb(c){
    var out = [];
    for (var dr = -1; dr <= 1; dr++) for (var dc = -1; dc <= 1; dc++){
      if (!dr && !dc) continue;
      var r = c.r + dr, cc = c.c + dc;
      if (r >= 0 && r < g.R && cc >= 0 && cc < g.C) out.push(g.cells[r * g.C + cc]);
    }
    return out;
  }
  function plant(safe){
    var placed = 0;
    while (placed < g.M){
      var i = Math.floor(Math.random() * g.cells.length);
      if (i === safe.i || g.cells[i].mine) continue;
      g.cells[i].mine = true; placed++;
    }
    g.cells.forEach(function(c){ c.n = nb(c).filter(function(x){ return x.mine; }).length; });
    g.started = true;
    g.timer = setInterval(function(){ if (g.time < 999){ g.time++; timeLed.innerHTML = ledHTML(g.time); } }, 1000);
    g.time = 1; timeLed.innerHTML = ledHTML(1);
  }
  function draw(c){
    var el = c.el;
    el.className = 'c' + (c.open ? ' o' + (c.n && !c.mine ? ' n' + c.n : '') : '');
    el.innerHTML = c.open ? (c.mine ? MINE_SVG : (c.n ? String(c.n) : '')) : (c.mark === 1 ? FLAG_SVG : c.mark === 2 ? '?' : '');
  }
  function reveal(c){
    if (c.open || c.mark === 1) return;
    if (!g.started) plant(c);
    if (c.mine){ lose(c); return; }
    var stack = [c];
    while (stack.length){
      var x = stack.pop();
      if (x.open || x.mark === 1) continue;
      x.open = true; x.mark = 0; g.opened++; draw(x);
      if (x.n === 0) nb(x).forEach(function(y){ if (!y.open && !y.mine) stack.push(y); });
    }
    if (g.opened === g.R * g.C - g.M) win();
  }
  function chord(c){
    if (!c.open || !c.n) return;
    var around = nb(c), flags = around.filter(function(x){ return x.mark === 1; }).length;
    if (flags !== c.n) return;
    around.forEach(function(x){ if (!g.over && !x.open && x.mark !== 1) reveal(x); });
  }
  function cycleMark(c){
    if (c.open || g.over) return;
    if (c.mark === 0){ c.mark = 1; g.flags++; }
    else if (c.mark === 1){ g.flags--; c.mark = st.marks ? 2 : 0; }
    else c.mark = 0;
    mineLed.innerHTML = ledHTML(g.M - g.flags); draw(c);
  }
  function lose(c){
    g.over = true; clearInterval(g.timer); setFace('dead');
    g.cells.forEach(function(x){
      if (x.mine && x.mark !== 1){ x.open = true; draw(x); }
      else if (!x.mine && x.mark === 1){ x.el.className = 'c o'; x.el.innerHTML = WRONG_SVG; }
    });
    c.el.classList.add('boom');
  }
  function win(){
    g.over = true; clearInterval(g.timer); setFace('cool');
    g.cells.forEach(function(x){ if (x.mine && x.mark !== 1){ x.mark = 1; draw(x); } });
    mineLed.innerHTML = ledHTML(0);
    var best = store.get('msBest', {}), cur = best[st.level];
    if (!cur || g.time < cur.t){
      var input = h('input', { type: 'text', value: (cur && cur.n) || 'Anonymous', maxlength: '32', style: 'width:100%' });
      msgBox({ title: 'Congratulations', icon: 'mine', text: 'You have the fastest time for ' + st.level + ' level. Please enter your name.', extra: input,
        onButton: function(){ best[st.level] = { t: g.time, n: input.value.trim() || 'Anonymous' }; store.set('msBest', best); bestTimes(); } });
      setTimeout(function(){ input.select(); }, 30);
    }
  }
  function bestTimes(){
    var best = store.get('msBest', {});
    var rows = ['beginner', 'intermediate', 'expert'].map(function(l){ var b = best[l]; return '<dt>' + l.charAt(0).toUpperCase() + l.slice(1) + ':</dt><dd>' + (b ? b.t + ' seconds &nbsp; ' + esc(b.n) : '999 seconds &nbsp; Anonymous') + '</dd>'; }).join('');
    msgBox({ id: 'msbest', title: 'Fastest Mine Sweepers', html: '<dl>' + rows + '</dl>', buttons: ['OK', 'Reset Scores'], onButton: function(b){ if (b === 'Reset Scores'){ store.del('msBest'); } } });
  }

  /* input */
  var down = null, lpTimer = null, lpFired = false;
  function cellAt(x, y){ var el = document.elementFromPoint(x, y); el = el && el.closest('.c'); return el && board.contains(el) ? g.cells[+el.dataset.i] : null; }
  board.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  board.addEventListener('pointerdown', function(e){
    if (g.over) return;
    var c = cellAt(e.clientX, e.clientY); if (!c) return;
    if (e.pointerType === 'mouse' && e.button === 2){ cycleMark(c); return; }
    if (e.button !== 0 && e.button !== 1) return;
    down = { c: c, x: e.clientX, y: e.clientY, chord: e.button === 1 };
    lpFired = false;
    if (!c.open && c.mark !== 1) c.el.classList.add('down');
    setFace('o');
    if (e.pointerType !== 'mouse'){
      clearTimeout(lpTimer);
      lpTimer = setTimeout(function(){ lpFired = true; c.el.classList.remove('down'); setFace('smile'); cycleMark(c); if (navigator.vibrate) try { navigator.vibrate(15); } catch(x){} }, 420);
    }
  });
  board.addEventListener('pointermove', function(e){
    if (!down) return;
    if (e.buttons === 3) down.chord = true;
    if (Math.abs(e.clientX - down.x) + Math.abs(e.clientY - down.y) > 10){ clearTimeout(lpTimer); }
  });
  function finish(e, cancel){
    clearTimeout(lpTimer);
    if (!down) return;
    var start = down; down = null;
    start.c.el.classList.remove('down');
    if (!g.over) setFace('smile');
    if (cancel || lpFired || g.over) return;
    var c = cellAt(e.clientX, e.clientY) || start.c;
    if (start.chord || c.open) chord(c); else reveal(c);
  }
  board.addEventListener('pointerup', function(e){ finish(e, false); });
  board.addEventListener('pointercancel', function(e){ finish(e, true); });
  board.addEventListener('pointerleave', function(e){ if (down && e.pointerType === 'mouse'){ down.c.el.classList.remove('down'); } });

  keepOnScreen();
  return api;
}

/* original 8-bit tune, or your own mp3 if LEMONWIRE_SONG is set */
function makeChiptune(canvas, vol, src){
  var AC = window.AudioContext || window.webkitAudioContext;
  if (!AC){ return { start: function(){}, stop: function(){}, setVolume: function(){} }; }
  var ctx = new AC(), master = ctx.createGain(), analyser = ctx.createAnalyser();

  master.connect(analyser); analyser.connect(ctx.destination);

  var N = { 0: 0, C3: 130.81, D3: 146.83, E3: 164.81, F3: 174.61, G3: 196.00, A3: 220.00, B3: 246.94,
    C4: 261.63, D4: 293.66, E4: 329.63, F4: 349.23, G4: 392.00, A4: 440.00, B4: 493.88,
    C5: 523.25, D5: 587.33, E5: 659.25, F5: 698.46, G5: 783.99 };
  var lead = ['E5','0','E5','0','G5','0','E5','0','D5','0','C5','0','D5','0','0','0',
              'C5','0','C5','0','E5','0','G5','0','A4','0','C5','0','G4','0','0','0',
              'F4','0','A4','0','C5','0','A4','0','G4','0','E4','0','G4','0','0','0',
              'C4','0','E4','0','G4','0','C5','0','G4','0','E4','0','C4','0','0','0'];
  var bass = ['C3','0','0','0','G3','0','0','0','A3','0','0','0','E3','0','0','0',
              'F3','0','0','0','C3','0','0','0','F3','0','0','0','G3','0','0','0'];
  var step = 0, STEP_MS = 125;

  function blip(freq, dur, type, g2){
    if (!freq) return;
    var o = ctx.createOscillator(), g1 = ctx.createGain();
    o.type = type; o.frequency.value = freq;
    var t = ctx.currentTime;
    g1.gain.setValueAtTime(0.0001, t); g1.gain.exponentialRampToValueAtTime(g2, t + 0.01);
    g1.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g1); g1.connect(master); o.start(t); o.stop(t + dur + 0.02);
  }
  function tick(){
    if (!running) return;
    blip(N[lead[step % lead.length]], STEP_MS / 1000 * 0.9, 'square', 0.22);
    blip(N[bass[step % bass.length]], STEP_MS / 1000 * 1.6, 'triangle', 0.3);
    step++;

  function draw(){
    if (!running) return;
    analyser.getByteFrequencyData(data);
    g.fillStyle = '#0a1a0a'; g.fillRect(0, 0, canvas.width, canvas.height);
    var n = 24, bw = canvas.width / n;
    for (var i = 0; i < n; i++){
      var v = data[i % bins] / 255, bh = Math.max(1, v * canvas.height);
      g.fillStyle = v > 0.66 ? '#e6ff00' : v > 0.33 ? '#8ad000' : '#2e7d00';
      g.fillRect(i * bw + 1, canvas.height - bh, bw - 2, bh);
    }
    raf = requestAnimationFrame(draw);
  }
  return {
    start: function(){
      if (ctx.state === 'suspended') ctx.resume();
      running = true;
      if (src){
        audioEl = new Audio(src); audioEl.loop = true; audioEl.crossOrigin = 'anonymous';
        try { var s = ctx.createMediaElementSource(audioEl); s.connect(master); } catch(e){}

      }
      draw();
    },
    stop: function(){
      running = false; clearInterval(timer); cancelAnimationFrame(raf);
      if (audioEl){ audioEl.pause(); audioEl = null; }
      try { ctx.close(); } catch(e){}
    },
    setVolume: function(v){ master.gain.value = v; }
  };
}

      if (!pausedDrawn){ render(t); if (state === 'play'){ ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(0, 0, W, VH); text('PAUSED', W / 2, VH / 2, '#fff', 14, 'center'); } pausedDrawn = true; }
      return;
    }
    pausedDrawn = false;
    if (state === 'play') update(dt);
    render(t);
    statusT -= dt; if (statusT <= 0){ statusT = 0.5; updateStatus(); }
  }
  function advance(){
    if (state === 'title' || state === 'win') newGame();
    else if (state === 'dead') restartLevel();
    else if (state === 'done'){ level++; hp = Math.min(100, hp + 25); loadLevel(level); state = 'play'; }
    updateStatus();
  }

  /* ---------- input ---------- */
  var GAME_KEYS = { KeyW: 1, KeyA: 1, KeyS: 1, KeyD: 1, ArrowUp: 1, ArrowDown: 1, ArrowLeft: 1, ArrowRight: 1, Space: 1, ControlLeft: 1, ControlRight: 1, ShiftLeft: 1, ShiftRight: 1 };
  function keyDown(e){
    if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
    if (e.ctrlKey && e.key === 'Escape') return;
    if (e.code === 'KeyM'){ toggleMute(); return; }
    if (state !== 'play'){ if (e.code === 'Space' || e.code === 'Enter'){ e.preventDefault(); if (!e.repeat) advance(); } return; }
    if (GAME_KEYS[e.code]){ keys[e.code] = true; e.preventDefault(); }
  }
  function keyUp(e){ if (keys[e.code]) keys[e.code] = false; }
  function mouseMove(e){ if (document.pointerLockElement === canvas && state === 'play') rotate((e.movementX || 0) * 0.0028); }
  function mouseUp(){ keys.Mouse = false; }
  document.addEventListener('keyup', keyUp);
  document.addEventListener('mousemove', mouseMove);
  document.addEventListener('mouseup', mouseUp);
  canvas.addEventListener('mousedown', function(e){
    if (e.button !== 0) return;
    if (state !== 'play'){ advance(); return; }
    if (!coarse && document.pointerLockElement !== canvas){ try { var p = canvas.requestPointerLock(); if (p && p.catch) p.catch(function(){}); } catch(err){} return; }
    keys.Mouse = true;
  });
  canvas.addEventListener('touchstart', function(e){ if (state !== 'play'){ e.preventDefault(); advance(); } }, { passive: false });

  if (coarse){
    var pad = h('div', { class: 'purge-pad' });
    [['TurnL', '◀'], ['KeyW', '▲'], ['KeyS', '▼'], ['TurnR', '▶'], ['Fire', 'FIRE']].forEach(function(b){
      var el = h('button', { type: 'button', class: 'purge-btn' + (b[0] === 'Fire' ? ' fire' : ''), 'aria-label': b[0], text: b[1] });
      function on(ev){ ev.preventDefault(); if (state !== 'play'){ advance(); return; } keys[b[0]] = true; }
      function off(){ keys[b[0]] = false; }
      el.addEventListener('pointerdown', on); el.addEventListener('pointerup', off); el.addEventListener('pointercancel', off); el.addEventListener('pointerleave', off);
      pad.append(el);
    });
    wrap.append(pad);
  }

  function toggleMute(){ muted = !muted; store.set('purgeMute', muted); say(muted ? 'SOUND OFF' : 'SOUND ON'); updateStatus(); }
  function destroy(){
    alive = false; cancelAnimationFrame(raf);
    document.removeEventListener('keyup', keyUp); document.removeEventListener('mousemove', mouseMove); document.removeEventListener('mouseup', mouseUp);
    try { if (document.pointerLockElement === canvas) document.exitPointerLock(); } catch(e){}
    try { if (actx) actx.close(); } catch(e){}
  }

  updateStatus();
  raf = requestAnimationFrame(frame);
  return { keyDown: keyDown, destroy: destroy, newGame: function(){ newGame(); updateStatus(); }, restartLevel: function(){ if (state !== 'title') { restartLevel(); updateStatus(); } },
           toggleMute: toggleMute, isMuted: function(){ return muted; } };
}

/* ================================================================
   START MENU
   ================================================================ */
function startItems(){
  var programs = CATS.filter(function(c){ return c.tools.length; }).map(function(c){
    return { label: esc(c.name), icon: ico('programs', 16), sub: c.tools.map(function(t){
      return { label: esc(t.name) + (t.ver ? ' <span style="opacity:.75">' + esc(t.ver) + '</span>' : ''), icon: toolIcon(t, 16), title: t.full + ': ' + t.desc, action: function(){ openTool(t); } };
    }) };
  });
  programs.push({ sep: true });
  programs.push({ label: 'Accessories', icon: ico('programs', 16), sub: [
    { label: 'Games', icon: ico('programs', 16), sub: [
      { label: 'Minesweeper', icon: ico('mine', 16), action: function(){ openMines(); } },
      { label: 'Solitaire', icon: ico('cards', 16), action: function(){ openSolitaire(); } },
      { label: 'PURGE.EXE', icon: ico('purge', 16), action: function(){ openPurge(); } }] },
    { label: 'LemonWire', icon: ico('lemonwire', 16), action: function(){ openLemonWire(); } },
    { label: 'AOL (aol.com)', icon: ico('aol', 16), action: function(){ newTab('https://www.aol.com'); } },
    { label: 'Notepad: README.TXT', icon: ico('notepad', 16), action: function(){ openReadme(); } }] });
  programs.push({ label: 'Beta Tools', icon: ico('folder', 16), action: function(){ openBeta(null); } });
  var docs = [];
  REFS.forEach(function(g){ g.docs.forEach(function(d){ docs.push({ label: esc(d[0]) + ' (' + esc(d[3]) + ')', icon: ico('doc', 16), title: d[1], action: function(){ newTab(d[2]); } }); }); });
  docs.push({ sep: true }, { label: 'README.TXT', icon: ico('notepad', 16), action: function(){ openReadme(); } }, { label: 'References', icon: ico('book', 16), action: function(){ openRefs(); } }, { label: 'Privacy & Licence', icon: ico('lock', 16), action: function(){ openPrivacy(); } });
  return [
    { label: '<u>P</u>rograms', icon: 'programs', sub: programs },
    { label: '<u>D</u>ocuments', icon: 'documents', sub: docs },
    { label: '<u>S</u>ettings', icon: 'settings', sub: [{ label: 'Display', icon: ico('monitor', 16), action: function(){ openDisplay(); } }, { label: 'Reset icon positions', icon: ico('large', 16), action: arrangeIcons }] },
    { label: '<u>F</u>ind', icon: 'find', sub: [{ label: 'Tools…', icon: ico('find', 16), action: function(){ openFind(); } }] },
    { label: '<u>H</u>elp', icon: 'help', action: function(){ openReadme(); } },
    { label: 'Pri<u>v</u>acy &amp; Licence', icon: 'lock', action: function(){ openPrivacy(); } },
    { label: 'UsefulDFIR on <u>G</u>itHub', icon: 'globe', action: function(){ newTab(GITHUB); } },
    { label: 'Danny Howett on <u>L</u>inkedIn', icon: 'card', action: function(){ newTab(LINKEDIN); } },
    { sep: true },
    { label: 'Sh<u>u</u>t Down…', icon: 'power', action: shutDownDialog }
  ];
}
function toggleStart(){
  if (startBtn.classList.contains('pressed')){ Menu.closeAll(); return; }
  Menu.closeAll();
  var el = Menu.open(startItems(), { rect: startBtn.getBoundingClientRect(), side: 'up' }, { start: true, owner: null });
  startBtn.classList.add('pressed'); startBtn.setAttribute('aria-expanded', 'true');
  if (lastPointer !== 'mouse' || document.activeElement === startBtn){ var f = el.querySelector('.mi'); f && f.focus({ preventScroll: true }); }
}
startBtn.addEventListener('click', function(e){ e.stopPropagation(); toggleStart(); });
document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && e.ctrlKey){ e.preventDefault(); toggleStart(); } });

/* ================================================================
   POWER: shut down, restart, boot
   ================================================================ */
var bootEl = $('#boot'), offEl = $('#off'), led = $('#led'), powered = true;
function boot(cb){
  offEl.hidden = true; led.className = 'led'; powered = true;
  if (reduceMotion){ cb && cb(); return; }
  bootEl.hidden = false;
  var done = false;
  function finish(){ if (done) return; done = true; bootEl.hidden = true; cb && cb(); }
  bootEl.onclick = finish;
  setTimeout(finish, 1500);
}
function startSession(){ applyWall(); buildIcons(); openReadme(); handleHash(); }
function shutDownDialog(){
  var r1 = h('input', { type: 'radio', name: 'sd', checked: true }), r2 = h('input', { type: 'radio', name: 'sd' });
  msgBox({ title: 'Shut Down UsefulDFIR', icon: 'power', text: 'Are you sure you want to:',
    extra: h('div', { style: 'display:flex;flex-direction:column;gap:6px;padding-left:46px' }, h('label', { class: 'radio' }, r1, h('span', { text: 'Shut down the computer?' })), h('label', { class: 'radio' }, r2, h('span', { text: 'Restart the computer?' }))),
    buttons: ['Yes', 'No'], onButton: function(b){ if (b !== 'Yes') return; setTimeout(function(){ if (r2.checked) restart(); else shutDown(); }, 0); } });
}
function shutDown(){
  Menu.closeAll(); closeAllWindows();
  offEl.className = 'off'; offEl.textContent = "It's now safe to turn off your computer."; offEl.hidden = false;
  led.className = 'led standby'; powered = false;
}
function restart(){ Menu.closeAll(); closeAllWindows(); offEl.className = 'off black'; offEl.textContent = ''; offEl.hidden = false; setTimeout(function(){ boot(function(){ openReadme(); }); }, 500); }
offEl.addEventListener('click', function(){ boot(function(){ openReadme(); }); });
$('#power').addEventListener('click', function(){
  if (powered){ Menu.closeAll(); offEl.className = 'off black'; offEl.textContent = ''; offEl.hidden = false; led.className = 'led off'; powered = false; }
  else boot(function(){ if (!Object.keys(wins).length) openReadme(); });
});

/* ================================================================
   CLOCK
   ================================================================ */
var clock = $('#clock');
function tickClock(){
  var d = new Date();
  clock.textContent = d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
  clock.title = d.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
}
tickClock(); setInterval(tickClock, 15000);
$('#trayLock').addEventListener('click', function(){ openPrivacy(); });

/* ================================================================
   DEEP LINKS (#beta, #references, #tools, #find, #minesweeper, #solitaire, #lemonwire, #privacy, #purge, #open=file.html)
   ================================================================ */
function handleHash(){
  var hsh = decodeURIComponent((location.hash || '').slice(1));
  if (!hsh) return;
  if (hsh === 'beta') openBeta(null);
  else if (hsh === 'references') openRefs();
  else if (hsh === 'tools') toggleStart();
  else if (hsh === 'find') openFind();
  else if (hsh === 'minesweeper') openMines();
  else if (hsh === 'solitaire') openSolitaire();
  else if (hsh === 'lemonwire') openLemonWire();
  else if (hsh === 'privacy' || hsh === 'licence' || hsh === 'license') openPrivacy();
  else if (hsh === 'purge') openPurge();
  else if (hsh.indexOf('open=') === 0){
    var f = hsh.slice(5).toLowerCase(), all = RELEASED.concat(BETA);
    for (var i = 0; i < all.length; i++) if ((all[i].href || '').toLowerCase() === f){ openTool(all[i]); break; }
  } else {
    var cat = catById(hsh);
    if (cat){ if (cat.tools.length === 1) openTool(cat.tools[0]); else if (!cat.tools.length) openBeta(cat.id); else toggleStart(); }
  }
}
window.addEventListener('hashchange', handleHash);

/* ================================================================
   GO
   ================================================================ */
var booted = false;
try { booted = sessionStorage.getItem(KEY + 'booted') === '1'; sessionStorage.setItem(KEY + 'booted', '1'); } catch(e){}
applyWall();
if (booted) startSession(); else boot(startSession);

})();

</script>
