<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UsefulDFIR · incident response and threat intelligence tools by Danny Howett</title>
<meta name="description" content="Free, single-file tools for incident response, readiness assessment and threat intelligence. Everything runs in your browser.">
<meta name="theme-color" content="#14181d">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧰</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   UsefulDFIR 95: the toolset presented as a 1995-era desktop on a CRT.
   Everything is client-side. Preferences live in localStorage only.
   ===================================================================== */
:root{
  --face:#c0c0c0; --hl:#ffffff; --lt:#dfdfdf; --sh:#808080; --dk:#000000;
  --navy:#000080; --title-off:#808080; --sel:#000080; --sel-ink:#ffffff;
  --desk:#008080;
  --ui:"Pixelated MS Sans Serif","MS Sans Serif","Microsoft Sans Serif",Tahoma,"Segoe UI",Geneva,Verdana,sans-serif;
  --mono:"Fixedsys","Courier New",Courier,ui-monospace,monospace;
  --brand:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --room:#14181d;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;overflow:hidden;background:var(--room);
  background:radial-gradient(120% 90% at 50% 0%,#2a333d 0%,#161b21 55%,#0d1014 100%);
  font-family:var(--ui);font-size:12px;color:#000;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
[hidden]{display:none!important}
noscript .nojs{position:fixed;inset:0;overflow:auto;background:#008080;color:#fff;padding:24px;z-index:99;font:14px/1.5 var(--brand)}
noscript .nojs a{color:#fff}

/* ---------------- the monitor ---------------- */
.rig{height:100vh;height:100dvh;display:flex;flex-direction:column;align-items:center;
  padding:clamp(6px,2.2vh,26px) clamp(6px,2.2vw,30px) 0}
.monitor{position:relative;width:100%;max-width:1680px;flex:1 1 auto;min-height:0;display:flex;flex-direction:column;
  background:linear-gradient(180deg,#ebe6d8 0%,#ddd7c6 60%,#cfc8b4 100%);
  border-radius:clamp(10px,1.6vw,22px) clamp(10px,1.6vw,22px) clamp(8px,1vw,14px) clamp(8px,1vw,14px);
  padding:clamp(8px,2vw,30px) clamp(8px,2vw,30px) 0;
  box-shadow:inset 0 2px 0 #fbf8ef,inset 2px 0 0 #f2eee2,inset -2px 0 0 #bdb6a2,inset 0 -3px 0 #ada690,
    0 30px 60px -10px rgba(0,0,0,.65),0 8px 20px rgba(0,0,0,.35)}
.bezel{flex:1 1 auto;min-height:0;border-radius:clamp(6px,1vw,14px);padding:clamp(5px,1.1vw,16px);
  background:linear-gradient(180deg,#26292a,#1a1c1c);
  box-shadow:inset 0 0 0 1px #0b0c0c,inset 0 8px 18px rgba(0,0,0,.85),0 1px 0 #f7f3e8,0 -1px 0 #b9b29d}
.screen{position:relative;height:100%;overflow:hidden;background:#000;border-radius:clamp(4px,.9vw,12px)/clamp(5px,1.1vw,14px);
  isolation:isolate;user-select:none;-webkit-user-select:none}
.screen::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:30000;border-radius:inherit;
  background:radial-gradient(130% 120% at 50% 50%,transparent 62%,rgba(0,0,0,.28) 100%),
    linear-gradient(160deg,rgba(255,255,255,.07) 0%,rgba(255,255,255,0) 32%);}
.screen.crt::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:30001;
  background:repeating-linear-gradient(180deg,rgba(0,0,0,.055) 0 1px,transparent 1px 3px);mix-blend-mode:multiply}
.chin{flex:0 0 auto;height:clamp(30px,5.4vh,56px);display:flex;align-items:center;gap:14px;padding:0 4px}
.badge{display:flex;align-items:baseline;gap:8px;font-family:var(--brand);color:#7b7462;
  text-shadow:0 1px 0 #f7f3e8;white-space:nowrap}
.badge b{font-weight:700;font-size:clamp(11px,1.15vw,15px);letter-spacing:.14em;text-transform:uppercase}
.badge span{font-weight:500;font-size:clamp(9px,.85vw,11.5px);letter-spacing:.04em}
.vents{flex:1;height:10px;min-width:0;opacity:.55;
  background:repeating-linear-gradient(90deg,#b4ad99 0 2px,transparent 2px 7px);
  -webkit-mask:linear-gradient(90deg,transparent,#000 15%,#000 85%,transparent);mask:linear-gradient(90deg,transparent,#000 15%,#000 85%,transparent)}
.ctrls{display:flex;align-items:center;gap:12px}
.led{width:7px;height:7px;border-radius:50%;background:#2fe06b;box-shadow:0 0 6px 1px rgba(47,224,107,.75),inset 0 -1px 1px rgba(0,0,0,.3)}
.led.off{background:#4a4d47;box-shadow:inset 0 1px 1px rgba(0,0,0,.4)}
.led.standby{background:#f0a020;box-shadow:0 0 6px 1px rgba(240,160,32,.7)}
.power{width:clamp(22px,2.2vw,30px);height:clamp(14px,1.4vw,18px);border-radius:4px;border:0;cursor:pointer;
  background:linear-gradient(#e6e0d0,#c9c2ae);box-shadow:inset 0 1px 0 #fff,inset 0 -2px 0 #a7a08b,0 1px 2px rgba(0,0,0,.35)}
.power:active{box-shadow:inset 0 2px 3px rgba(0,0,0,.35)}
.power:focus-visible{outline:2px solid #2fe06b;outline-offset:2px}
.stand{flex:0 0 auto;width:min(26%,300px);height:clamp(8px,2.2vh,24px);
  background:linear-gradient(180deg,#a8a18c,#c9c2ae 40%,#bdb6a1);clip-path:polygon(14% 0,86% 0,100% 100%,0 100%)}
.base{flex:0 0 auto;width:min(40%,460px);height:clamp(5px,1.1vh,12px);border-radius:6px 6px 0 0;
  background:linear-gradient(180deg,#ddd7c6,#bdb6a1);box-shadow:0 -1px 0 #efebdf inset}
@media (max-width:640px){
  .rig{padding:4px 4px 0}
  .monitor{padding:6px 6px 0;border-radius:10px 10px 6px 6px}
  .bezel{padding:4px}
  .chin{height:26px;gap:8px}
  .badge span,.vents{display:none}
  .stand,.base{display:none}
  .rig{padding-bottom:4px}
}
@media (max-height:520px){ .stand,.base{display:none} .rig{padding-bottom:4px} .chin{height:24px} }

/* ---------------- Win95 primitives ---------------- */
.raised{background:var(--face);box-shadow:inset -1px -1px var(--dk),inset 1px 1px var(--hl),inset -2px -2px var(--sh),inset 2px 2px var(--lt)}
.sunken{box-shadow:inset -1px -1px var(--hl),inset 1px 1px var(--sh),inset -2px -2px var(--lt),inset 2px 2px var(--dk)}
.field{background:#fff;box-shadow:inset -1px -1px var(--hl),inset 1px 1px var(--sh),inset -2px -2px var(--lt),inset 2px 2px var(--dk);padding:3px 4px}
.thin-sunk{box-shadow:inset -1px -1px var(--hl),inset 1px 1px var(--sh)}
.btn{min-width:75px;min-height:23px;padding:3px 10px;border:0;border-radius:0;background:var(--face);cursor:pointer;
  box-shadow:inset -1px -1px var(--dk),inset 1px 1px var(--hl),inset -2px -2px var(--sh),inset 2px 2px var(--lt)}
.btn:active:not(:disabled),.btn.pressed{box-shadow:inset -1px -1px var(--hl),inset 1px 1px var(--dk),inset -2px -2px var(--lt),inset 2px 2px var(--sh);padding:4px 9px 2px 11px}
.btn:focus-visible{outline:1px dotted #000;outline-offset:-5px}
.btn.default{box-shadow:inset 0 0 0 1px #000,inset -2px -2px var(--dk),inset 2px 2px var(--hl),inset -3px -3px var(--sh),inset 3px 3px var(--lt)}
.btn:disabled{color:var(--sh);text-shadow:1px 1px 0 var(--hl);cursor:default}
.ico{display:block;flex:0 0 auto}
.screen ::-webkit-scrollbar{width:16px;height:16px;background:#dfdfdf}
.screen ::-webkit-scrollbar-track{background:repeating-conic-gradient(#c0c0c0 0 25%,#fff 0 50%) 0 0/2px 2px}
.screen ::-webkit-scrollbar-thumb{background:var(--face);box-shadow:inset -1px -1px var(--dk),inset 1px 1px var(--lt),inset -2px -2px var(--sh),inset 2px 2px var(--hl)}
.screen ::-webkit-scrollbar-corner{background:var(--face)}
.screen ::-webkit-scrollbar-button:single-button{display:block;width:16px;height:16px;background:var(--face);
  box-shadow:inset -1px -1px var(--dk),inset 1px 1px var(--lt),inset -2px -2px var(--sh),inset 2px 2px var(--hl)}

/* ---------------- desktop ---------------- */
.desktop{position:absolute;inset:0 0 28px 0;overflow:hidden;background-color:var(--desk);background-repeat:repeat}
.icons{position:absolute;inset:0}
.dicon{position:absolute;width:84px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:2px 0;
  border:0;background:none;cursor:default;touch-action:none;color:#fff}
.dicon .dimg{width:32px;height:32px;position:relative}
.dicon .dlab{max-width:84px;padding:1px 2px;line-height:13px;text-align:center;background:var(--desk);
  border:1px dotted transparent;overflow-wrap:break-word;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dicon.sel .dlab{background:var(--sel);color:var(--sel-ink);border-color:#ffff80;-webkit-line-clamp:unset}
.dicon.sel .dimg svg{filter:brightness(.62) sepia(1) hue-rotate(195deg) saturate(5)}
.dicon:focus{outline:none}
.dicon:focus-visible .dlab{border-color:#fff}
.dicon.moving{opacity:.75;z-index:5}
.icons.on-picture .dlab{text-shadow:1px 1px 0 #000,0 0 4px rgba(0,0,0,.8)}
.icons.on-picture .dicon.sel .dlab{text-shadow:none}
.window:focus{outline:none}
.windows{position:absolute;inset:0;pointer-events:none}
.windows > *{pointer-events:auto}

/* ---------------- windows ---------------- */
.window{position:absolute;display:flex;flex-direction:column;padding:3px;background:var(--face);min-width:180px;
  box-shadow:inset -1px -1px var(--dk),inset 1px 1px var(--lt),inset -2px -2px var(--sh),inset 2px 2px var(--hl),2px 2px 0 rgba(0,0,0,.08)}
.window.max{left:0!important;top:0!important;width:100%!important;height:100%!important;box-shadow:none;padding:2px}
.window.auto{height:auto}
.titlebar{flex:0 0 auto;height:18px;display:flex;align-items:center;gap:3px;padding:0 2px 0 2px;
  background:var(--title-off);color:#c0c0c0;font-weight:700;touch-action:none;cursor:default}
.window.active .titlebar{background:var(--navy);color:#fff}
.titlebar .ttext{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:1px}
.tbtns{display:flex;gap:0;flex:0 0 auto}
.tbtn{width:16px;height:14px;border:0;padding:0;display:grid;place-items:center;background:var(--face);cursor:pointer;
  box-shadow:inset -1px -1px var(--dk),inset 1px 1px var(--hl),inset -2px -2px var(--sh),inset 2px 2px var(--lt)}
.tbtn:active{box-shadow:inset -1px -1px var(--hl),inset 1px 1px var(--dk),inset -2px -2px var(--lt),inset 2px 2px var(--sh)}
.tbtn:active svg{transform:translate(1px,1px)}
.tbtn.close{margin-left:2px}
.tbtn:disabled svg{opacity:.4}
.menubar{flex:0 0 auto;display:flex;gap:0;padding:1px 0 2px;flex-wrap:wrap}
.menubar > button{border:1px solid transparent;background:none;padding:1px 6px;cursor:default}
.menubar > button:hover,.menubar > button.menu-open{box-shadow:inset -1px -1px var(--sh),inset 1px 1px var(--hl)}
.menubar > button.menu-open{box-shadow:inset 1px 1px var(--sh),inset -1px -1px var(--hl)}
.menubar u{text-decoration:underline}
.wbody{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;position:relative}
.window.auto .wbody{flex:0 0 auto}
.statusbar{flex:0 0 auto;display:flex;gap:2px;margin-top:2px;height:20px}
.statusbar > span{box-shadow:inset -1px -1px var(--hl),inset 1px 1px var(--sh);padding:2px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:16px}
.statusbar > span:first-child{flex:1;min-width:0}
.grip{position:absolute;right:3px;bottom:3px;width:14px;height:14px;cursor:nwse-resize;touch-action:none;
  background:linear-gradient(135deg,transparent 0 45%,#fff 45% 52%,#808080 52% 62%,transparent 62% 70%,#fff 70% 76%,#808080 76% 86%,transparent 86%)}
.window.max .grip{display:none}
.shield{position:absolute;inset:0;display:none;z-index:2}
.window:not(.active) .shield,.screen.dragging .shield{display:block}
.toolbar{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:3px 2px 4px;border-top:1px solid var(--sh);box-shadow:inset 0 1px 0 var(--hl);flex-wrap:nowrap}
.toolbar label{white-space:nowrap}
.toolbar .field{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;height:22px;display:flex;align-items:center;gap:4px;padding:2px 4px}
.tb-btn{display:flex;align-items:center;gap:4px;min-height:22px;padding:2px 6px;border:0;background:var(--face);cursor:pointer;white-space:nowrap;
  box-shadow:inset -1px -1px var(--dk),inset 1px 1px var(--hl),inset -2px -2px var(--sh),inset 2px 2px var(--lt)}
.tb-btn:active:not(:disabled){box-shadow:inset -1px -1px var(--hl),inset 1px 1px var(--dk),inset -2px -2px var(--lt),inset 2px 2px var(--sh)}
.tb-btn:disabled{color:var(--sh);cursor:default}
.tb-btn:disabled svg{opacity:.45}
.frame-wrap{flex:1 1 auto;min-height:0;position:relative;background:#fff;padding:2px}
.frame-wrap iframe{display:block;width:100%;height:100%;border:0;background:#fff}
.screen.dragging,.screen.dragging *{cursor:move}
.screen.resizing,.screen.resizing *{cursor:nwse-resize}

/* ---------------- menus ---------------- */
.menu{position:absolute;z-index:20000;min-width:150px;padding:2px;background:var(--face);display:flex;flex-direction:column;
  box-shadow:inset -1px -1px var(--dk),inset 1px 1px var(--lt),inset -2px -2px var(--sh),inset 2px 2px var(--hl),2px 2px 0 rgba(0,0,0,.18)}
.mi{display:flex;align-items:center;gap:6px;min-height:20px;padding:1px 6px 1px 4px;border:0;background:none;text-align:left;cursor:default;white-space:nowrap}
.mi .mico{width:16px;height:16px;flex:0 0 16px;display:grid;place-items:center}
.mi .mlab{flex:1}
.mi .marr{margin-left:14px;width:0;height:0;border:4px solid transparent;border-left:4px solid currentColor;border-right:0}
.mi .mkey{margin-left:18px}
.mi:hover:not(:disabled),.mi.sub-open,.mi:focus-visible{background:var(--sel);color:var(--sel-ink);outline:none}
.mi:hover:not(:disabled) svg.mono,.mi.sub-open svg.mono{filter:invert(1)}
.mi:disabled{color:var(--sh);text-shadow:1px 1px 0 var(--hl)}
.msep{height:2px;margin:3px 2px;border-top:1px solid var(--sh);border-bottom:1px solid var(--hl)}
.menu.start{flex-direction:row;padding:3px}
.start-band{width:22px;flex:0 0 22px;background:linear-gradient(0deg,#808080,#808080);position:relative;overflow:hidden}
.start-band span{position:absolute;left:50%;bottom:6px;transform-origin:0 0;transform:rotate(-90deg) translateY(-50%);
  white-space:nowrap;color:#c0c0c0;font:700 17px/1 var(--brand);letter-spacing:.02em}
.start-band span b{color:#fff;font-weight:700}
.start-items{display:flex;flex-direction:column;flex:1;min-width:0}
.menu.start .mi{min-height:32px;gap:8px;padding:2px 10px 2px 4px;min-width:170px}
.menu.start .mi .mico{width:24px;height:24px;flex-basis:24px}
@media (pointer:coarse){ .mi{min-height:30px} .menu.start .mi{min-height:38px} }

/* ---------------- taskbar ---------------- */
.taskbar{position:absolute;left:0;right:0;bottom:0;height:28px;z-index:15000;display:flex;align-items:center;gap:3px;padding:2px 2px 2px 2px;
  background:var(--face);box-shadow:inset 0 1px var(--lt),inset 0 2px var(--hl)}
.startbtn{height:22px;display:flex;align-items:center;gap:3px;padding:2px 5px 2px 3px;border:0;font-weight:700;background:var(--face);cursor:pointer;flex:0 0 auto;
  box-shadow:inset -1px -1px var(--dk),inset 1px 1px var(--hl),inset -2px -2px var(--sh),inset 2px 2px var(--lt)}
.startbtn.pressed{box-shadow:inset -1px -1px var(--hl),inset 1px 1px var(--dk),inset -2px -2px var(--lt),inset 2px 2px var(--sh);padding:3px 4px 1px 4px}
.startbtn.pressed b{outline:1px dotted #000;outline-offset:1px}
.tasks{flex:1;min-width:0;display:flex;gap:3px;overflow:hidden;padding-left:4px;margin-left:2px;border-left:1px solid var(--sh);box-shadow:inset 1px 0 var(--hl)}
.task{height:22px;flex:0 1 160px;min-width:28px;display:flex;align-items:center;gap:4px;padding:2px 4px;border:0;text-align:left;background:var(--face);cursor:pointer;
  box-shadow:inset -1px -1px var(--dk),inset 1px 1px var(--hl),inset -2px -2px var(--sh),inset 2px 2px var(--lt)}
.task span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task.on{font-weight:700;background:repeating-conic-gradient(#c0c0c0 0 25%,#fff 0 50%) 0 0/2px 2px;
  box-shadow:inset -1px -1px var(--hl),inset 1px 1px var(--dk),inset -2px -2px var(--lt),inset 2px 2px var(--sh)}
.tray{flex:0 0 auto;height:22px;display:flex;align-items:center;gap:6px;padding:0 8px 0 6px;box-shadow:inset -1px -1px var(--hl),inset 1px 1px var(--sh)}
.tray button{border:0;background:none;padding:0;cursor:default;display:grid}
@media (max-width:480px){ .task{flex-basis:34px} .task span:last-child{display:none} .tray .tray-ico{display:none} }

/* ---------------- list views (Explorer) ---------------- */
.lv-wrap{flex:1 1 auto;min-height:0;overflow:auto;background:#fff}
.lv-large{display:flex;flex-wrap:wrap;align-content:flex-start;gap:6px 4px;padding:8px}
.lvi{width:84px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:3px 0;border:0;background:none;cursor:default}
.lvi .dlab{max-width:82px;padding:0 2px;text-align:center;line-height:13px;border:1px dotted transparent;overflow-wrap:anywhere}
.lvi.sel .dlab{background:var(--sel);color:#fff}
.lvi.sel svg{filter:brightness(.62) sepia(1) hue-rotate(195deg) saturate(5)}
.lvi:focus{outline:none}.lvi:focus-visible .dlab{border-color:#000}
table.details{border-collapse:separate;border-spacing:0;width:100%;min-width:480px;table-layout:fixed}
table.details th{position:sticky;top:0;z-index:1;text-align:left;font-weight:400;padding:2px 6px;background:var(--face);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  box-shadow:inset -1px -1px var(--dk),inset 1px 1px var(--hl),inset -2px -2px var(--sh)}
table.details td{padding:2px 6px;vertical-align:top;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
table.details td.wrap{white-space:normal}
table.details tr.row{cursor:default}
table.details tr.row td:first-child span.nm{padding:0 2px}
table.details tr.row.sel td:first-child span.nm{background:var(--sel);color:#fff}
table.details td .cell{display:flex;align-items:center;gap:4px}
table.details tr.grp td{padding:8px 6px 3px;font-weight:700;color:var(--navy);border-bottom:1px solid var(--sh)}
table.details a{color:#0000ee}

/* ---------------- notepad ---------------- */
.notepad{flex:1 1 auto;min-height:0;display:flex;background:#fff;padding:2px}
.notepad textarea{flex:1;min-width:0;border:0;resize:none;outline:none;padding:2px 4px;font:13px/1.35 var(--mono);color:#000;background:#fff;user-select:text;-webkit-user-select:text}

/* ---------------- dialogs ---------------- */
.dlg{padding:12px 12px 10px;display:flex;flex-direction:column;gap:12px}
.dlg-row{display:flex;gap:14px;align-items:flex-start}
.dlg-text{line-height:1.45;max-width:46ch;user-select:text;-webkit-user-select:text}
.dlg-text p{margin:0 0 8px}.dlg-text p:last-child{margin:0}
.dlg-text dl{margin:8px 0 0;display:grid;grid-template-columns:auto 1fr;gap:3px 10px}
.dlg-text dt{color:#404040}.dlg-text dd{margin:0}
.dlg-btns{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
.dlg-btns.right{justify-content:flex-end}
.tabs{display:flex;gap:0;padding:0 4px;position:relative;z-index:1}
.tabs button{border:0;background:var(--face);padding:3px 10px 4px;margin-right:-1px;cursor:pointer;position:relative;top:2px;
  box-shadow:inset 1px 1px var(--hl),inset -1px 0 var(--dk),inset -2px 0 var(--sh),inset 2px 2px var(--lt)}
.tabs button[aria-selected="true"]{top:0;padding-bottom:6px;margin:0 -2px;z-index:2}
.tabpanel{padding:12px;box-shadow:inset -1px -1px var(--dk),inset 1px 1px var(--hl),inset -2px -2px var(--sh),inset 2px 2px var(--lt)}
fieldset{border:0;margin:0;padding:10px 8px 8px;box-shadow:inset -1px -1px var(--hl),inset 1px 1px var(--sh),inset -2px -2px var(--sh),inset 2px 2px var(--hl);position:relative}
legend{padding:0 3px;margin-left:-2px}
.listbox{background:#fff;overflow:auto;padding:2px;box-shadow:inset -1px -1px var(--hl),inset 1px 1px var(--sh),inset -2px -2px var(--lt),inset 2px 2px var(--dk)}
.listbox button{display:block;width:100%;text-align:left;border:0;background:none;padding:1px 3px;cursor:default}
.listbox button[aria-selected="true"]{background:var(--sel);color:#fff}
.preview-mon{width:170px;margin:0 auto;display:flex;flex-direction:column;align-items:center}
.pm-case{width:170px;padding:9px 9px 18px;background:linear-gradient(#e9e4d6,#cfc8b4);border-radius:6px;box-shadow:inset 0 1px #fff,inset 0 -2px #aaa38e,1px 2px 0 rgba(0,0,0,.25)}
.pm-scr{height:112px;background-color:var(--desk);background-repeat:repeat;box-shadow:inset 1px 1px #1d1d1d,inset -1px -1px #555;position:relative;overflow:hidden}
.pm-scr::after{content:"";position:absolute;left:0;right:0;bottom:0;height:7px;background:#c0c0c0;box-shadow:inset 0 1px #fff}
.pm-stand{width:60px;height:10px;background:linear-gradient(#bdb6a1,#a8a18c);clip-path:polygon(18% 0,82% 0,100% 100%,0 100%)}
.swatches{display:grid;grid-template-columns:repeat(8,18px);gap:3px}
.swatches button{width:18px;height:18px;border:0;padding:0;cursor:pointer;box-shadow:inset -1px -1px var(--hl),inset 1px 1px var(--sh),inset -2px -2px var(--lt),inset 2px 2px var(--dk)}
.swatches button[aria-pressed="true"]{outline:1px dotted #000;outline-offset:1px}
.radio{display:flex;align-items:center;gap:6px;cursor:pointer}
.radio input,.check input{margin:0;accent-color:#000}
.check{display:flex;align-items:center;gap:6px;cursor:pointer}
input[type=text],input[type=search]{font:inherit;border:0;border-radius:0;background:#fff;padding:3px 4px;min-height:21px;outline:none;user-select:text;-webkit-user-select:text;
  box-shadow:inset -1px -1px var(--hl),inset 1px 1px var(--sh),inset -2px -2px var(--lt),inset 2px 2px var(--dk)}
select{font:inherit;border:0;border-radius:0;background:#fff;min-height:21px;box-shadow:inset -1px -1px var(--hl),inset 1px 1px var(--sh),inset -2px -2px var(--lt),inset 2px 2px var(--dk)}

/* ---------------- boot / off ---------------- */
.boot{position:absolute;inset:0;z-index:25000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:#fff;cursor:pointer;
  background:radial-gradient(ellipse 22% 9% at 18% 24%,rgba(255,255,255,.9),rgba(255,255,255,0) 70%),radial-gradient(ellipse 26% 10% at 72% 18%,rgba(255,255,255,.85),rgba(255,255,255,0) 70%),
    radial-gradient(ellipse 30% 11% at 38% 70%,rgba(255,255,255,.8),rgba(255,255,255,0) 70%),radial-gradient(ellipse 20% 8% at 84% 64%,rgba(255,255,255,.85),rgba(255,255,255,0) 70%),
    linear-gradient(180deg,#2b6fd0,#8dbbef)}
.boot .logo{display:flex;align-items:center;gap:14px;color:#000;text-shadow:none}
.boot .logo b{font:700 clamp(26px,5vw,52px)/1 var(--brand);letter-spacing:-.01em}
.boot .logo i{font:700 clamp(26px,5vw,52px)/1 var(--brand);font-style:normal;color:#fff;-webkit-text-stroke:1px #000}
.boot small{font:500 clamp(11px,1.4vw,15px) var(--brand);color:#0a1a33}
.boot .bar{position:absolute;left:0;right:0;bottom:0;height:10px;overflow:hidden;background:#000}
.boot .bar::before{content:"";position:absolute;inset:0;width:200%;background:linear-gradient(90deg,#000,#0000a8,#00a8ff,#0000a8,#000,#0000a8,#00a8ff,#0000a8,#000);animation:bootbar 1.4s linear infinite}
@keyframes bootbar{to{transform:translateX(-50%)}}
.off{position:absolute;inset:0;z-index:25000;background:#000;display:flex;align-items:center;justify-content:center;padding:20px;text-align:center;
  font:700 clamp(16px,3vw,30px)/1.3 var(--brand);color:#e8902a;cursor:pointer}
.off.black{color:transparent}
@media (prefers-reduced-motion:reduce){ .boot .bar::before{animation:none} }

/* ---------------- minesweeper ---------------- */
.ms{padding:6px;background:var(--face);box-shadow:inset 3px 3px var(--hl),inset -3px -3px var(--sh);display:inline-flex;flex-direction:column;gap:6px;margin:0 auto}
.ms-top{display:flex;align-items:center;justify-content:space-between;padding:4px 6px;box-shadow:inset 2px 2px var(--sh),inset -2px -2px var(--hl)}
.ms-led{display:flex;background:#000;padding:1px;box-shadow:1px 1px 0 var(--hl),-1px -1px 0 var(--sh)}
.ms-face{width:26px;height:26px;border:0;padding:0;display:grid;place-items:center;background:var(--face);cursor:pointer;
  box-shadow:inset -1px -1px var(--sh),inset 1px 1px var(--hl),inset -2px -2px var(--sh),inset 2px 2px var(--hl),0 0 0 1px var(--sh)}
.ms-face:active{box-shadow:inset 1px 1px var(--sh),0 0 0 1px var(--sh)}
.ms-face:active svg{transform:translate(1px,1px)}
.ms-board{display:grid;box-shadow:inset 3px 3px var(--sh),inset -3px -3px var(--hl);padding:3px;touch-action:manipulation;-webkit-touch-callout:none}
.ms-board .c{width:16px;height:16px;display:grid;place-items:center;font:700 13px/1 Tahoma,Verdana,Arial,sans-serif;cursor:default;background:var(--face);
  box-shadow:inset -2px -2px var(--sh),inset 2px 2px var(--hl)}
.ms-board .c.down,.ms-board .c.o{box-shadow:inset 1px 1px var(--sh)}
.ms-board .c.boom{background:#ff0000}
.ms-board .n1{color:#0000ff}.ms-board .n2{color:#008000}.ms-board .n3{color:#ff0000}.ms-board .n4{color:#000080}
.ms-board .n5{color:#800000}.ms-board .n6{color:#008080}.ms-board .n7{color:#000}.ms-board .n8{color:#808080}
.ms-wrap{padding:0;overflow:auto;max-width:100%;max-height:100%;display:flex}

/* ---------------- solitaire ---------------- */
.sol-wrap{flex:1 1 auto;min-height:0;display:flex;padding:2px;background:var(--face)}
.sol{position:relative;flex:1;min-width:0;background:#008000;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;--cw:71px}
.sol .slot{position:absolute;border:1px solid #003c00;border-radius:4px;box-shadow:1px 1px 0 #00a000 inset}
.sol .slot.waste{border-color:transparent;box-shadow:none}
.sol .slot.stock{cursor:pointer}
.sol .slot.stock.recycle::after{content:"";position:absolute;left:50%;top:50%;width:46%;aspect-ratio:1;transform:translate(-50%,-50%);border:calc(var(--cw)*.07) solid #00d000;border-radius:50%;box-sizing:border-box}
.sol .slot.stock.done::after{content:"\2715";position:absolute;inset:0;display:grid;place-items:center;color:#00c000;font:700 calc(var(--cw)*.45)/1 Arial,sans-serif}
.card{position:absolute;box-sizing:border-box;border:1px solid #000;border-radius:calc(var(--cw)*.06);background:#fff;overflow:hidden;cursor:default;
  font:700 calc(var(--cw)*.2)/1 Arial,Helvetica,sans-serif;color:#000;transition:left .12s ease-out,top .12s ease-out}
.card.red{color:#d40000}
.card.drag{transition:none;box-shadow:2px 3px 0 rgba(0,0,0,.35)}
.card.back > *{display:none!important}
.card.back::before{content:"";position:absolute;inset:calc(var(--cw)*.05);border:1px solid #0b2a7a;border-radius:2px;background-color:#1f4fbf;
  background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.38) 0 1px,transparent 1px 5px),repeating-linear-gradient(-45deg,rgba(255,255,255,.38) 0 1px,transparent 1px 5px)}
.card .ci{position:absolute;display:flex;flex-direction:column;align-items:center;width:calc(var(--cw)*.24);letter-spacing:-.05em;line-height:.95}
.card .ci i{font-style:normal;font-size:.95em}
.card .tl{left:1px;top:3px}
.card .br{right:1px;bottom:3px;transform:rotate(180deg)}
.card .pip{position:absolute;transform:translate(-50%,-50%);font-size:calc(var(--cw)*.21);line-height:1}
.card .pip.flip{transform:translate(-50%,-50%) rotate(180deg)}
.card .ace{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:calc(var(--cw)*.55);line-height:1}
.card .fc{position:absolute;inset:17% 22%;border:1px solid currentColor;background:#fbf0cf;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:calc(var(--cw)*.34);line-height:1}
.card .fc i{font-style:normal;font-size:.7em}
.sol-cv{position:absolute;inset:0;z-index:5000;cursor:pointer}
</style>

<noscript><div class="nojs"><h1>UsefulDFIR</h1><p>Tools for incident response, readiness and threat intelligence, by Danny Howett. This page needs JavaScript for its desktop; every tool is linked below.</p><h2>Incident management</h2><ul><li><a href="TRACE-CMS.html">TRACE</a>: Case management for DFIR work. Log evidence with chain of custody and integrity hashes, track IOCs with ATT&amp;CK tagging and automatic defanging, record response actions and regulatory notifications, and build a single incident timeline through to structured closure.</li><li><a href="incident-command-console.html">Incident Command Console</a> (beta): A single-screen war-room dashboard for the incident commander during a live incident.</li><li><a href="incident-timeline-creator.html">Incident Timeline Creator</a> (beta): Capture events as they surface and build a visual timeline as you go.</li><li><a href="ioc-list.html">IOC List</a> (beta): Track indicators as they surface, from IPs and hashes to registry keys, mutexes and CVEs.</li><li><a href="evidence-register.html">Evidence Register</a> (beta): Lightweight register of physical devices and digital artefacts collected during an incident.</li><li><a href="action-tracker.html">Action Tracker</a> (beta): Actions log for live incidents with owners, priorities, due dates and workstreams.</li><li><a href="pir-builder.html">Post-Incident Review Builder</a> (beta): A guided, blameless review to close the loop after an incident.</li></ul><h2>Threat intelligence</h2><ul><li><a href="attack-technique-mapper.html">ATT&amp;CK Technique Mapper</a>: Paste analyst notes or type tools, commands and event IDs to get suggested techniques and sub-techniques. Put them in scope with confidence and evidence, compare with ATT&amp;CK groups and software, and see the mitigations and detection strategies that apply.</li><li><a href="threat-actor-index.html">Threat Actor Index</a> (beta): Searchable reference of 68 threat actor groups across espionage, disruption, financial and hacktivist motivations.</li><li><a href="threat-actor-profiles.html">Threat Actor Profiles</a> (beta): Profiles of key groups covering motivation, typical TTPs, targeted sectors and geography.</li><li><a href="adversary-mindsets.html">Adversary Mindsets</a> (beta): How different adversary types actually think, so &quot;think like an attacker&quot; becomes specific.</li><li><a href="ti-workflow.html">TI Workflow &amp; Dissemination</a> (beta): End-to-end intelligence workflow across the full intelligence lifecycle.</li><li><a href="cti-reference.html">CTI Reference Guide</a> (beta): Intelligence lifecycle, source taxonomy, intelligence types beyond IOCs and email authentication in one reference.</li></ul><h2>Operations &amp; DFIR</h2><ul><li><a href="EmailHeaderAnalyser.html">Email Header Analyser</a>: Paste a message or drop an .eml file to see who it claims to be from against who really sent it: trusted SPF, DKIM, DMARC and ARC results, the delivery path with timing, look-alike domains, deceptive links and attachment hashes.</li><li><a href="psparse.html">psparse</a>: Paste a PowerShell command, command line or Event ID 4104 script block. psparse peels base64, gzip, format-string, char-code and backtick obfuscation layer by layer, explains each part, scores it against 45 detection rules and maps it to ATT&amp;CK v19.2, without ever executing it.</li><li><a href="notelet.html">Notelet</a>: A tabbed notebook that lives in the browser. Notes stay open across sessions until you close them, a Stickies board keeps quick thoughts one click away, and you can search, sort and switch between serif and monospace writing fonts.</li><li><a href="cyber-incident-decision-tree.html">Cyber Incident Decision Tree</a> (beta): Step-by-step triage for active cyber incidents.</li><li><a href="containment-decision-matrix.html">Containment Decision Matrix</a> (beta): Architecture-aware containment options for the incident commander under pressure.</li><li><a href="windows-dfir-walkthrough.html">Windows DFIR Walkthrough</a> (beta): Eight-phase investigation checklist for networked Windows endpoints, including event ID and artefact reference.</li><li><a href="v2dfir-dashboard.html">DFIR Dashboard</a> (beta): Browser-based analysis dashboard for digital forensics and incident response.</li><li><a href="client-portal.html">Mock Client Portal</a> (beta): Demonstration portal showing how findings, incident updates and risk posture could be presented to clients.</li></ul><h2>Readiness &amp; exercises</h2><ul><li><a href="cyber-tabletop-exercise-builder.html">Tabletop Exercise Builder</a>: Twelve incident scenarios personalised to the client&#x27;s technology stack. Plan the run sheet, run the room with an exercise clock, decision log and a participant screen for the projector, then rate objectives and build the improvement plan.</li><li><a href="cyber-readiness-assessment.html">CIRA</a>: Tiered assessment across 8 domains and 40 controls, with sector overlays for 10 regulated industries, threat profiling, a maturity radar with peer benchmarking, improvement and retest tracking, 8 tabletop scenarios and a full PDF report.</li><li><a href="purple-team-exercise-builder.html">Purple Team Exercise Builder</a> (beta): Build a structured purple team exercise from a scenario such as ransomware, IAB access, insider, BEC or living off the land.</li><li><a href="attackers-eye-view.html">Attacker&#x27;s Eye View</a> (beta): Review your defences from the attacker&#x27;s side to see where an intrusion would most likely succeed.</li><li><a href="cyber-incident-lifecycle.html">Cyber Incident Lifecycle</a> (beta): Visual guide to incident phases, from detection through containment, eradication, recovery and lessons learned.</li></ul><h2>Assessment &amp; frameworks</h2><ul><li><a href="v3_NCSC-CAF-v4-Assessment-Tool.html">NCSC CAF v4.0 Assessment</a>: Interactive assessment of all 41 contributing outcomes across the 4 objectives and 14 principles of CAF v4.0 (August 2025), with a risk matrix, improvement plan, maturity radar and exportable report.</li><li><a href="phishing-programme-maturity.html">Phishing Programme Maturity</a>: Six dimensions and 35 controls, from governance and simulation quality to reporting culture, SOC integration and the technical defences around users. Sector and size set the expected tier, and anti-pattern checks flag practices that may be doing harm.</li><li><a href="cyber-maturity-assessment.html">Cyber Maturity Assessment</a>: Score maturity from 0 to 5 against NIST CSF 2.0, ISO/IEC 27001:2022 or CIS Controls v8.1, or your own model. Record evidence, confidence and a target for every area, then get risk-weighted gaps, a prioritised roadmap, an incident readiness view and an indicative CAF crosswalk.</li><li><a href="cisr_assessment.html">CREST CISR Maturity Assessment</a> (beta): Structured evaluation against the CREST Cyber Incident Simulation Review maturity model.</li><li><a href="zero-trust-maturity-assessment.html">Zero Trust Maturity Assessment</a> (beta): Thirty capabilities across the five Zero Trust pillars, mapped to CISA ZTMM v2.0.</li><li><a href="iam-maturity-assessment.html">IAM Maturity Assessment</a> (beta): Thirty-two workforce identity capabilities across eight domains, from joiner-mover-leaver to privileged access.</li><li><a href="control-effectiveness-matrix.html">Control Effectiveness Matrix</a> (beta): Rate how well security controls hold up across threat categories.</li><li><a href="csr_tiers.html">CSR Tiers</a> (beta): Interactive reference for Cyber Security Requirements tiering.</li></ul><h2>Risk</h2><ul><li><a href="supplier-cyber-risk.html">Supplier Cyber Risk Assessment</a> (beta): Right-sized supplier risk assessment with a portfolio view across suppliers.</li><li><a href="cyber-risk-matrix.html">Cyber Risk Matrix</a> (beta): Plot and manage risks by likelihood and impact.</li></ul><h2>Compliance</h2><ul><li><a href="audit-evidence-pack-builder.html">Audit Evidence Pack Builder</a> (beta): Assemble a structured evidence pack for ISO 27001:2022, NCSC CAF v4.0 or NHS DSPT v8.</li><li><a href="sector-cyber-compliance.html">Sector Cyber Compliance Reference</a> (beta): Regulations, frameworks and incident notification duties across 10 UK sectors.</li></ul><h2>OT &amp; industrial</h2><ul><li><a href="ot-incident-triage.html">OT Incident Triage</a> (beta): Safety-first decision support for IT-trained responders facing an OT alert.</li><li><a href="ot-essentials.html">OT Essentials</a> (beta): An orientation to operational technology for readers with an IT background.</li><li><a href="ot-forensics-guide-v2.html">OT Forensics Guide</a> (beta): Forensic investigation in OT/ICS by Purdue level, mapped to ATT&amp;CK for ICS, IEC 62443 and NIST SP 800-82.</li></ul><p><a href="https://github.com/danhowett/useful">github.com/danhowett/useful</a> · <a href="https://www.linkedin.com/in/dannyhowett/">LinkedIn</a></p></div></noscript>

var iconPos = store.get('icons', {});
var iconEls = {};
var CELL_W = 88, CELL_H = 76;
function defaultPos(i){
  var D = deskSize(), per = Math.max(1, Math.floor((D.h - 8) / CELL_H));
  return { x: 4 + Math.floor(i / per) * CELL_W, y: 6 + (i % per) * CELL_H };
}
function layoutIcons(){
  var D = deskSize();
  DESK.forEach(function(d, i){
    var el = iconEls[d.id]; if (!el) return;
    var p = iconPos[d.id] || defaultPos(i);
    var x = Math.max(0, Math.min(D.w - 84, p.x)), y = Math.max(0, Math.min(D.h - 66, p.y));
    el.style.left = x + 'px'; el.style.top = y + 'px';

function selectIcon(el){
  iconsLayer.querySelectorAll('.dicon.sel').forEach(function(x){ if (x !== el) x.classList.remove('sel'); });
  if (el) el.classList.add('sel');
}
function buildIcons(){
  iconsLayer.textContent = '';
  DESK.forEach(function(d){
    var el = h('button', { class: 'dicon', type: 'button', 'data-id': d.id, 'aria-label': d.label + '. Double-click to open.' },
      h('span', { class: 'dimg', html: ico(d.icon, 32) }), h('span', { class: 'dlab', text: d.label }));
    iconEls[d.id] = el;
    var drag = null, justDragged = false;
    el.addEventListener('pointerdown', function(e){
      if (e.button !== 0) return;
      selectIcon(el); Menu.closeAll();
      drag = { sx: e.clientX, sy: e.clientY, ox: el.offsetLeft, oy: el.offsetTop, moved: false, id: e.pointerId };
      el.setPointerCapture(e.pointerId);
    });
    el.addEventListener('pointermove', function(e){
      if (!drag) return;
      var dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
      if (!drag.moved && Math.abs(dx) + Math.abs(dy) < 5) return;
      drag.moved = true; el.classList.add('moving');
      var D = deskSize();
      el.style.left = Math.max(0, Math.min(D.w - 84, drag.ox + dx)) + 'px';
      el.style.top = Math.max(0, Math.min(D.h - 66, drag.oy + dy)) + 'px';
    });
    function end(){
      if (!drag) return;
      if (drag.moved){
        el.classList.remove('moving');
        var x = Math.round(el.offsetLeft / 4) * 4, y = Math.round(el.offsetTop / 4) * 4;
        el.style.left = x + 'px'; el.style.top = y + 'px';
        iconPos[d.id] = { x: x, y: y }; store.set('icons', iconPos);
        justDragged = true; setTimeout(function(){ justDragged = false; }, 50);
      }
      drag = null;
    }
    el.addEventListener('pointerup', end);
    el.addEventListener('pointercancel', end);
    el.addEventListener('click', function(){ if (justDragged) return; if (lastPointer !== 'mouse') d.open(); });
    el.addEventListener('dblclick', function(){ if (!justDragged) d.open(); });
    el.addEventListener('keydown', function(e){ if (e.key === 'Enter'){ e.preventDefault(); d.open(); } });
    el.addEventListener('focus', function(){ selectIcon(el); });
    el.addEventListener('contextmenu', function(e){

  layoutIcons();
}
function arrangeIcons(){ iconPos = {}; store.del('icons'); layoutIcons(); }
function lineUp(){

  return s.split('').map(function(ch){
    var on = SEG[ch] || '';
    return '<svg width="13" height="23" viewBox="0 0 13 23" shape-rendering="crispEdges">' + 'abcdefg'.split('').map(function(k){
      var r = SEGR[k]; return '<rect x="' + r[0] + '" y="' + r[1] + '" width="' + r[2] + '" height="' + r[3] + '" fill="' + (on.indexOf(k) > -1 ? '#ff0000' : '#400000') + '"/>';

}

    : kind === 'o' ? '<circle cx="12" cy="16.5" r="2" fill="none" stroke="#000" stroke-width="1.3"/>'
    : '<path d="M7.5 14q4.5 4.5 9 0" fill="none" stroke="#000" stroke-width="1.3"/>';
  return '<svg width="20" height="20" viewBox="2 2 20 20"><circle cx="12" cy="12" r="8.5" fill="#ffff00" stroke="#000"/>' + eyes + mouth + '</svg>';

  function newGame(){
    if (g) clearInterval(g.timer);

      wrap.style.maxHeight = Math.max(120, D.h - 60) + 'px';

  }
  function setFace(k){ face.innerHTML = faceSVG(k); }
  function nb(c){
    var out = [];
    for (var dr = -1; dr <= 1; dr++) for (var dc = -1; dc <= 1; dc++){
      if (!dr && !dc) continue;
      var r = c.r + dr, cc = c.c + dc;

  }
  function plant(safe){

    g.cells.forEach(function(c){ c.n = nb(c).filter(function(x){ return x.mine; }).length; });

  function draw(c){

    function launch(){
      var c = queue.shift();
      if (!c){ stopCascade(); return; }
      c.el.style.visibility = 'hidden';
      cur = { img: cardImage(c), x: c.el.offsetLeft, y: c.el.offsetTop, vx: (Math.random() * 5 + 2) * (Math.random() < .5 ? -1 : 1), vy: -Math.random() * 8 - 2 };
    }
    function frame(){
      if (!cascade) return;
      for (var step = 0; step < 2; step++){
        cur.x += cur.vx; cur.vy += 0.55; cur.y += cur.vy;
        if (cur.y + ch > H){ cur.y = H - ch; cur.vy = -cur.vy * 0.78; }
        ctx.drawImage(cur.img, Math.round(cur.x), Math.round(cur.y));
        if (cur.x + cw < 0 || cur.x > W){ launch(); if (!cascade) return; }
      }
      raf = requestAnimationFrame(frame);
    }
    launch(); raf = requestAnimationFrame(frame);
  }
  function stopCascade(silent){
    if (!cascade) return;
    cascade.stop(); cascade.cv.remove(); cascade = null;
    if (!silent){ cards.forEach(function(c){ c.el.style.visibility = ''; }); dealAgain(); }
  }
  function dealAgain(){
    msgBox({ title: 'Solitaire', icon: 'cards', text: 'Congratulations, you won! Score: ' + score + '. Deal again?', buttons: ['Yes', 'No'],
      onButton: function(b){ if (b === 'Yes') deal(); } });
  }

  deal();
  requestAnimationFrame(layout);
  return api;
}

/* ================================================================
   START MENU
   ================================================================ */
function startItems(){
  var programs = CATS.filter(function(c){ return c.tools.length; }).map(function(c){
    return { label: esc(c.name), icon: ico('programs', 16), sub: c.tools.map(function(t){
      return { label: esc(t.name) + (t.ver ? ' <span style="opacity:.75">' + esc(t.ver) + '</span>' : ''), icon: toolIcon(t, 16), title: t.full + ': ' + t.desc, action: function(){ openTool(t); } };
    }) };
  });
  programs.push({ sep: true });
  programs.push({ label: 'Accessories', icon: ico('programs', 16), sub: [
    { label: 'Games', icon: ico('programs', 16), sub: [
      { label: 'Minesweeper', icon: ico('mine', 16), action: function(){ openMines(); } },
      { label: 'Solitaire', icon: ico('cards', 16), action: function(){ openSolitaire(); } }] },
    { label: 'Notepad: README.TXT', icon: ico('notepad', 16), action: function(){ openReadme(); } }] });
  programs.push({ label: 'Beta Tools', icon: ico('folder', 16), action: function(){ openBeta(null); } });
  var docs = [];
  REFS.forEach(function(g){ g.docs.forEach(function(d){ docs.push({ label: esc(d[0]) + ' (' + esc(d[3]) + ')', icon: ico('doc', 16), title: d[1], action: function(){ newTab(d[2]); } }); }); });
  docs.push({ sep: true }, { label: 'README.TXT', icon: ico('notepad', 16), action: function(){ openReadme(); } }, { label: 'References', icon: ico('book', 16), action: function(){ openRefs(); } });
  return [
    { label: '<u>P</u>rograms', icon: 'programs', sub: programs },
    { label: '<u>D</u>ocuments', icon: 'documents', sub: docs },
    { label: '<u>S</u>ettings', icon: 'settings', sub: [{ label: 'Display', icon: ico('monitor', 16), action: function(){ openDisplay(); } }, { label: 'Reset icon positions', icon: ico('large', 16), action: arrangeIcons }] },
    { label: '<u>F</u>ind', icon: 'find', sub: [{ label: 'Tools…', icon: ico('find', 16), action: function(){ openFind(); } }] },
    { label: '<u>H</u>elp', icon: 'help', action: function(){ openReadme(); } },
    { label: 'UsefulDFIR on <u>G</u>itHub', icon: 'globe', action: function(){ newTab(GITHUB); } },
    { label: 'Danny Howett on <u>L</u>inkedIn', icon: 'card', action: function(){ newTab(LINKEDIN); } },
    { sep: true },
    { label: 'Sh<u>u</u>t Down…', icon: 'power', action: shutDownDialog }
  ];
}
function toggleStart(){
  if (startBtn.classList.contains('pressed')){ Menu.closeAll(); return; }
  Menu.closeAll();
  var el = Menu.open(startItems(), { rect: startBtn.getBoundingClientRect(), side: 'up' }, { start: true, owner: null });
  startBtn.classList.add('pressed'); startBtn.setAttribute('aria-expanded', 'true');
  if (lastPointer !== 'mouse' || document.activeElement === startBtn){ var f = el.querySelector('.mi'); f && f.focus({ preventScroll: true }); }
}
startBtn.addEventListener('click', function(e){ e.stopPropagation(); toggleStart(); });
document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && e.ctrlKey){ e.preventDefault(); toggleStart(); } });

/* ================================================================
   POWER: shut down, restart, boot
   ================================================================ */
var bootEl = $('#boot'), offEl = $('#off'), led = $('#led'), powered = true;
function boot(cb){
  offEl.hidden = true; led.className = 'led'; powered = true;
  if (reduceMotion){ cb && cb(); return; }
  bootEl.hidden = false;
  var done = false;
  function finish(){ if (done) return; done = true; bootEl.hidden = true; cb && cb(); }
  bootEl.onclick = finish;
  setTimeout(finish, 1500);
}
function startSession(){ applyWall(); buildIcons(); openReadme(); handleHash(); }
function shutDownDialog(){
  var r1 = h('input', { type: 'radio', name: 'sd', checked: true }), r2 = h('input', { type: 'radio', name: 'sd' });
  msgBox({ title: 'Shut Down UsefulDFIR', icon: 'power', text: 'Are you sure you want to:',
    extra: h('div', { style: 'display:flex;flex-direction:column;gap:6px;padding-left:46px' }, h('label', { class: 'radio' }, r1, h('span', { text: 'Shut down the computer?' })), h('label', { class: 'radio' }, r2, h('span', { text: 'Restart the computer?' }))),
    buttons: ['Yes', 'No'], onButton: function(b){ if (b !== 'Yes') return; setTimeout(function(){ if (r2.checked) restart(); else shutDown(); }, 0); } });
}
function shutDown(){
  Menu.closeAll(); closeAllWindows();
  offEl.className = 'off'; offEl.textContent = "It's now safe to turn off your computer."; offEl.hidden = false;
  led.className = 'led standby'; powered = false;
}
function restart(){ Menu.closeAll(); closeAllWindows(); offEl.className = 'off black'; offEl.textContent = ''; offEl.hidden = false; setTimeout(function(){ boot(function(){ openReadme(); }); }, 500); }
offEl.addEventListener('click', function(){ boot(function(){ openReadme(); }); });
$('#power').addEventListener('click', function(){
  if (powered){ Menu.closeAll(); offEl.className = 'off black'; offEl.textContent = ''; offEl.hidden = false; led.className = 'led off'; powered = false; }
  else boot(function(){ if (!Object.keys(wins).length) openReadme(); });
});

/* ================================================================
   CLOCK
   ================================================================ */
var clock = $('#clock');
function tickClock(){
  var d = new Date();
  clock.textContent = d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
  clock.title = d.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
}
tickClock(); setInterval(tickClock, 15000);
$('#trayLock').addEventListener('click', function(){ msgBox({ title: 'Privacy', icon: 'lock', text: '0 bytes uploaded. Every tool is a single HTML file that runs entirely in your browser, so you can use them offline or on an air-gapped analysis machine.' }); });

/* ================================================================
   DEEP LINKS (#beta, #references, #tools, #find, #minesweeper, #open=file.html)
   ================================================================ */
function handleHash(){
  var hsh = decodeURIComponent((location.hash || '').slice(1));
  if (!hsh) return;
  if (hsh === 'beta') openBeta(null);
  else if (hsh === 'references') openRefs();
  else if (hsh === 'tools') toggleStart();
  else if (hsh === 'find') openFind();
  else if (hsh === 'minesweeper') openMines();
  else if (hsh === 'solitaire') openSolitaire();
  else if (hsh.indexOf('open=') === 0){
    var f = hsh.slice(5).toLowerCase(), all = RELEASED.concat(BETA);
    for (var i = 0; i < all.length; i++) if ((all[i].href || '').toLowerCase() === f){ openTool(all[i]); break; }
  } else {
    var cat = catById(hsh);
    if (cat){ if (cat.tools.length === 1) openTool(cat.tools[0]); else if (!cat.tools.length) openBeta(cat.id); else toggleStart(); }
  }
}
window.addEventListener('hashchange', handleHash);

/* ================================================================
   GO
   ================================================================ */
var booted = false;
try { booted = sessionStorage.getItem(KEY + 'booted') === '1'; sessionStorage.setItem(KEY + 'booted', '1'); } catch(e){}
applyWall();
if (booted) startSession(); else boot(startSession);

})();

</script>
